, beginning with practice in one’s own life.","correct":false}],"hint":"Review “Put understanding into practice” and James 1:22.","bibleLinks":[{"label":"James 1:22 · KJV","url":"https://www.biblegateway.com/passage/?search=James%201%3A22&version=KJV"},{"label":"1 Corinthians 10:31 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2010%3A31&version=KJV"}]}]},{"id":"sanctuary","title":"The Sanctuary","group":"Prophecy & Christian hope","icon":"book-open","description":"God dwelling with His people, Christ’s sacrifice, and His ministry in heaven.","verse":"Exodus 25:8","verseText":"And let them make me a sanctuary; that I may dwell among them.","items":[{"id":"sanctuary-01","title":"God desires to dwell with us","bible":["Exodus 25:8","Hebrews 8:1–5"],"egw":[{"book":"GC","chapter":23,"pages":"413–414","label":"The Great Controversy, 413–414","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"}],"reading":"God asked Israel to build a sanctuary so that He could dwell among His people. Its worship taught the way of approach to a holy God through the promised Redeemer. Moses followed the pattern God showed him; the earthly tabernacle pointed to the heavenly sanctuary.","reflect":"How does God’s desire to dwell with His people shape your picture of Him?","flashQuestion":"Why did God ask Israel to make a sanctuary?","flashAnswer":"So that He might dwell among His people.","question":"What purpose does God state for the sanctuary in Exodus 25:8?","options":[{"text":"To keep His presence permanently beyond reach.","feedback":"The invitation is to dwell among His people, although His holiness requires reverence.","correct":false},{"text":"To dwell among His people.","feedback":"God asked Israel to build a sanctuary so that He could dwell among His people. Its worship taught the way of approach to a holy God through the promised Redeemer. Moses followed the pattern God showed him; the earthly tabernacle pointed to the heavenly sanctuary.","correct":true},{"text":"To replace personal trust with ceremonies.","feedback":"The services taught faith in the Redeemer; the building could not replace faith.","correct":false},{"text":"To centralize Israel’s royal government.","feedback":"The verse gives God’s presence as the purpose, not the establishment of a monarchy.","correct":false}],"hint":"Review “God desires to dwell with us” and Exodus 25:8.","bibleLinks":[{"label":"Exodus 25:8 · KJV","url":"https://www.biblegateway.com/passage/?search=Exodus%2025%3A8&version=KJV"},{"label":"Hebrews 8:1–5 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%208%3A1-5&version=KJV"}]},{"id":"sanctuary-02","title":"The Lamb to whom the offerings pointed","bible":["John 1:29","Hebrews 10:4–12"],"egw":[{"book":"GC","chapter":23,"pages":"417–418","label":"The Great Controversy, 417–418","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"},{"book":"GC","chapter":18,"pages":"327.3","label":"The Great Controversy, 327.3","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"}],"reading":"Animal sacrifices could not themselves take away sin. They directed faith to Jesus, the Lamb of God. His death fulfilled the sacrificial types. His heavenly ministry applies the benefits of His sacrifice; it is not a repeated death or another animal offering.","reflect":"Why does the sanctuary study begin with Christ’s sacrifice?","flashQuestion":"Whom did the sacrificial offerings foreshadow?","flashAnswer":"Jesus Christ, the Lamb of God, who offered Himself for sinners.","question":"A learner says that animal blood itself removed the guilt of sin. Which correction follows Hebrews 10?","options":[{"text":"Animal sacrifices must continue alongside Christ’s death.","feedback":"Christ fulfilled the sacrificial types; His offering is not supplemented by animal deaths.","correct":false},{"text":"The offerings made faith in a Redeemer unnecessary.","feedback":"The types directed the worshipper’s faith to the promised Redeemer.","correct":false},{"text":"The offerings pointed to Christ, whose sacrifice deals with sin.","feedback":"Animal sacrifices could not themselves take away sin. They directed faith to Jesus, the Lamb of God. His death fulfilled the sacrificial types. His heavenly ministry applies the benefits of His sacrifice; it is not a repeated death or another animal offering.","correct":true},{"text":"The animals saved only those who could afford them.","feedback":"The issue is the power of the sacrifice, not the worshipper’s wealth.","correct":false}],"hint":"Review “The Lamb to whom the offerings pointed” and John 1:29.","bibleLinks":[{"label":"John 1:29 · KJV","url":"https://www.biblegateway.com/passage/?search=John%201%3A29&version=KJV"},{"label":"Hebrews 10:4–12 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%2010%3A4-12&version=KJV"}]},{"id":"sanctuary-03","title":"Our living High Priest","bible":["Hebrews 8:1–2","Hebrews 7:25","Hebrews 4:14–16"],"egw":[{"book":"GC","chapter":23,"pages":"413–417","label":"The Great Controversy, 413–417","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"}],"reading":"Jesus ministers for us in the true tabernacle in heaven. He lives to intercede for those who come to God through Him. Because our High Priest understands our weakness, we may approach the throne of grace for mercy and help in temptation.","reflect":"What need can you bring to Christ with confidence today?","flashQuestion":"Where does Jesus minister as our High Priest?","flashAnswer":"In the true sanctuary in heaven, interceding for those who come to God through Him.","question":"What is the believer invited to do because Jesus is our High Priest?","options":[{"text":"Treat heavenly intercession as already unnecessary.","feedback":"Hebrews describes Jesus as living to make intercession.","correct":false},{"text":"Wait until temptation has disappeared before approaching.","feedback":"Hebrews offers help in time of need, including temptation.","correct":false},{"text":"Come to the throne of grace for mercy and help.","feedback":"Jesus ministers for us in the true tabernacle in heaven. He lives to intercede for those who come to God through Him. Because our High Priest understands our weakness, we may approach the throne of grace for mercy and help in temptation.","correct":true},{"text":"Find another mediator who understands human weakness.","feedback":"Jesus Himself understands our weakness and is our sufficient High Priest.","correct":false}],"hint":"Review “Our living High Priest” and Hebrews 8:1–2.","bibleLinks":[{"label":"Hebrews 8:1–2 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%208%3A1-2&version=KJV"},{"label":"Hebrews 7:25 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%207%3A25&version=KJV"},{"label":"Hebrews 4:14–16 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%204%3A14-16&version=KJV"}]},{"id":"sanctuary-04","title":"The Day of Atonement","bible":["Leviticus 16:29–34","Leviticus 23:27"],"egw":[{"book":"GC","chapter":23,"pages":"418–420","label":"The Great Controversy, 418–420","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"}],"reading":"The annual Day of Atonement fell on the tenth day of the seventh month. Its service involved the cleansing of the sanctuary and the removal of sin. The people were to humble themselves before God. This annual work was distinct from the daily ministry.","reflect":"What does humble self-examination mean in your walk with God?","flashQuestion":"When was the annual Day of Atonement?","flashAnswer":"On the tenth day of the seventh month.","question":"Which date does Leviticus assign to the Day of Atonement?","options":[{"text":"The fourteenth day of the first month.","feedback":"That is the date of Passover, not the Day of Atonement.","correct":false},{"text":"The first day of the seventh month.","feedback":"That day is the memorial of blowing of trumpets.","correct":false},{"text":"The fifteenth day of the seventh month.","feedback":"That begins the Feast of Tabernacles.","correct":false},{"text":"The tenth day of the seventh month.","feedback":"The annual Day of Atonement fell on the tenth day of the seventh month. Its service involved the cleansing of the sanctuary and the removal of sin. The people were to humble themselves before God. This annual work was distinct from the daily ministry.","correct":true}],"hint":"Review “The Day of Atonement” and Leviticus 16:29–34.","bibleLinks":[{"label":"Leviticus 16:29–34 · KJV","url":"https://www.biblegateway.com/passage/?search=Leviticus%2016%3A29-34&version=KJV"},{"label":"Leviticus 23:27 · KJV","url":"https://www.biblegateway.com/passage/?search=Leviticus%2023%3A27&version=KJV"}]},{"id":"sanctuary-05","title":"What began in 1844","bible":["Daniel 8:14","Daniel 7:9–10","Revelation 14:7"],"egw":[{"book":"GC","chapter":23,"pages":"421.3–422.1","label":"The Great Controversy, 421.3–422.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"},{"book":"GC","chapter":24,"pages":"424.1","label":"The Great Controversy, 424.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm"}],"reading":"At the end of the 2,300 prophetic years in 1844, Christ entered the most holy place to begin the closing work of atonement and investigative judgment. The Great Controversy distinguishes this heavenly event from His future return to earth. The disappointment concerned the event expected at the end of the period.","reflect":"How does knowing the event clarify the meaning of 1844?","flashQuestion":"What sanctuary work began in 1844?","flashAnswer":"Christ’s closing ministry in the most holy place, including the investigative judgment.","question":"Which event does The Great Controversy identify with the end of the 2,300 years?","options":[{"text":"Christ’s visible return to gather the redeemed.","feedback":"The expected return to earth was the mistaken identification of the event.","correct":false},{"text":"Christ’s entrance into the most holy place for His closing ministry.","feedback":"At the end of the 2,300 prophetic years in 1844, Christ entered the most holy place to begin the closing work of atonement and investigative judgment. The Great Controversy distinguishes this heavenly event from His future return to earth. The disappointment concerned the event expected at the end of the period.","correct":true},{"text":"The beginning of Christ’s sacrificial death.","feedback":"Christ died at Calvary centuries before 1844.","correct":false},{"text":"The rebuilding of the earthly sanctuary in Jerusalem.","feedback":"The sanctuary in this explanation is the true tabernacle in heaven.","correct":false}],"hint":"Review “What began in 1844” and Daniel 8:14.","bibleLinks":[{"label":"Daniel 8:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%208%3A14&version=KJV"},{"label":"Daniel 7:9–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%207%3A9-10&version=KJV"},{"label":"Revelation 14:7 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A7&version=KJV"}]},{"id":"sanctuary-06","title":"An Advocate and a call to repentance","bible":["1 John 2:1–2","Acts 3:19","Hebrews 4:16"],"egw":[{"book":"GC","chapter":28,"pages":"482.4–484.2","label":"The Great Controversy, 482.4–484.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-28.htm"},{"book":"GC","chapter":24,"pages":"425.1","label":"The Great Controversy, 425.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm"}],"reading":"Jesus is the Advocate of those who come to Him in repentance and faith. The judgment calls us to confess and forsake sin, depending on His righteousness and cleansing power. Confidence in Christ and earnest preparation belong together; the sanctuary message invites a living relationship with our Saviour.","reflect":"What would it mean to trust your Advocate while responding honestly to His correction?","flashQuestion":"How should we respond to Christ’s judgment-hour ministry?","flashAnswer":"With repentance, faith in His righteousness, and cooperation with His work of cleansing.","question":"Which response joins Christ’s advocacy with the call to prepare?","options":[{"text":"Attempt to face the judgment in personal merit.","feedback":"Our acceptance rests on Christ’s righteousness, not personal merit.","correct":false},{"text":"Confess and forsake sin while trusting Christ’s righteousness.","feedback":"Jesus is the Advocate of those who come to Him in repentance and faith. The judgment calls us to confess and forsake sin, depending on His righteousness and cleansing power. Confidence in Christ and earnest preparation belong together; the sanctuary message invites a living relationship with our Saviour.","correct":true},{"text":"Rely on a clean outward reputation before others.","feedback":"Outward reputation cannot replace repentance and faith in Christ.","correct":false},{"text":"Assume advocacy makes repentance optional.","feedback":"The benefits of Christ’s ministry are received through repentance and faith.","correct":false}],"hint":"Review “An Advocate and a call to repentance” and 1 John 2:1–2.","bibleLinks":[{"label":"1 John 2:1–2 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%202%3A1-2&version=KJV"},{"label":"Acts 3:19 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%203%3A19&version=KJV"},{"label":"Hebrews 4:16 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%204%3A16&version=KJV"}]},{"id":"sanctuary-07","title":"The ark and the mercy seat","bible":["Exodus 25:16–22","Hebrews 9:3–5"],"egw":[{"book":"GC","chapter":23,"pages":"412.2","label":"The Great Controversy, 412.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm"}],"reading":"The ark in the most holy place contained the two tables of the Ten Commandments. Above it was the mercy seat, with a cherub at each end. God promised to meet with Moses there. The arrangement brings God’s holy law and His merciful provision together within the sanctuary service.","reflect":"What does the presence of both the law and the mercy seat help you understand about God?","flashQuestion":"What did the ark contain, and what was above it?","flashAnswer":"The tables of the Ten Commandments were inside; the mercy seat was above.","question":"Which description of the most holy place follows Exodus 25 and GC 412.2?","options":[{"text":"The ark held the Ten Commandments, with the mercy seat above it.","feedback":"The ark in the most holy place contained the two tables of the Ten Commandments. Above it was the mercy seat, with a cherub at each end. God promised to meet with Moses there. The arrangement brings God’s holy law and His merciful provision together within the sanctuary service.","correct":true},{"text":"The ark held the lampstand, with the altar of incense above it.","feedback":"The lampstand and incense altar were separate furnishings, not the contents and cover of the ark.","correct":false},{"text":"The ark held the table of shewbread, with a veil as its cover.","feedback":"The table was separate; the ark’s cover was the mercy seat.","correct":false},{"text":"The ark held the bronze altar, with the laver above it.","feedback":"The bronze altar and laver belonged to the courtyard, not inside the ark.","correct":false}],"hint":"Review “The ark and the mercy seat” and Exodus 25:16–22.","bibleLinks":[{"label":"Exodus 25:16–22 · KJV","url":"https://www.biblegateway.com/passage/?search=Exodus%2025%3A16-22&version=KJV"},{"label":"Hebrews 9:3–5 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%209%3A3-5&version=KJV"}]}]},{"id":"2300-days","title":"The 2,300 Days","group":"Prophecy & Christian hope","icon":"compass","description":"Daniel 8 and 9, the seventy weeks, and October 22, 1844.","verse":"Daniel 8:14","verseText":"And he said unto me, Unto two thousand and three hundred days; then shall the sanctuary be cleansed.","items":[{"id":"2300-days-01","title":"The period and the promised event","bible":["Daniel 8:14","Numbers 14:34","Ezekiel 4:6"],"egw":[{"book":"GC","chapter":18,"pages":"324–325","label":"The Great Controversy, 324–325","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"}],"reading":"Daniel 8:14 joins a time period with the cleansing of the sanctuary. The Great Controversy explains the 2,300 symbolic days as 2,300 years, using the prophetic day-for-a-year principle. This is the application to this symbolic prophecy, not a claim that every Bible reference to a day means a year.","reflect":"Why should the event and the time period be studied together?","flashQuestion":"What period do the 2,300 prophetic days represent in this study?","flashAnswer":"2,300 years, ending with the sanctuary’s cleansing.","question":"How does The Great Controversy explain the 2,300 symbolic days?","options":[{"text":"As seventy literal days.","feedback":"The seventy weeks are a related portion, not a replacement for the 2,300 days.","correct":false},{"text":"As 2,300 ordinary twenty-four-hour days only.","feedback":"GC 324 applies the prophetic day-for-a-year principle here.","correct":false},{"text":"As 2,300 years in this prophetic period.","feedback":"Daniel 8:14 joins a time period with the cleansing of the sanctuary. The Great Controversy explains the 2,300 symbolic days as 2,300 years, using the prophetic day-for-a-year principle. This is the application to this symbolic prophecy, not a claim that every Bible reference to a day means a year.","correct":true},{"text":"As proof that every biblical day means one year.","feedback":"The principle is applied to symbolic prophetic time, not every use of “day.”","correct":false}],"hint":"Review “The period and the promised event” and Daniel 8:14.","bibleLinks":[{"label":"Daniel 8:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%208%3A14&version=KJV"},{"label":"Numbers 14:34 · KJV","url":"https://www.biblegateway.com/passage/?search=Numbers%2014%3A34&version=KJV"},{"label":"Ezekiel 4:6 · KJV","url":"https://www.biblegateway.com/passage/?search=Ezekiel%204%3A6&version=KJV"}]},{"id":"2300-days-02","title":"The seventy weeks and their starting point","bible":["Daniel 9:24–25","Ezra 6:14","Ezra 7:12–26"],"egw":[{"book":"GC","chapter":18,"pages":"325.2–327.1","label":"The Great Controversy, 325.2–327.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"}],"reading":"Gabriel’s explanation in Daniel 9 supplies the starting point: the commandment to restore and build Jerusalem. The Great Controversy connects the seventy weeks, or 490 years, to the longer period. It identifies the completed decree of Artaxerxes, effective in autumn 457 B.C., following the work of Cyrus and Darius.","reflect":"Why is a defined starting point necessary before calculating an ending?","flashQuestion":"What starts the seventy weeks and the 2,300 years?","flashAnswer":"The commandment to restore Jerusalem, completed under Artaxerxes and effective in autumn 457 B.C.","question":"Which starting point is identified in GC 326–327?","options":[{"text":"The crucifixion of Christ in A.D. 31.","feedback":"The crucifixion belongs within the final week, not at the starting point.","correct":false},{"text":"The disappointment in autumn 1844.","feedback":"1844 is the ending of the longer period, not its beginning.","correct":false},{"text":"The destruction of Jerusalem in A.D. 70.","feedback":"That event is not the commandment to restore and build Jerusalem.","correct":false},{"text":"The completed restoration decree, effective in autumn 457 B.C.","feedback":"Gabriel’s explanation in Daniel 9 supplies the starting point: the commandment to restore and build Jerusalem. The Great Controversy connects the seventy weeks, or 490 years, to the longer period. It identifies the completed decree of Artaxerxes, effective in autumn 457 B.C., following the work of Cyrus and Darius.","correct":true}],"hint":"Review “The seventy weeks and their starting point” and Daniel 9:24–25.","bibleLinks":[{"label":"Daniel 9:24–25 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%209%3A24-25&version=KJV"},{"label":"Ezra 6:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Ezra%206%3A14&version=KJV"},{"label":"Ezra 7:12–26 · KJV","url":"https://www.biblegateway.com/passage/?search=Ezra%207%3A12-26&version=KJV"}]},{"id":"2300-days-03","title":"Sixty-nine weeks point to the Messiah","bible":["Daniel 9:25","Luke 3:21–23","Acts 10:38","Mark 1:14–15"],"egw":[{"book":"GC","chapter":18,"pages":"327.1","label":"The Great Controversy, 327.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"}],"reading":"Seven weeks plus sixty-two weeks make sixty-nine weeks, or 483 prophetic years. From autumn 457 B.C., they reach autumn A.D. 27, when Christ was baptized and anointed by the Holy Spirit. There is no year zero between B.C. and A.D. dates. This prophecy centers on the Messiah.","reflect":"How does the Messiah’s place in the prophecy strengthen its gospel meaning?","flashQuestion":"What event marks the end of the sixty-nine weeks?","flashAnswer":"Christ’s baptism and anointing in autumn A.D. 27.","question":"Which event does GC 327.1 place at the end of the 483 years?","options":[{"text":"Christ’s entry into the most holy place.","feedback":"That is connected with the end of the longer 2,300-year period.","correct":false},{"text":"Jesus’ baptism and anointing by the Holy Spirit.","feedback":"Seven weeks plus sixty-two weeks make sixty-nine weeks, or 483 prophetic years. From autumn 457 B.C., they reach autumn A.D. 27, when Christ was baptized and anointed by the Holy Spirit. There is no year zero between B.C. and A.D. dates. This prophecy centers on the Messiah.","correct":true},{"text":"Stephen’s martyrdom.","feedback":"That is associated with the close of the seventy weeks, not the sixty-nine.","correct":false},{"text":"Jesus’ birth in Bethlehem.","feedback":"The passage identifies His anointing at baptism, not His birth.","correct":false}],"hint":"Review “Sixty-nine weeks point to the Messiah” and Daniel 9:25.","bibleLinks":[{"label":"Daniel 9:25 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%209%3A25&version=KJV"},{"label":"Luke 3:21–23 · KJV","url":"https://www.biblegateway.com/passage/?search=Luke%203%3A21-23&version=KJV"},{"label":"Acts 10:38 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%2010%3A38&version=KJV"},{"label":"Mark 1:14–15 · KJV","url":"https://www.biblegateway.com/passage/?search=Mark%201%3A14-15&version=KJV"}]},{"id":"2300-days-04","title":"The midst and close of the final week","bible":["Daniel 9:27","Matthew 27:50–51","Acts 7:54–60","Acts 8:1–4"],"egw":[{"book":"GC","chapter":18,"pages":"327.2–328.1","label":"The Great Controversy, 327.2–328.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"}],"reading":"The final week extends from A.D. 27 to A.D. 34. In its midst, A.D. 31, Christ was crucified, fulfilling the sacrificial types. The seventy weeks close in A.D. 34; The Great Controversy connects this with Stephen’s martyrdom and the widening proclamation of the gospel. Salvation in Christ remains open to both Jews and Gentiles.","reflect":"How does the prophecy direct attention to Christ’s sacrifice and worldwide mission?","flashQuestion":"What dates mark the middle and end of the final prophetic week?","flashAnswer":"A.D. 31: Christ’s crucifixion. A.D. 34: the close of the seventy weeks.","question":"Which sequence follows GC 327–328?","options":[{"text":"A.D. 27 baptism → A.D. 31 crucifixion → A.D. 34 close of the seventy weeks.","feedback":"The final week extends from A.D. 27 to A.D. 34. In its midst, A.D. 31, Christ was crucified, fulfilling the sacrificial types. The seventy weeks close in A.D. 34; The Great Controversy connects this with Stephen’s martyrdom and the widening proclamation of the gospel. Salvation in Christ remains open to both Jews and Gentiles.","correct":true},{"text":"A.D. 27 crucifixion → A.D. 31 baptism → A.D. 34 return.","feedback":"This reverses the baptism and crucifixion and substitutes the Second Advent.","correct":false},{"text":"A.D. 27 baptism → A.D. 31 close of seventy weeks → A.D. 34 birth.","feedback":"A.D. 31 is the crucifixion in the midst of the week, not its end.","correct":false},{"text":"A.D. 27 birth → A.D. 31 baptism → A.D. 34 crucifixion.","feedback":"These events do not match the sequence in the cited explanation.","correct":false}],"hint":"Review “The midst and close of the final week” and Daniel 9:27.","bibleLinks":[{"label":"Daniel 9:27 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%209%3A27&version=KJV"},{"label":"Matthew 27:50–51 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2027%3A50-51&version=KJV"},{"label":"Acts 7:54–60 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%207%3A54-60&version=KJV"},{"label":"Acts 8:1–4 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%208%3A1-4&version=KJV"}]},{"id":"2300-days-05","title":"The remaining 1,810 years","bible":["Daniel 8:14","Daniel 9:24"],"egw":[{"book":"GC","chapter":18,"pages":"328.2","label":"The Great Controversy, 328.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm"},{"book":"GC","chapter":22,"pages":"398.4","label":"The Great Controversy, 398.4","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-22.htm"}],"reading":"Seventy weeks equal 490 years. Subtracting 490 from 2,300 leaves 1,810 years. Adding that remaining period to A.D. 34 reaches 1844. Because the starting point is in autumn, the ending also falls in autumn. The arithmetic identifies the year; the Day of Atonement study addresses the particular date.","reflect":"Can you explain the calculation to someone in two sentences?","flashQuestion":"How do the seventy weeks connect to 1844?","flashAnswer":"2,300 − 490 = 1,810 years remaining; A.D. 34 + 1,810 = A.D. 1844.","question":"After the 490 years end in A.D. 34, where do the remaining 1,810 years lead?","options":[{"text":"A.D. 1854.","feedback":"34 + 1,810 equals 1,844, not 1,854.","correct":false},{"text":"A.D. 2300.","feedback":"2,300 is the full period’s length, not an A.D. ending date.","correct":false},{"text":"A.D. 1844.","feedback":"Seventy weeks equal 490 years. Subtracting 490 from 2,300 leaves 1,810 years. Adding that remaining period to A.D. 34 reaches 1844. Because the starting point is in autumn, the ending also falls in autumn. The arithmetic identifies the year; the Day of Atonement study addresses the particular date.","correct":true},{"text":"A.D. 1810.","feedback":"1,810 is the remaining length, which must be added to A.D. 34.","correct":false}],"hint":"Review “The remaining 1,810 years” and Daniel 8:14.","bibleLinks":[{"label":"Daniel 8:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%208%3A14&version=KJV"},{"label":"Daniel 9:24 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%209%3A24&version=KJV"}]},{"id":"2300-days-06","title":"October 22 and the heavenly event","bible":["Leviticus 16:29–34","Leviticus 23:27","Daniel 8:14"],"egw":[{"book":"GC","chapter":22,"pages":"399.4","label":"The Great Controversy, 399.4","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-22.htm"},{"book":"GC","chapter":24,"pages":"424.1–426.1","label":"The Great Controversy, 424.1–426.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm"}],"reading":"Leviticus supplies the tenth day of the seventh month for the Day of Atonement. GC 399.4 identifies its correspondence in 1844 as October 22. GC 424 explains the event as Christ’s ministry in the most holy place. The Gregorian date is supplied by that explanation; it is not printed as a date in Leviticus.","reflect":"How would you distinguish the biblical feast date from its stated 1844 calendar correspondence?","flashQuestion":"How are October 22, 1844 and the Day of Atonement connected?","flashAnswer":"GC 399.4 identifies October 22 as that year’s tenth day of the seventh month; GC 424 explains the heavenly event.","question":"Which explanation keeps the sources clear?","options":[{"text":"GC teaches that Jesus visibly returned to earth that day.","feedback":"GC 424 distinguishes the heavenly ministry from the expected return to earth.","correct":false},{"text":"Leviticus gives the feast date; GC gives its 1844 correspondence and explains the heavenly event.","feedback":"Leviticus supplies the tenth day of the seventh month for the Day of Atonement. GC 399.4 identifies its correspondence in 1844 as October 22. GC 424 explains the event as Christ’s ministry in the most holy place. The Gregorian date is supplied by that explanation; it is not printed as a date in Leviticus.","correct":true},{"text":"Leviticus explicitly prints the Gregorian date October 22, 1844.","feedback":"Leviticus states the day and month in Israel’s calendar, not that Gregorian date.","correct":false},{"text":"The 2,300 − 490 subtraction by itself proves October 22.","feedback":"That subtraction establishes the remaining years, not the day and month.","correct":false}],"hint":"Review “October 22 and the heavenly event” and Leviticus 16:29–34.","bibleLinks":[{"label":"Leviticus 16:29–34 · KJV","url":"https://www.biblegateway.com/passage/?search=Leviticus%2016%3A29-34&version=KJV"},{"label":"Leviticus 23:27 · KJV","url":"https://www.biblegateway.com/passage/?search=Leviticus%2023%3A27&version=KJV"},{"label":"Daniel 8:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%208%3A14&version=KJV"}]},{"id":"2300-days-07","title":"Preparation without a new date","bible":["Matthew 24:36,42–44","Acts 1:7"],"egw":[{"book":"GC","chapter":26,"pages":"457.1","label":"The Great Controversy, 457.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-26.htm"}],"reading":"The explanation of the 2,300 years does not authorize setting a new date for Christ’s return. Jesus calls His followers to watch and be ready. The Great Controversy warns that repeated attempts to assign new dates distract from present truth and undermine confidence in the prophetic message. Our response is faithful preparation.","reflect":"How can expectation of Christ’s return shape today’s duties without a new timetable?","flashQuestion":"Does understanding the 2,300 years authorize a new date for the Second Advent?","flashAnswer":"No. Christ calls us to watch and prepare; GC 457.1 warns against setting new dates.","question":"Someone proposes a new Second Advent date by revising the prophetic periods. Which response follows GC 457.1?","options":[{"text":"Conclude that every study of Bible prophecy should be abandoned.","feedback":"The warning is against new date-setting, not against studying the prophetic Word.","correct":false},{"text":"Reject the new date-setting and continue watchful, faithful preparation.","feedback":"The explanation of the 2,300 years does not authorize setting a new date for Christ’s return. Jesus calls His followers to watch and be ready. The Great Controversy warns that repeated attempts to assign new dates distract from present truth and undermine confidence in the prophetic message. Our response is faithful preparation.","correct":true},{"text":"Accept the date if its arithmetic is complicated enough.","feedback":"Complex arithmetic does not provide authority to set a new date for the Second Advent.","correct":false},{"text":"Postpone preparation until the new date is close.","feedback":"Jesus calls for present readiness, not delay based on an invented timetable.","correct":false}],"hint":"Review “Preparation without a new date” and Matthew 24:36,42–44.","bibleLinks":[{"label":"Matthew 24:36,42–44 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2024%3A36%2C42-44&version=KJV"},{"label":"Acts 1:7 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%201%3A7&version=KJV"}]}]},{"id":"three-angels","title":"The Three Angels’ Messages","group":"Prophecy & Christian hope","icon":"megaphone","description":"The everlasting gospel, judgment, worship, and faithfulness to Jesus.","verse":"Revelation 14:12","verseText":"Here is the patience of the saints: here are they that keep the commandments of God, and the faith of Jesus.","items":[{"id":"three-angels-01","title":"The everlasting gospel for the world","bible":["Revelation 14:6–7"],"egw":[{"book":"GC","chapter":20,"pages":"355–356","label":"The Great Controversy, 355–356","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-20.htm"}],"reading":"The first angel bears the everlasting gospel to every nation, kindred, tongue, and people. The judgment-hour message belongs within the good news of salvation in Christ. Its scope is worldwide, calling all people to respond to their Creator and Redeemer.","reflect":"How can your presentation of prophetic warning make the gospel clear?","flashQuestion":"What does the first angel carry, and to whom?","flashAnswer":"The everlasting gospel, to every nation, kindred, tongue, and people.","question":"What message and audience are named in Revelation 14:6?","options":[{"text":"A prediction intended only for earthly rulers.","feedback":"The audience extends to all peoples, not merely rulers.","correct":false},{"text":"A private message for one language group.","feedback":"The verse explicitly lists a worldwide audience.","correct":false},{"text":"The everlasting gospel for every nation, kindred, tongue, and people.","feedback":"The first angel bears the everlasting gospel to every nation, kindred, tongue, and people. The judgment-hour message belongs within the good news of salvation in Christ. Its scope is worldwide, calling all people to respond to their Creator and Redeemer.","correct":true},{"text":"A replacement for the gospel of salvation.","feedback":"The message itself is called the everlasting gospel.","correct":false}],"hint":"Review “The everlasting gospel for the world” and Revelation 14:6–7.","bibleLinks":[{"label":"Revelation 14:6–7 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A6-7&version=KJV"}]},{"id":"three-angels-02","title":"The hour of His judgment is come","bible":["Revelation 14:7","Daniel 7:9–10"],"egw":[{"book":"GC","chapter":20,"pages":"355–356","label":"The Great Controversy, 355–356","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-20.htm"},{"book":"GC","chapter":24,"pages":"424.1","label":"The Great Controversy, 424.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm"}],"reading":"The first angel calls people to fear God, give Him glory, and worship the Creator because the hour of His judgment has come. Fear here calls for reverence and allegiance. The announcement makes the judgment present in the message, rather than merely a distant possibility.","reflect":"How can reverence for God shape an ordinary decision today?","flashQuestion":"What announcement accompanies the call to fear God and give Him glory?","flashAnswer":"The hour of His judgment is come.","question":"Which essential announcement belongs in a summary of the first angel’s message?","options":[{"text":"The hour of God’s judgment is come.","feedback":"The first angel calls people to fear God, give Him glory, and worship the Creator because the hour of His judgment has come. Fear here calls for reverence and allegiance. The announcement makes the judgment present in the message, rather than merely a distant possibility.","correct":true},{"text":"Human governments have become the final judges of conscience.","feedback":"The announcement concerns God’s judgment and authority.","correct":false},{"text":"Judgment has no relation to worship.","feedback":"Revelation 14:7 directly joins judgment and worship.","correct":false},{"text":"The gospel makes reverence for God unnecessary.","feedback":"The gospel-bearing angel explicitly calls for reverence and glory to God.","correct":false}],"hint":"Review “The hour of His judgment is come” and Revelation 14:7.","bibleLinks":[{"label":"Revelation 14:7 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A7&version=KJV"},{"label":"Daniel 7:9–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Daniel%207%3A9-10&version=KJV"}]},{"id":"three-angels-03","title":"Worship Him that made heaven and earth","bible":["Revelation 14:7","Exodus 20:8–11"],"egw":[{"book":"GC","chapter":25,"pages":"436.2–438.1","label":"The Great Controversy, 436.2–438.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"}],"reading":"The call to worship the Maker of heaven, earth, and sea recalls the fourth commandment’s reason for keeping the Sabbath. The Great Controversy connects this Creator-centered worship with the restoration of the seventh-day Sabbath. Worship acknowledges God’s authority over our lives.","reflect":"What connection do you see between remembering Creation and trusting God?","flashQuestion":"How does the first angel’s call connect with the Sabbath?","flashAnswer":"Both call attention to the Creator who made heaven, earth, and sea.","question":"Which connection does GC 437 identify?","options":[{"text":"The first angel replaces the Creator with a human power.","feedback":"The angel explicitly calls for worship of the Maker.","correct":false},{"text":"The Creator language of Revelation 14 recalls the fourth commandment.","feedback":"The call to worship the Maker of heaven, earth, and sea recalls the fourth commandment’s reason for keeping the Sabbath. The Great Controversy connects this Creator-centered worship with the restoration of the seventh-day Sabbath. Worship acknowledges God’s authority over our lives.","correct":true},{"text":"The Sabbath points only to human achievement.","feedback":"The commandment commemorates God’s creative work.","correct":false},{"text":"Creation language removes the need for obedience.","feedback":"The chapter connects the threefold message with keeping God’s commandments.","correct":false}],"hint":"Review “Worship Him that made heaven and earth” and Revelation 14:7.","bibleLinks":[{"label":"Revelation 14:7 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A7&version=KJV"},{"label":"Exodus 20:8–11 · KJV","url":"https://www.biblegateway.com/passage/?search=Exodus%2020%3A8-11&version=KJV"}]},{"id":"three-angels-04","title":"Babylon is fallen","bible":["Revelation 14:8","Revelation 18:1–4"],"egw":[{"book":"GC","chapter":21,"pages":"381–390","label":"The Great Controversy, 381–390","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-21.htm"},{"book":"GC","chapter":38,"pages":"603–604","label":"The Great Controversy, 603–604","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-38.htm"}],"reading":"The second angel announces Babylon’s fall. The Great Controversy explains Babylon in relation to religious confusion and apostasy, including rejection of truth and unlawful alliance with worldly power. Revelation 18 adds the appeal to God’s people to come out of her, separating from her sins.","reflect":"How can a call away from error also be an invitation toward Christ?","flashQuestion":"What does the second angel announce?","flashAnswer":"Babylon is fallen; Revelation 18 also calls God’s people out of her sins.","question":"What must a faithful explanation of the call out of Babylon acknowledge?","options":[{"text":"Babylon’s fall means truth no longer matters.","feedback":"The warning concerns rejection of truth and allegiance to error.","correct":false},{"text":"God still has people to call out of her sins.","feedback":"The second angel announces Babylon’s fall. The Great Controversy explains Babylon in relation to religious confusion and apostasy, including rejection of truth and unlawful alliance with worldly power. Revelation 18 adds the appeal to God’s people to come out of her, separating from her sins.","correct":true},{"text":"The call asks people to retain the sins while changing a label.","feedback":"The call explicitly warns against partaking of her sins.","correct":false},{"text":"No sincere believer could be found where error exists.","feedback":"Revelation 18:4 addresses “my people” within Babylon.","correct":false}],"hint":"Review “Babylon is fallen” and Revelation 14:8.","bibleLinks":[{"label":"Revelation 14:8 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A8&version=KJV"},{"label":"Revelation 18:1–4 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2018%3A1-4&version=KJV"}]},{"id":"three-angels-05","title":"The warning against false worship","bible":["Revelation 14:9–11"],"egw":[{"book":"GC","chapter":25,"pages":"445–450","label":"The Great Controversy, 445–450","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"GC","chapter":38,"pages":"604–605","label":"The Great Controversy, 604–605","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-38.htm"}],"reading":"The third angel warns against worshipping the beast and his image and receiving his mark. The issue is allegiance in conflict with God’s authority. The Great Controversy locates the final test in an informed choice under enforced worship, while recognizing sincere Christians who have not yet understood the issue.","reflect":"Why should solemn warnings be explained with both accuracy and compassion?","flashQuestion":"Against what does the third angel warn?","flashAnswer":"Worship of the beast and his image, and receiving his mark.","question":"What is the central issue in the third angel’s warning?","options":[{"text":"A judgment that every uninformed Sunday worshipper already bears the mark.","feedback":"GC 449 distinguishes sincere misunderstanding from the informed final test.","correct":false},{"text":"A preference for one harmless cultural style.","feedback":"The warning concerns worship and allegiance, not harmless cultural preference.","correct":false},{"text":"Worship and allegiance contrary to God’s authority.","feedback":"The third angel warns against worshipping the beast and his image and receiving his mark. The issue is allegiance in conflict with God’s authority. The Great Controversy locates the final test in an informed choice under enforced worship, while recognizing sincere Christians who have not yet understood the issue.","correct":true},{"text":"The rejection of all civil order as inherently wrong.","feedback":"The conflict concerns demands contrary to God’s authority.","correct":false}],"hint":"Review “The warning against false worship” and Revelation 14:9–11.","bibleLinks":[{"label":"Revelation 14:9–11 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A9-11&version=KJV"}]},{"id":"three-angels-06","title":"Commandments and the faith of Jesus","bible":["Revelation 14:12","Ephesians 2:8–10"],"egw":[{"book":"GC","chapter":25,"pages":"435–436","label":"The Great Controversy, 435–436","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"SC","chapter":7,"pages":"60–63","label":"Steps to Christ, 60–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"Revelation describes the saints by patient faithfulness, God’s commandments, and the faith of Jesus. The warnings lead toward a people who trust Christ and obey through His grace. As Steps to Christ explains, obedience grows from faith; it does not purchase salvation.","reflect":"Where do you need patience joined with trust and obedience?","flashQuestion":"How does Revelation 14:12 describe the saints?","flashAnswer":"They keep the commandments of God and the faith of Jesus, with patience.","question":"Which response reflects Revelation 14:12 and the gospel?","options":[{"text":"Interest in prophecy without a change in daily life.","feedback":"The description concerns lived faithfulness, not curiosity alone.","correct":false},{"text":"Commandment keeping used to buy salvation.","feedback":"Steps to Christ identifies obedience as the fruit of faith, not payment for salvation.","correct":false},{"text":"Patient faith in Jesus expressed in obedience to God.","feedback":"Revelation describes the saints by patient faithfulness, God’s commandments, and the faith of Jesus. The warnings lead toward a people who trust Christ and obey through His grace. As Steps to Christ explains, obedience grows from faith; it does not purchase salvation.","correct":true},{"text":"A profession of faith that excuses cherished sin.","feedback":"The saints are described as keeping God’s commandments.","correct":false}],"hint":"Review “Commandments and the faith of Jesus” and Revelation 14:12.","bibleLinks":[{"label":"Revelation 14:12 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A12&version=KJV"},{"label":"Ephesians 2:8–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Ephesians%202%3A8-10&version=KJV"}]},{"id":"three-angels-07","title":"The Spirit gives power to the final warning","bible":["Revelation 18:1–4","Acts 1:8","Zechariah 4:6"],"egw":[{"book":"GC","chapter":38,"pages":"611.1–612.2","label":"The Great Controversy, 611.1–612.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-38.htm"}],"reading":"Revelation 18 describes the earth lightened with the glory of an angel joining the final warning. The Great Controversy explains that the message goes forward with extraordinary power through the Holy Spirit. Teaching and publications prepare the way, while the Spirit brings conviction and people respond to the truth.","reflect":"How can you join careful preparation with prayerful dependence on the Holy Spirit?","flashQuestion":"What gives the final warning its convicting power?","flashAnswer":"The Holy Spirit works through the proclamation of God’s truth.","question":"What does GC 612.2 especially emphasize about the message’s final advance?","options":[{"text":"Force should replace an appeal to conscience.","feedback":"The described response is conviction and allegiance to truth, not coerced belief.","correct":false},{"text":"The deep conviction produced by the Spirit of God.","feedback":"Revelation 18 describes the earth lightened with the glory of an angel joining the final warning. The Great Controversy explains that the message goes forward with extraordinary power through the Holy Spirit. Teaching and publications prepare the way, while the Spirit brings conviction and people respond to the truth.","correct":true},{"text":"Human eloquence can make the Spirit’s work unnecessary.","feedback":"The passage attributes the decisive conviction to the Spirit of God.","correct":false},{"text":"Teaching and publications have no preparatory value.","feedback":"GC 612.2 explicitly describes the influence of previously distributed publications and presented arguments.","correct":false}],"hint":"Review “The Spirit gives power to the final warning” and Revelation 18:1–4.","bibleLinks":[{"label":"Revelation 18:1–4 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2018%3A1-4&version=KJV"},{"label":"Acts 1:8 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%201%3A8&version=KJV"},{"label":"Zechariah 4:6 · KJV","url":"https://www.biblegateway.com/passage/?search=Zechariah%204%3A6&version=KJV"}]}]},{"id":"state-of-the-dead","title":"State of the Dead","group":"Prophecy & Christian hope","icon":"sunrise","description":"Death as sleep, the resurrection, and our hope in Jesus.","verse":"Ecclesiastes 9:5","verseText":"For the living know that they shall die: but the dead know not any thing, neither have they any more a reward; for the memory of them is forgotten.","items":[{"id":"state-of-the-dead-01","title":"Life and immortality through Christ","bible":["1 Timothy 6:15–16","Romans 6:23","2 Timothy 1:10"],"egw":[{"book":"GC","chapter":33,"pages":"532–533","label":"The Great Controversy, 532–533","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-33.htm"}],"reading":"Immortality is not an independent possession of fallen humanity. Eternal life is God’s gift through Jesus Christ. The gospel brings the hope of life and immortality to sinners, directing our trust to the Saviour rather than to a supposed naturally indestructible soul.","reflect":"How does receiving life as a gift affect your gratitude to Christ?","flashQuestion":"Through whom can we receive immortality?","flashAnswer":"Through Jesus Christ; eternal life is God’s gift.","question":"Where does the believer’s hope of immortality rest?","options":[{"text":"In information received from departed spirits.","feedback":"The gospel, rather than supposed messages from the dead, reveals this hope.","correct":false},{"text":"In moral effort sufficient to purchase endless life.","feedback":"Eternal life is God’s gift, not a purchase.","correct":false},{"text":"In an immortal nature possessed by every human being.","feedback":"The cited passages locate immortality in God and its gift through Christ.","correct":false},{"text":"In the gift of life through Jesus Christ.","feedback":"Immortality is not an independent possession of fallen humanity. Eternal life is God’s gift through Jesus Christ. The gospel brings the hope of life and immortality to sinners, directing our trust to the Saviour rather than to a supposed naturally indestructible soul.","correct":true}],"hint":"Review “Life and immortality through Christ” and 1 Timothy 6:15–16.","bibleLinks":[{"label":"1 Timothy 6:15–16 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Timothy%206%3A15-16&version=KJV"},{"label":"Romans 6:23 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%206%3A23&version=KJV"},{"label":"2 Timothy 1:10 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Timothy%201%3A10&version=KJV"}]},{"id":"state-of-the-dead-02","title":"The dead know not anything","bible":["Ecclesiastes 9:5–6,10","Psalm 146:4"],"egw":[{"book":"GC","chapter":33,"pages":"545–546","label":"The Great Controversy, 545–546","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-33.htm"}],"reading":"Ecclesiastes describes the dead as knowing nothing of earthly life and having no work, knowledge, or wisdom in the grave. Psalm 146 says a person’s thoughts perish at death. This unconscious rest ends when God raises the dead; it does not erase His promise to remember and restore His people.","reflect":"What comfort can rest from suffering bring alongside the resurrection promise?","flashQuestion":"What does Ecclesiastes say about the consciousness of the dead?","flashAnswer":"The dead know not anything and do not participate in earthly life.","question":"Which description agrees with Ecclesiastes 9?","options":[{"text":"The dead rest without consciousness of earthly activity.","feedback":"Ecclesiastes describes the dead as knowing nothing of earthly life and having no work, knowledge, or wisdom in the grave. Psalm 146 says a person’s thoughts perish at death. This unconscious rest ends when God raises the dead; it does not erase His promise to remember and restore His people.","correct":true},{"text":"The dead continue supervising their households.","feedback":"Ecclesiastes excludes their continuing participation in earthly affairs.","correct":false},{"text":"The dead learn new truths in the grave.","feedback":"The passage says there is no knowledge or wisdom there.","correct":false},{"text":"The dead lose all possibility of a future resurrection.","feedback":"The state of death does not cancel God’s resurrection promise.","correct":false}],"hint":"Review “The dead know not anything” and Ecclesiastes 9:5–6,10.","bibleLinks":[{"label":"Ecclesiastes 9:5–6,10 · KJV","url":"https://www.biblegateway.com/passage/?search=Ecclesiastes%209%3A5-6%2C10&version=KJV"},{"label":"Psalm 146:4 · KJV","url":"https://www.biblegateway.com/passage/?search=Psalm%20146%3A4&version=KJV"}]},{"id":"state-of-the-dead-03","title":"Jesus called death a sleep","bible":["John 11:11–14,23–25"],"egw":[{"book":"GC","chapter":33,"pages":"549.3","label":"The Great Controversy, 549.3","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-33.htm"}],"reading":"Jesus first described Lazarus as sleeping, then plainly told the disciples that Lazarus was dead. He went to awaken him. The comparison teaches both the reality of death and Christ’s power to end it. He is the resurrection and the life.","reflect":"Why is Jesus’ power more important than the length of the sleep?","flashQuestion":"What did Jesus mean when He said Lazarus was sleeping?","flashAnswer":"Lazarus had died; Jesus would awaken him from death.","question":"How does John 11 explain Jesus’ statement that Lazarus was asleep?","options":[{"text":"Lazarus had recovered and was taking ordinary rest.","feedback":"Jesus explicitly told the disciples that Lazarus was dead.","correct":false},{"text":"Lazarus was pretending to be ill.","feedback":"The account describes a real death and a real raising.","correct":false},{"text":"Jesus was speaking of Lazarus’s death.","feedback":"Jesus first described Lazarus as sleeping, then plainly told the disciples that Lazarus was dead. He went to awaken him. The comparison teaches both the reality of death and Christ’s power to end it. He is the resurrection and the life.","correct":true},{"text":"Lazarus was beyond the reach of Christ’s power.","feedback":"Jesus called Himself the resurrection and the life and raised Lazarus.","correct":false}],"hint":"Review “Jesus called death a sleep” and John 11:11–14,23–25.","bibleLinks":[{"label":"John 11:11–14,23–25 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2011%3A11-14%2C23-25&version=KJV"}]},{"id":"state-of-the-dead-04","title":"The resurrection at Christ’s return","bible":["1 Thessalonians 4:13–18","1 Corinthians 15:51–54"],"egw":[{"book":"GC","chapter":33,"pages":"548–550","label":"The Great Controversy, 548–550","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-33.htm"}],"reading":"Paul comforts believers with the return of the Lord and the resurrection. The dead in Christ rise, and the living faithful are gathered with them to meet Him. At the resurrection the mortal puts on immortality. Our reunion and lasting life depend on Christ’s victory.","reflect":"Which part of Paul’s promise gives you the greatest hope?","flashQuestion":"When do the dead in Christ receive incorruptible resurrection life?","flashAnswer":"At Christ’s return, when the trumpet sounds and they are raised.","question":"According to Paul, what happens to the dead in Christ when the Lord descends?","options":[{"text":"They rise and are gathered with the living faithful to the Lord.","feedback":"Paul comforts believers with the return of the Lord and the resurrection. The dead in Christ rise, and the living faithful are gathered with them to meet Him. At the resurrection the mortal puts on immortality. Our reunion and lasting life depend on Christ’s victory.","correct":true},{"text":"They must first complete another earthly lifetime.","feedback":"Paul teaches resurrection, not reincarnation.","correct":false},{"text":"They remain forgotten while only the living are saved.","feedback":"Paul specifically promises that the dead in Christ will rise.","correct":false},{"text":"They return as invisible guides for earthly families.","feedback":"The promise is resurrection and reunion with the Lord.","correct":false}],"hint":"Review “The resurrection at Christ’s return” and 1 Thessalonians 4:13–18.","bibleLinks":[{"label":"1 Thessalonians 4:13–18 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Thessalonians%204%3A13-18&version=KJV"},{"label":"1 Corinthians 15:51–54 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2015%3A51-54&version=KJV"}]},{"id":"state-of-the-dead-05","title":"Test claims of messages from the dead","bible":["Isaiah 8:19–20","Deuteronomy 18:10–12"],"egw":[{"book":"GC","chapter":34,"pages":"551–553,559","label":"The Great Controversy, 551–553,559","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-34.htm"}],"reading":"Scripture directs us to God and His Word instead of consulting the dead. The Great Controversy warns that deceptive spirits can impersonate departed loved ones. A familiar voice or impressive sign is not a safe foundation for faith; test claims by Scripture.","reflect":"How can you respond kindly to grief without accepting a deceptive spiritual claim?","flashQuestion":"Where should believers turn instead of seeking messages from the dead?","flashAnswer":"To God and the testimony of His Word.","question":"A claimed message from a deceased relative contradicts Scripture. What should guide your response?","options":[{"text":"Accept it because the voice sounds familiar.","feedback":"Familiarity does not establish the source of a spiritual manifestation.","correct":false},{"text":"Test and reject the contradiction by God’s Word.","feedback":"Scripture directs us to God and His Word instead of consulting the dead. The Great Controversy warns that deceptive spirits can impersonate departed loved ones. A familiar voice or impressive sign is not a safe foundation for faith; test claims by Scripture.","correct":true},{"text":"Trust it if it produces strong emotion.","feedback":"Emotion cannot replace the scriptural test.","correct":false},{"text":"Treat an impressive sign as higher authority than Scripture.","feedback":"The passage directs believers to the law and the testimony.","correct":false}],"hint":"Review “Test claims of messages from the dead” and Isaiah 8:19–20.","bibleLinks":[{"label":"Isaiah 8:19–20 · KJV","url":"https://www.biblegateway.com/passage/?search=Isaiah%208%3A19-20&version=KJV"},{"label":"Deuteronomy 18:10–12 · KJV","url":"https://www.biblegateway.com/passage/?search=Deuteronomy%2018%3A10-12&version=KJV"}]},{"id":"state-of-the-dead-06","title":"God will end death and sorrow","bible":["Revelation 21:1–4","Revelation 20:14"],"egw":[{"book":"GC","chapter":42,"pages":"676–678","label":"The Great Controversy, 676–678","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-42.htm"}],"reading":"The Christian hope reaches beyond release from the present life to resurrection and a restored earth. God will dwell with His people; death, sorrow, crying, and pain will end. The final outcome of the controversy is a universe free from sin and its suffering.","reflect":"How can this promised future shape the way you comfort someone today?","flashQuestion":"What does God promise about death in the new earth?","flashAnswer":"There shall be no more death, sorrow, crying, or pain.","question":"Which hope is described in Revelation 21:4?","options":[{"text":"God will end death and sorrow in the restored creation.","feedback":"The Christian hope reaches beyond release from the present life to resurrection and a restored earth. God will dwell with His people; death, sorrow, crying, and pain will end. The final outcome of the controversy is a universe free from sin and its suffering.","correct":true},{"text":"God’s people will remain permanently separated from Him.","feedback":"Revelation 21 describes God dwelling with His people.","correct":false},{"text":"Suffering will continue unchanged throughout eternity.","feedback":"The promise explicitly says death, sorrow, and pain will end.","correct":false},{"text":"People will repeatedly die and return in new bodies.","feedback":"The promised state has no more death.","correct":false}],"hint":"Review “God will end death and sorrow” and Revelation 21:1–4.","bibleLinks":[{"label":"Revelation 21:1–4 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2021%3A1-4&version=KJV"},{"label":"Revelation 20:14 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2020%3A14&version=KJV"}]},{"id":"state-of-the-dead-07","title":"Christ’s resurrection is essential","bible":["1 Corinthians 15:16–23","John 11:25"],"egw":[{"book":"GC","chapter":33,"pages":"546.3–548.1","label":"The Great Controversy, 546.3–548.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-33.htm"}],"reading":"Paul makes the resurrection central to Christian hope. If Christ had not risen, faith would be vain and those asleep in Him would have perished. But Christ has risen, the firstfruits of those who sleep. Our hope rests on the living Saviour, who will raise His people when He returns.","reflect":"Why does the fact that Jesus rose give weight to His promise to raise others?","flashQuestion":"Why is Christ’s resurrection essential to our hope for the dead?","flashAnswer":"The risen Christ is the firstfruits and the living Saviour who will raise His people.","question":"Which fact answers Paul’s warning that faith would be vain if Christ had not risen?","options":[{"text":"Christ’s death is the end of the gospel account.","feedback":"The gospel also proclaims His resurrection and continuing life.","correct":false},{"text":"Remembering a loved one replaces the need for God to raise the dead.","feedback":"Memory can be precious, but the promised restoration depends on Christ’s power.","correct":false},{"text":"Resurrection is unnecessary because death already gives everyone their final reward.","feedback":"Paul presents resurrection as essential, not unnecessary.","correct":false},{"text":"Christ has risen from the dead, the firstfruits of those who sleep.","feedback":"Paul makes the resurrection central to Christian hope. If Christ had not risen, faith would be vain and those asleep in Him would have perished. But Christ has risen, the firstfruits of those who sleep. Our hope rests on the living Saviour, who will raise His people when He returns.","correct":true}],"hint":"Review “Christ’s resurrection is essential” and 1 Corinthians 15:16–23.","bibleLinks":[{"label":"1 Corinthians 15:16–23 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2015%3A16-23&version=KJV"},{"label":"John 11:25 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2011%3A25&version=KJV"}]}]},{"id":"spirit-of-prophecy","title":"Spirit of Prophecy","group":"Prophecy & Christian hope","icon":"scroll-text","description":"The testimony of Jesus, spiritual gifts, and Scripture’s test of teaching.","verse":"Revelation 19:10 · excerpt","verseText":"The testimony of Jesus is the spirit of prophecy.","items":[{"id":"spirit-of-prophecy-01","title":"The testimony of Jesus","bible":["Revelation 19:10","Revelation 12:17","2 Peter 1:21"],"egw":[{"book":"GC","chapter":0,"pages":"v.1–3,viii–ix","label":"The Great Controversy, v.1–3,viii–ix","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"}],"reading":"Revelation connects the testimony of Jesus with the spirit of prophecy. Prophetic light comes through the Holy Spirit, who moved God’s servants to speak. The gift points us to God’s revelation and to faithfulness to Jesus; a human messenger is never the object of worship.","reflect":"How can study of prophecy keep Jesus at the center?","flashQuestion":"What does Revelation 19:10 call the testimony of Jesus?","flashAnswer":"The spirit of prophecy.","question":"Which phrase completes the statement in Revelation 19:10? “The testimony of Jesus is…”","options":[{"text":"The spirit of prophecy.","feedback":"Revelation connects the testimony of Jesus with the spirit of prophecy. Prophetic light comes through the Holy Spirit, who moved God’s servants to speak. The gift points us to God’s revelation and to faithfulness to Jesus; a human messenger is never the object of worship.","correct":true},{"text":"The authority of earthly kings.","feedback":"The verse connects Jesus’ testimony with prophecy, not civil rule.","correct":false},{"text":"The wisdom of human tradition.","feedback":"The passage points to divine testimony rather than tradition.","correct":false},{"text":"The worship of the angel.","feedback":"The angel forbids worship of himself and directs John to worship God.","correct":false}],"hint":"Review “The testimony of Jesus” and Revelation 19:10.","bibleLinks":[{"label":"Revelation 19:10 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2019%3A10&version=KJV"},{"label":"Revelation 12:17 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2012%3A17&version=KJV"},{"label":"2 Peter 1:21 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Peter%201%3A21&version=KJV"}]},{"id":"spirit-of-prophecy-02","title":"Gifts for the building up of the church","bible":["Ephesians 4:11–13","Joel 2:28–29"],"egw":[{"book":"GC","chapter":0,"pages":"viii.1–ix.3","label":"The Great Controversy, viii.1–ix.3","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"}],"reading":"Christ gives spiritual gifts, including prophets, to equip believers, build up His church, and bring them toward maturity in Him. Ellen White explains that the Spirit’s enlightening, warning, and comforting work continues after the close of the biblical canon. Spiritual gifts serve the body of Christ.","reflect":"What difference does it make to see a spiritual gift as service?","flashQuestion":"Why does Christ give spiritual gifts to His church?","flashAnswer":"To equip the saints, build up the body of Christ, and develop maturity in Him.","question":"What purpose does Ephesians 4 assign to the gifts, including prophets?","options":[{"text":"Keeping spiritual knowledge within a privileged circle.","feedback":"The gifts equip the saints for ministry and build up the body.","correct":false},{"text":"Making one gifted person the center of Christian worship.","feedback":"The gifts serve Christ’s body and do not transfer worship to a person.","correct":false},{"text":"Ending the need for believers to grow.","feedback":"The stated aim is growth toward Christlike maturity.","correct":false},{"text":"Equipping and building up the church toward maturity in Christ.","feedback":"Christ gives spiritual gifts, including prophets, to equip believers, build up His church, and bring them toward maturity in Him. Ellen White explains that the Spirit’s enlightening, warning, and comforting work continues after the close of the biblical canon. Spiritual gifts serve the body of Christ.","correct":true}],"hint":"Review “Gifts for the building up of the church” and Ephesians 4:11–13.","bibleLinks":[{"label":"Ephesians 4:11–13 · KJV","url":"https://www.biblegateway.com/passage/?search=Ephesians%204%3A11-13&version=KJV"},{"label":"Joel 2:28–29 · KJV","url":"https://www.biblegateway.com/passage/?search=Joel%202%3A28-29&version=KJV"}]},{"id":"spirit-of-prophecy-03","title":"Scripture remains the standard","bible":["2 Timothy 3:16–17","Isaiah 8:20"],"egw":[{"book":"GC","chapter":0,"pages":"vii.1–3","label":"The Great Controversy, vii.1–3","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"}],"reading":"Ellen White identifies the Bible as the standard of character, doctrine, and experience. The Holy Spirit inspired Scripture and does not teach against it. His continuing guidance opens and applies the Word. Genuine spiritual counsel strengthens our attention to Scripture.","reflect":"How can you read an EGW passage together with its Bible foundation?","flashQuestion":"What standard did Ellen White give for doctrine and spiritual experience?","flashAnswer":"The Holy Scriptures.","question":"A teacher claims the Spirit has made Bible study unnecessary. How does GC vii respond?","options":[{"text":"Private impressions become the final test of truth.","feedback":"GC vii warns against impressions that neglect Scripture.","correct":false},{"text":"The Spirit illuminates Scripture and never supersedes its authority.","feedback":"Ellen White identifies the Bible as the standard of character, doctrine, and experience. The Holy Spirit inspired Scripture and does not teach against it. His continuing guidance opens and applies the Word. Genuine spiritual counsel strengthens our attention to Scripture.","correct":true},{"text":"Popularity establishes whether a doctrine is inspired.","feedback":"The stated standard is Scripture, not popularity.","correct":false},{"text":"Prophetic counsel may contradict the Bible when circumstances change.","feedback":"The Spirit who inspired Scripture does not teach contrary to it.","correct":false}],"hint":"Review “Scripture remains the standard” and 2 Timothy 3:16–17.","bibleLinks":[{"label":"2 Timothy 3:16–17 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Timothy%203%3A16-17&version=KJV"},{"label":"Isaiah 8:20 · KJV","url":"https://www.biblegateway.com/passage/?search=Isaiah%208%3A20&version=KJV"}]},{"id":"spirit-of-prophecy-04","title":"Test the spirits","bible":["1 John 4:1–3","Isaiah 8:20","Matthew 7:15–20"],"egw":[{"book":"GC","chapter":0,"pages":"vii.3–4","label":"The Great Controversy, vii.3–4","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"},{"book":"GC","chapter":37,"pages":"593.1","label":"The Great Controversy, 593.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-37.htm"}],"reading":"Do not accept every spiritual claim. Test teaching by Scripture, examine its confession of Jesus Christ, and consider its fruit. Wonders and strong impressions cannot settle the question. The Bible supplies safeguards against false teachers and deceptive manifestations.","reflect":"Which test would you apply before sharing a dramatic spiritual claim?","flashQuestion":"Name biblical tests for a claimed prophetic message.","flashAnswer":"Agreement with Scripture, confession of Jesus Christ, and the fruit of the teaching and life.","question":"Which approach uses the biblical tests of a spiritual claim?","options":[{"text":"Examine Scripture agreement, its confession of Christ, and its fruit.","feedback":"Do not accept every spiritual claim. Test teaching by Scripture, examine its confession of Jesus Christ, and consider its fruit. Wonders and strong impressions cannot settle the question. The Bible supplies safeguards against false teachers and deceptive manifestations.","correct":true},{"text":"Accept it if a remarkable prediction appears accurate.","feedback":"A striking prediction alone is not the full biblical test.","correct":false},{"text":"Reject examination because testing shows unbelief.","feedback":"John explicitly instructs believers to try the spirits.","correct":false},{"text":"Accept it if the speaker attracts a large audience.","feedback":"Audience size does not prove divine inspiration.","correct":false}],"hint":"Review “Test the spirits” and 1 John 4:1–3.","bibleLinks":[{"label":"1 John 4:1–3 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%204%3A1-3&version=KJV"},{"label":"Isaiah 8:20 · KJV","url":"https://www.biblegateway.com/passage/?search=Isaiah%208%3A20&version=KJV"},{"label":"Matthew 7:15–20 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%207%3A15-20&version=KJV"}]},{"id":"spirit-of-prophecy-05","title":"A receptive and discerning response","bible":["1 Thessalonians 5:19–21","Acts 17:11"],"egw":[{"book":"GC","chapter":0,"pages":"vii.3–viii.2","label":"The Great Controversy, vii.3–viii.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"},{"book":"GC","chapter":37,"pages":"595.1","label":"The Great Controversy, 595.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-37.htm"}],"reading":"Paul joins openness to prophetic counsel with careful examination: believers are to prove all things and hold fast what is good. Ellen White likewise warns against both neglecting the Spirit’s work and following impressions apart from Scripture. Study prayerfully and test faithfully.","reflect":"Which is harder for you: listening willingly or examining carefully?","flashQuestion":"How does 1 Thessalonians 5 balance openness and discernment?","flashAnswer":"Do not despise prophesyings; prove all things and hold fast what is good.","question":"Which response follows Paul’s counsel about prophesyings?","options":[{"text":"Accept every claim without examining it.","feedback":"Paul commands believers to prove all things.","correct":false},{"text":"Listen without contempt, examine the claim, and hold fast what is good.","feedback":"Paul joins openness to prophetic counsel with careful examination: believers are to prove all things and hold fast what is good. Ellen White likewise warns against both neglecting the Spirit’s work and following impressions apart from Scripture. Study prayerfully and test faithfully.","correct":true},{"text":"Keep whichever claim best matches personal preference.","feedback":"The test concerns what is good and true, not preference.","correct":false},{"text":"Dismiss all prophetic counsel without reading it.","feedback":"Paul also says not to despise prophesyings.","correct":false}],"hint":"Review “A receptive and discerning response” and 1 Thessalonians 5:19–21.","bibleLinks":[{"label":"1 Thessalonians 5:19–21 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Thessalonians%205%3A19-21&version=KJV"},{"label":"Acts 17:11 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%2017%3A11&version=KJV"}]},{"id":"spirit-of-prophecy-06","title":"Why Ellen White presented the controversy","bible":["Revelation 12:17","2 Peter 3:14","2 Timothy 3:16–17"],"egw":[{"book":"GC","chapter":0,"pages":"x.1–xii.2","label":"The Great Controversy, x.1–xii.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-00-intro.htm"}],"reading":"In her introduction, Ellen White describes the Spirit opening to her the conflict between Christ and Satan. She explains her purpose in presenting these scenes: to expose deception, make the issues of the conflict clear, and help people stand faithfully before the Lord. Read that account alongside her instruction to test teaching by Scripture.","reflect":"How should learning about the controversy change daily faithfulness?","flashQuestion":"What purpose did Ellen White give for presenting the great controversy?","flashAnswer":"To clarify the conflict, uncover deception, and help people prepare to stand faithfully before Christ.","question":"Which use of The Great Controversy matches its author’s stated purpose?","options":[{"text":"Study its warnings and principles to follow Christ faithfully.","feedback":"In her introduction, Ellen White describes the Spirit opening to her the conflict between Christ and Satan. She explains her purpose in presenting these scenes: to expose deception, make the issues of the conflict clear, and help people stand faithfully before the Lord. Read that account alongside her instruction to test teaching by Scripture.","correct":true},{"text":"Use its warnings to calculate an undisclosed date for Christ’s return.","feedback":"The stated purpose is faithful preparation, not inventing a new date.","correct":false},{"text":"Treat it as permission to neglect the biblical standard.","feedback":"Her introduction explicitly upholds Scripture’s authority.","correct":false},{"text":"Use its history only to satisfy curiosity about dramatic events.","feedback":"Her stated aim extends to understanding the conflict and preparing for what lies ahead.","correct":false}],"hint":"Review “Why Ellen White presented the controversy” and Revelation 12:17.","bibleLinks":[{"label":"Revelation 12:17 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2012%3A17&version=KJV"},{"label":"2 Peter 3:14 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Peter%203%3A14&version=KJV"},{"label":"2 Timothy 3:16–17 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Timothy%203%3A16-17&version=KJV"}]},{"id":"spirit-of-prophecy-07","title":"Study a passage in its context","bible":["2 Timothy 2:15","Acts 17:11"],"egw":[{"book":"SC","chapter":10,"pages":"90–91","label":"Steps to Christ, 90–91","url":"https://www.ellenwhite.info/books/bk-sc-10.htm"},{"book":"GC","chapter":37,"pages":"595.1","label":"The Great Controversy, 595.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-37.htm"}],"reading":"Careful study seeks the meaning of a passage and its relationship to the plan of salvation. Steps to Christ values thoughtful understanding above hasty reading. When reading Bible texts or EGW counsel, examine the surrounding explanation, compare the biblical teaching, and ask what the author is actually addressing before applying the words.","reflect":"Which familiar quotation would you like to read in its full setting?","flashQuestion":"What helps us use a passage faithfully?","flashAnswer":"Read its context, understand its meaning, and compare its application with Scripture.","question":"You find a striking quotation in a short post. What is the sound next step?","options":[{"text":"Assume popularity has already settled its meaning.","feedback":"Careful understanding requires examination, not reliance on popularity.","correct":false},{"text":"Share it immediately if it agrees with your existing view.","feedback":"Agreement with a preference does not establish that the quotation is being used faithfully.","correct":false},{"text":"Treat the shortest possible excerpt as the most reliable explanation.","feedback":"An excerpt can omit qualifications or the subject being addressed.","correct":false},{"text":"Read the surrounding passage and check the proposed application against Scripture.","feedback":"Careful study seeks the meaning of a passage and its relationship to the plan of salvation. Steps to Christ values thoughtful understanding above hasty reading. When reading Bible texts or EGW counsel, examine the surrounding explanation, compare the biblical teaching, and ask what the author is actually addressing before applying the words.","correct":true}],"hint":"Review “Study a passage in its context” and 2 Timothy 2:15.","bibleLinks":[{"label":"2 Timothy 2:15 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Timothy%202%3A15&version=KJV"},{"label":"Acts 17:11 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%2017%3A11&version=KJV"}]}]}]};

type="button" class="ppx-action ppx-action-primary" data-question-step="1" ${!answered?'disabled':''}>${i===n-1?'See results':'Next question'} ${icon('arrow-right')}</button></div>`;

  function openStudy(id){
