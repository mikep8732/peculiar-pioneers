    return intro('Foundations of faith','What We Believe','We hold fast to the fundamental truths of Scripture as understood by Seventh-day Adventists, with particular emphasis on the present truth for this generation.')+`<section class="ppx-section"><div class="ppx-belief-list">${originalCopy.beliefs.map((b,i)=>`<details ${i===0?'open':''}><summary>${safe(b.title)}</summary><p>${safe(b.body)}</p><div class="ppx-belief-refs">${b.refs.map(r=>`<span>${safe(r)}</span>`).join('')}</div>${egwLinks(b.egwRefs)}</details>`).join('')}</div><div class="ppx-actions">${action('Explore Bible studies','watch')}</div></section>`;
  }
  function episodePage(id){
    const e=episodes.find(item=>item.id===id)||episodes[0];
    let related=episodes.filter(item=>item.id!==e.id&&item.topic===e.topic);
    if(related.length<3)related=related.concat(episodes.filter(item=>item.id!==e.id&&!related.includes(item))).slice(0,3);
    return `<section class="ppx-section"><button type="button" class="ppx-text-link ppx-back" data-page-link="watch">${icon('arrow-left')}Back to the studies</button><div class="ppx-detail-layout"><div><div class="ppx-player-poster"><img src="${images[e.id]}" alt="${safe(e.title)}"><a href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener noreferrer" aria-label="Watch this episode on YouTube"><span>${icon('play')}</span></a></div><div class="ppx-detail-copy"><div class="ppx-episode-meta"><span>${safe(e.topic)}</span><span>${safe(e.date)} · ${safe(e.duration||'')}</span></div><h1>${safe(e.title)}</h1>${e.series?`<span class="ppx-series-label">${safe(e.series.name)} · Part ${e.series.part} of ${e.series.total}</span>`:''}<p>${safe(e.description)}</p>${egwLinks(e.egwRefs)}<div class="ppx-actions"><a class="ppx-action ppx-action-primary" href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener noreferrer">Watch on YouTube ${icon('external-link')}</a></div><a class="ppx-text-link" href="https://www.peculiarpioneers.com/watch/${e.slug}" target="_blank" rel="noopener noreferrer">Open the current episode page ${icon('external-link')}</a></div></div><aside class="ppx-resource-card"><div class="ppx-kicker">Keep your Bible open</div><h2>Make time to reflect.</h2><p>Pause as you study. Look up the passages, take a few notes, and bring your questions.</p><button type="button" class="ppx-text-link" data-page-link="study">Explore a Bible lesson ${icon('arrow-up-right')}</button><button type="button" class="ppx-text-link" data-page-link="contact">Ask a study question ${icon('arrow-up-right')}</button>${e.series?`<div style="margin-top:20px"><div class="ppx-kicker">Continue the series</div>${episodes.filter(v=>v.id!==e.id&&v.series&&v.series.name===e.series.name).sort((a,b)=>a.series.part-b.series.part).map(v=>`<button type="button" class="ppx-text-link" data-episode="${v.id}">Part ${v.series.part} ${icon('arrow-up-right')}</button>`).join('')}</div>`:''}</aside></div></section><section class="ppx-section" style="padding-top:12px"><div class="ppx-section-head"><h2>Continue your study.</h2></div><div class="ppx-episode-grid">${related.slice(0,3).map(episodeCard).join('')}</div></section>`;
  }
  const studyContent = {"version":"1.1","date":"2026-09-14","title":"Peculiar Pioneers — Ten Bible Studies","translation":"KJV","scope":"Ten introductory topic studies with seven learning points each; selected passages, not an exhaustive course through every chapter.","editorialNote":"All lesson explanations and flashcard answers are editorial summaries of the cited passages, not verbatim EGW quotations. Scripture memory texts are KJV; excerpts are identified. Dates and doctrinal explanations follow the cited EGW exposition. Reflection prompts are personal applications and are not scored.","groups":["Knowing & following Christ","Worship & daily living","Prophecy & Christian hope"],"topics":[{"id":"righteousness-by-faith","title":"Righteousness by Faith","group":"Knowing & following Christ","icon":"heart-handshake","description":"Christ’s righteousness, assurance, living faith, and loving obedience.","verse":"Ephesians 2:8–9","verseText":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.","items":[{"id":"righteousness-by-faith-01","title":"The righteousness we cannot supply","bible":["Romans 3:20–24","Isaiah 64:6"],"egw":[{"book":"SC","chapter":7,"pages":"62","label":"Steps to Christ, 62","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"We cannot erase past sin or supply the righteousness God’s law requires by our own efforts. Christ lived a sinless life and died for us. He offers His righteousness to those who give themselves to Him and receive Him as their Saviour. Our hope begins with His provision.","reflect":"What changes when you stop treating acceptance with God as something to earn?","flashQuestion":"Why do sinners need Christ’s righteousness?","flashAnswer":"We have no righteousness of our own that can meet the claims of God’s holy law.","question":"What meets the sinner’s need for righteousness before God?","options":[{"text":"The righteousness provided by Jesus Christ.","feedback":"We cannot erase past sin or supply the righteousness God’s law requires by our own efforts. Christ lived a sinless life and died for us. He offers His righteousness to those who give themselves to Him and receive Him as their Saviour. Our hope begins with His provision.","correct":true},{"text":"Religious effort sufficient to make Christ unnecessary.","feedback":"The source identifies our need for Christ’s righteousness.","correct":false},{"text":"A comparison showing fewer sins than someone else.","feedback":"The standard is God’s holy law, not another person’s record.","correct":false},{"text":"An improved reputation that erases the past.","feedback":"A reputation cannot remove guilt or supply perfect righteousness.","correct":false}],"hint":"Review “The righteousness we cannot supply” and Romans 3:20–24.","bibleLinks":[{"label":"Romans 3:20–24 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%203%3A20-24&version=KJV"},{"label":"Isaiah 64:6 · KJV","url":"https://www.biblegateway.com/passage/?search=Isaiah%2064%3A6&version=KJV"}]},{"id":"righteousness-by-faith-02","title":"Accepted in Christ","bible":["Romans 5:1","2 Corinthians 5:21"],"egw":[{"book":"SC","chapter":7,"pages":"62.2–63","label":"Steps to Christ, 62.2–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"When we surrender to Christ and accept Him, His character stands in place of ours, and we are accepted before God for His sake. This is no boast in personal merit. Justification gives peace with God through our Lord Jesus Christ and directs all gratitude to Him.","reflect":"How does acceptance for Christ’s sake answer both pride and despair?","flashQuestion":"On whose righteousness does our acceptance with God depend?","flashAnswer":"Christ’s righteousness; His character stands in place of ours.","question":"What is the basis of acceptance described in Steps to Christ, page 62?","options":[{"text":"Our flawless performance before first approaching Him.","feedback":"The invitation is to the sinner who gives himself to Christ and accepts Him.","correct":false},{"text":"Christ’s character and righteousness received by faith.","feedback":"When we surrender to Christ and accept Him, His character stands in place of ours, and we are accepted before God for His sake. This is no boast in personal merit. Justification gives peace with God through our Lord Jesus Christ and directs all gratitude to Him.","correct":true},{"text":"The approval of a respected religious person.","feedback":"Acceptance rests in Christ, not another person’s approval.","correct":false},{"text":"Our ability to feel forgiven at every moment.","feedback":"The foundation is Christ’s provision, not constant emotional certainty.","correct":false}],"hint":"Review “Accepted in Christ” and Romans 5:1.","bibleLinks":[{"label":"Romans 5:1 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%205%3A1&version=KJV"},{"label":"2 Corinthians 5:21 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Corinthians%205%3A21&version=KJV"}]},{"id":"righteousness-by-faith-03","title":"Faith involves trust and surrender","bible":["James 2:19–20","Galatians 5:6"],"egw":[{"book":"SC","chapter":7,"pages":"63","label":"Steps to Christ, 63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"Acknowledging that God exists is not the same as saving faith. Steps to Christ describes faith that receives God’s Word, yields the will, and fixes the affections on Him. Such faith works by love and opens the life to His renewing power.","reflect":"Where is God asking you to move from agreement into trust?","flashQuestion":"How does living faith differ from intellectual assent?","flashAnswer":"It trusts God, yields the will to Him, and works by love.","question":"A person agrees with Bible facts but refuses to yield the will. What is still missing?","options":[{"text":"Nothing; agreement with facts is the whole of faith.","feedback":"The source distinguishes factual assent from living faith.","correct":false},{"text":"Living trust and surrender to God.","feedback":"Acknowledging that God exists is not the same as saving faith. Steps to Christ describes faith that receives God’s Word, yields the will, and fixes the affections on Him. Such faith works by love and opens the life to His renewing power.","correct":true},{"text":"Only more religious vocabulary.","feedback":"The distinction concerns the will and heart, not vocabulary.","correct":false},{"text":"A stronger argument that even devils acknowledge God.","feedback":"James uses that acknowledgment to show belief alone is insufficient.","correct":false}],"hint":"Review “Faith involves trust and surrender” and James 2:19–20.","bibleLinks":[{"label":"James 2:19–20 · KJV","url":"https://www.biblegateway.com/passage/?search=James%202%3A19-20&version=KJV"},{"label":"Galatians 5:6 · KJV","url":"https://www.biblegateway.com/passage/?search=Galatians%205%3A6&version=KJV"}]},{"id":"righteousness-by-faith-04","title":"Faith and God’s promise","bible":["1 John 1:9","Mark 11:24"],"egw":[{"book":"SC","chapter":6,"pages":"49–55","label":"Steps to Christ, 49–55","url":"https://www.ellenwhite.info/books/bk-sc-06.htm"}],"reading":"God invites us to confess, give ourselves to Him, and believe His promise of forgiveness. We need not wait for a particular feeling before trusting His word. Assurance rests in God’s faithfulness as we come to Him in repentance and faith, not in an emotional performance.","reflect":"Which promise can you hold to when feelings are unsettled?","flashQuestion":"Must we feel forgiven before believing God’s promise?","flashAnswer":"No. We may trust His promise as we come in repentance and faith.","question":"A repentant person has confessed but does not feel changed immediately. What does Steps to Christ counsel?","options":[{"text":"Assume unsettled emotions prove the confession was rejected.","feedback":"Emotional state is not the standard of God’s faithfulness.","correct":false},{"text":"Trust God’s promise and continue yielding to Him.","feedback":"God invites us to confess, give ourselves to Him, and believe His promise of forgiveness. We need not wait for a particular feeling before trusting His word. Assurance rests in God’s faithfulness as we come to Him in repentance and faith, not in an emotional performance.","correct":true},{"text":"Purchase assurance with a sufficient number of good deeds.","feedback":"Forgiveness is received through Christ, not bought with deeds.","correct":false},{"text":"Wait for a special feeling before believing His word.","feedback":"The chapter teaches trust in the promise rather than dependence on a feeling.","correct":false}],"hint":"Review “Faith and God’s promise” and 1 John 1:9.","bibleLinks":[{"label":"1 John 1:9 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%201%3A9&version=KJV"},{"label":"Mark 11:24 · KJV","url":"https://www.biblegateway.com/passage/?search=Mark%2011%3A24&version=KJV"}]},{"id":"righteousness-by-faith-05","title":"The same Christ who pardons also renews","bible":["Philippians 2:13","Galatians 2:20","Ephesians 2:10"],"egw":[{"book":"SC","chapter":7,"pages":"62–63","label":"Steps to Christ, 62–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"Christ not only provides righteousness for our acceptance; He also changes the heart. As we remain connected to Him through faith and surrender, He works in us to will and to do His good pleasure. His grace produces love, obedience, and good works in the life.","reflect":"What change would demonstrate Christ’s work within your ordinary relationships?","flashQuestion":"What does Christ do beyond granting pardon?","flashAnswer":"He changes the heart and works within us to produce willing obedience.","question":"Which statement describes the work of Christ in the believer?","options":[{"text":"He leaves the believer to generate holiness independently.","feedback":"He works within those who remain joined to Him.","correct":false},{"text":"He grants a label of righteousness while opposing all change.","feedback":"Steps to Christ explicitly says Christ changes the heart.","correct":false},{"text":"He changes behavior only through pressure from other people.","feedback":"The source describes His inward work through faith and surrender.","correct":false},{"text":"He provides acceptance and renews the heart for loving obedience.","feedback":"Christ not only provides righteousness for our acceptance; He also changes the heart. As we remain connected to Him through faith and surrender, He works in us to will and to do His good pleasure. His grace produces love, obedience, and good works in the life.","correct":true}],"hint":"Review “The same Christ who pardons also renews” and Philippians 2:13.","bibleLinks":[{"label":"Philippians 2:13 · KJV","url":"https://www.biblegateway.com/passage/?search=Philippians%202%3A13&version=KJV"},{"label":"Galatians 2:20 · KJV","url":"https://www.biblegateway.com/passage/?search=Galatians%202%3A20&version=KJV"},{"label":"Ephesians 2:10 · KJV","url":"https://www.biblegateway.com/passage/?search=Ephesians%202%3A10&version=KJV"}]},{"id":"righteousness-by-faith-06","title":"Grace bears fruit in love","bible":["Ephesians 2:8–10","John 15:4–5","1 John 5:3"],"egw":[{"book":"SC","chapter":7,"pages":"60–63","label":"Steps to Christ, 60–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"},{"book":"SC","chapter":9,"pages":"77–80","label":"Steps to Christ, 77–80","url":"https://www.ellenwhite.info/books/bk-sc-09.htm"}],"reading":"Salvation is the free gift of God, received by faith. Obedience and service are its fruit. As love for Christ fills the heart, we desire to please Him and bless others. A living faith neither boasts in works nor uses grace to excuse disobedience.","reflect":"What act of service could express gratitude for Christ’s grace this week?","flashQuestion":"Where do obedience and service belong in righteousness by faith?","flashAnswer":"They are the fruit of living faith and gratitude for grace, not the purchase price of salvation.","question":"Which statement brings grace and obedience together correctly?","options":[{"text":"We purchase salvation through obedience, then add faith.","feedback":"Ephesians places salvation in God’s gift of grace through faith.","correct":false},{"text":"Works matter chiefly because they give us grounds to boast.","feedback":"The passage excludes boasting and directs gratitude to God.","correct":false},{"text":"Grace removes any purpose for good works.","feedback":"Ephesians 2:10 describes a life created in Christ for good works.","correct":false},{"text":"We receive salvation by faith, and that living faith produces loving obedience.","feedback":"Salvation is the free gift of God, received by faith. Obedience and service are its fruit. As love for Christ fills the heart, we desire to please Him and bless others. A living faith neither boasts in works nor uses grace to excuse disobedience.","correct":true}],"hint":"Review “Grace bears fruit in love” and Ephesians 2:8–10.","bibleLinks":[{"label":"Ephesians 2:8–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Ephesians%202%3A8-10&version=KJV"},{"label":"John 15:4–5 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2015%3A4-5&version=KJV"},{"label":"1 John 5:3 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%205%3A3&version=KJV"}]},{"id":"righteousness-by-faith-07","title":"Rejoicing in the Lord","bible":["Romans 5:1–2,11","Philippians 4:4–7"],"egw":[{"book":"SC","chapter":13,"pages":"116–119,122–124","label":"Steps to Christ, 116–119,122–124","url":"https://www.ellenwhite.info/books/bk-sc-13.htm"}],"reading":"Trust in Christ gives reason for gratitude and hope. Steps to Christ invites us to remember God’s mercies and represent His goodness to others. Christian joy does not mean that trials or tears disappear, or that feelings remain constantly bright. We may bring our cares to God and rest in His love while encouraging one another.","reflect":"What mercy from God could you remember and share with someone today?","flashQuestion":"How can faith in Christ support joy during trials?","flashAnswer":"By resting in His love, remembering His mercies, and bringing our cares to Him.","question":"Which response reflects rejoicing in the Lord during a difficult season?","options":[{"text":"Acknowledge the trial, bring it to God, and remember His faithful love.","feedback":"Trust in Christ gives reason for gratitude and hope. Steps to Christ invites us to remember God’s mercies and represent His goodness to others. Christian joy does not mean that trials or tears disappear, or that feelings remain constantly bright. We may bring our cares to God and rest in His love while encouraging one another.","correct":true},{"text":"Pretend that grief or difficulty does not exist.","feedback":"Christian hope does not require denying real trials or tears.","correct":false},{"text":"Focus only on past failures and exclude every memory of mercy.","feedback":"Steps to Christ calls attention to God’s promises and the evidences of His care.","correct":false},{"text":"Treat a sad feeling as proof that Christ has rejected you.","feedback":"Assurance rests in Christ’s faithfulness, not an unbroken feeling of happiness.","correct":false}],"hint":"Review “Rejoicing in the Lord” and Romans 5:1–2,11.","bibleLinks":[{"label":"Romans 5:1–2,11 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%205%3A1-2%2C11&version=KJV"},{"label":"Philippians 4:4–7 · KJV","url":"https://www.biblegateway.com/passage/?search=Philippians%204%3A4-7&version=KJV"}]}]},{"id":"victory-over-sin","title":"Victory Over Sin","group":"Knowing & following Christ","icon":"shield-check","description":"Repentance, surrender, abiding in Christ, and a changed life.","verse":"John 15:5 · excerpt","verseText":"For without me ye can do nothing.","items":[{"id":"victory-over-sin-01","title":"Repentance reaches the heart","bible":["Acts 3:19","Psalm 51:1–10","Romans 2:4"],"egw":[{"book":"SC","chapter":3,"pages":"23–26","label":"Steps to Christ, 23–26","url":"https://www.ellenwhite.info/books/bk-sc-03.htm"}],"reading":"True repentance includes sorrow for sin and turning away from it. It goes deeper than fear of punishment. Christ draws us to Himself and gives the repentance we cannot produce by our own strength. David sought a clean heart as well as pardon.","reflect":"Is there a wrong you have regretted mainly because of its consequences?","flashQuestion":"What distinguishes true repentance from regret over consequences?","flashAnswer":"Sorrow for sin itself and a turning away from it, through Christ’s grace.","question":"Which response most clearly expresses true repentance?","options":[{"text":"Regret being discovered while planning to repeat the wrong.","feedback":"Regret over consequences is not a turning away from sin.","correct":false},{"text":"Blame circumstances so personal guilt can be avoided.","feedback":"Repentance honestly acknowledges the wrong.","correct":false},{"text":"Ask God for a clean heart and turn from the sin itself.","feedback":"True repentance includes sorrow for sin and turning away from it. It goes deeper than fear of punishment. Christ draws us to Himself and gives the repentance we cannot produce by our own strength. David sought a clean heart as well as pardon.","correct":true},{"text":"Wait to become worthy before coming to Christ.","feedback":"Christ Himself draws us and gives repentance.","correct":false}],"hint":"Review “Repentance reaches the heart” and Acts 3:19.","bibleLinks":[{"label":"Acts 3:19 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%203%3A19&version=KJV"},{"label":"Psalm 51:1–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Psalm%2051%3A1-10&version=KJV"},{"label":"Romans 2:4 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%202%3A4&version=KJV"}]},{"id":"victory-over-sin-02","title":"Yielding the will","bible":["James 4:7–8","Philippians 2:13"],"egw":[{"book":"SC","chapter":5,"pages":"43,47–48","label":"Steps to Christ, 43,47–48","url":"https://www.ellenwhite.info/books/bk-sc-05.htm"}],"reading":"We cannot change the heart by unaided effort, but we can choose to yield our will to God. As we surrender to Christ, He works within us to will and to do His pleasure. Victory involves real choice and cooperation with His power, not passive permission for sin to continue.","reflect":"What decision can you consciously place under Christ’s direction today?","flashQuestion":"What can we choose when we cannot change our own hearts?","flashAnswer":"Yield our will to Christ and depend on His transforming power.","question":"Which response follows the counsel on the will in Steps to Christ?","options":[{"text":"Assume surrender means making no choices against sin.","feedback":"Surrender is an active choice to place the will under God.","correct":false},{"text":"Expect willpower alone to regenerate the heart.","feedback":"The heart’s renewal requires Christ’s power.","correct":false},{"text":"Wait until every desire changes before choosing God.","feedback":"We may choose to yield while depending on Him to change the desires.","correct":false},{"text":"Choose to yield to Christ and cooperate with His working within.","feedback":"We cannot change the heart by unaided effort, but we can choose to yield our will to God. As we surrender to Christ, He works within us to will and to do His pleasure. Victory involves real choice and cooperation with His power, not passive permission for sin to continue.","correct":true}],"hint":"Review “Yielding the will” and James 4:7–8.","bibleLinks":[{"label":"James 4:7–8 · KJV","url":"https://www.biblegateway.com/passage/?search=James%204%3A7-8&version=KJV"},{"label":"Philippians 2:13 · KJV","url":"https://www.biblegateway.com/passage/?search=Philippians%202%3A13&version=KJV"}]},{"id":"victory-over-sin-03","title":"Abiding in Christ","bible":["John 15:4–5","Galatians 2:20"],"egw":[{"book":"SC","chapter":8,"pages":"68–70","label":"Steps to Christ, 68–70","url":"https://www.ellenwhite.info/books/bk-sc-08.htm"}],"reading":"A branch bears fruit by remaining joined to the vine. In the same way, a holy life depends continually on Christ. Daily consecration, trust, and communion sustain this relationship. Growth is not achieved by a moment of surrender followed by independence from Him.","reflect":"What could make daily consecration a real practice rather than a phrase?","flashQuestion":"What does the vine and branches illustration teach about victory?","flashAnswer":"We depend continually on union with Christ for a fruitful, holy life.","question":"Why does the branch bear fruit in John 15?","options":[{"text":"It becomes independent of the vine after its first growth.","feedback":"Jesus teaches continuing dependence.","correct":false},{"text":"It abides in the vine and receives life from it.","feedback":"A branch bears fruit by remaining joined to the vine. In the same way, a holy life depends continually on Christ. Daily consecration, trust, and communion sustain this relationship. Growth is not achieved by a moment of surrender followed by independence from Him.","correct":true},{"text":"It avoids any connection so growth will be entirely its own.","feedback":"Apart from the vine the branch cannot bear fruit.","correct":false},{"text":"It produces life by trying to look like other branches.","feedback":"Life comes from union with the vine, not comparison.","correct":false}],"hint":"Review “Abiding in Christ” and John 15:4–5.","bibleLinks":[{"label":"John 15:4–5 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2015%3A4-5&version=KJV"},{"label":"Galatians 2:20 · KJV","url":"https://www.biblegateway.com/passage/?search=Galatians%202%3A20&version=KJV"}]},{"id":"victory-over-sin-04","title":"Watch, pray, and take the way of escape","bible":["Matthew 26:41","1 Corinthians 10:13","Psalm 119:11"],"egw":[{"book":"SC","chapter":11,"pages":"93–95","label":"Steps to Christ, 93–95","url":"https://www.ellenwhite.info/books/bk-sc-11.htm"},{"book":"SC","chapter":8,"pages":"68–70","label":"Steps to Christ, 68–70","url":"https://www.ellenwhite.info/books/bk-sc-08.htm"}],"reading":"Jesus calls us to watch and pray against temptation. Scripture promises God’s faithfulness and a way of escape. We are to rely on His help and act on the light He gives: treasure His Word, turn from the tempting course, and seek grace in the moment of need.","reflect":"What practical escape could you prepare for a recurring temptation?","flashQuestion":"What response to temptation joins faith with action?","flashAnswer":"Watch and pray, rely on God’s help, and take the way of escape He provides.","question":"A familiar temptation appears. Which response best follows these passages?","options":[{"text":"Remain in the temptation to prove personal strength.","feedback":"Watchfulness does not require deliberately staying in avoidable temptation.","correct":false},{"text":"Treat prayer as a substitute for responding to God’s guidance.","feedback":"The counsel joins prayer and watchfulness with obedient action.","correct":false},{"text":"Assume temptation makes yielding unavoidable.","feedback":"God promises help and a way of escape.","correct":false},{"text":"Pray for help and act on the available way of escape.","feedback":"Jesus calls us to watch and pray against temptation. Scripture promises God’s faithfulness and a way of escape. We are to rely on His help and act on the light He gives: treasure His Word, turn from the tempting course, and seek grace in the moment of need.","correct":true}],"hint":"Review “Watch, pray, and take the way of escape” and Matthew 26:41.","bibleLinks":[{"label":"Matthew 26:41 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2026%3A41&version=KJV"},{"label":"1 Corinthians 10:13 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2010%3A13&version=KJV"},{"label":"Psalm 119:11 · KJV","url":"https://www.biblegateway.com/passage/?search=Psalm%20119%3A11&version=KJV"}]},{"id":"victory-over-sin-05","title":"When a believer falls","bible":["1 John 1:9","1 John 2:1","Proverbs 28:13"],"egw":[{"book":"SC","chapter":7,"pages":"64","label":"Steps to Christ, 64","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"},{"book":"SC","chapter":4,"pages":"37–41","label":"Steps to Christ, 37–41","url":"https://www.ellenwhite.info/books/bk-sc-04.htm"}],"reading":"God calls us away from sin; if we fall, we have an Advocate in Jesus Christ. Confess the particular wrong, forsake it, and return to Him. Steps to Christ counsels against despair while also rejecting excuses for sin. His mercy invites renewed repentance and trust.","reflect":"How can you respond to failure without either excusing it or giving up?","flashQuestion":"What should a believer do after falling into sin?","flashAnswer":"Confess and forsake the sin, returning in faith to Christ our Advocate.","question":"After a failure, which response holds together mercy and repentance?","options":[{"text":"Acknowledge the wrong, forsake it, and return to Jesus.","feedback":"God calls us away from sin; if we fall, we have an Advocate in Jesus Christ. Confess the particular wrong, forsake it, and return to Him. Steps to Christ counsels against despair while also rejecting excuses for sin. His mercy invites renewed repentance and trust.","correct":true},{"text":"Conclude that Christ will never receive a returning sinner.","feedback":"The passages offer forgiveness and advocacy to the repentant.","correct":false},{"text":"Use forgiveness as permission to plan the same sin again.","feedback":"Mercy calls us away from sin, not into a plan to continue it.","correct":false},{"text":"Hide the wrong to preserve a religious appearance.","feedback":"Concealment prevents honest confession and repentance.","correct":false}],"hint":"Review “When a believer falls” and 1 John 1:9.","bibleLinks":[{"label":"1 John 1:9 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%201%3A9&version=KJV"},{"label":"1 John 2:1 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%202%3A1&version=KJV"},{"label":"Proverbs 28:13 · KJV","url":"https://www.biblegateway.com/passage/?search=Proverbs%2028%3A13&version=KJV"}]},{"id":"victory-over-sin-06","title":"Real growth without self-exaltation","bible":["John 17:17","2 Peter 3:18","Philippians 3:12–14"],"egw":[{"book":"GC","chapter":27,"pages":"469–473","label":"The Great Controversy, 469–473","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-27.htm"},{"book":"SC","chapter":7,"pages":"64–65","label":"Steps to Christ, 64–65","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"Sanctification is the work of God’s Word and Spirit in the life. It is lifelong growth in Christlike character, involving daily surrender and obedience. The closer we come to Jesus, the more clearly we see our need of His grace. Real victory does not make us independent of Christ or give us grounds for boasting.","reflect":"What evidence of grace can you recognize without claiming credit for it?","flashQuestion":"How should growth in holiness affect our attitude?","flashAnswer":"It should deepen dependence on Christ and humility while producing real obedience.","question":"Which statement best describes sanctification in these sources?","options":[{"text":"Success that makes Christ’s daily help unnecessary.","feedback":"Spiritual growth increases our awareness of dependence on Him.","correct":false},{"text":"A claim of holiness that ends the need for growth.","feedback":"The sources present continuing growth, not self-satisfied finality.","correct":false},{"text":"An unchanged life protected by religious language.","feedback":"Sanctification changes the character and conduct.","correct":false},{"text":"Lifelong growth in holiness through God’s Word and Spirit, with humble dependence on Christ.","feedback":"Sanctification is the work of God’s Word and Spirit in the life. It is lifelong growth in Christlike character, involving daily surrender and obedience. The closer we come to Jesus, the more clearly we see our need of His grace. Real victory does not make us independent of Christ or give us grounds for boasting.","correct":true}],"hint":"Review “Real growth without self-exaltation” and John 17:17.","bibleLinks":[{"label":"John 17:17 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2017%3A17&version=KJV"},{"label":"2 Peter 3:18 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Peter%203%3A18&version=KJV"},{"label":"Philippians 3:12–14 · KJV","url":"https://www.biblegateway.com/passage/?search=Philippians%203%3A12-14&version=KJV"}]},{"id":"victory-over-sin-07","title":"Learning Christ’s character","bible":["2 Corinthians 3:18","Hebrews 12:2","1 John 4:19"],"egw":[{"book":"SC","chapter":8,"pages":"70–73","label":"Steps to Christ, 70–73","url":"https://www.ellenwhite.info/books/bk-sc-08.htm"}],"reading":"Steps to Christ directs us to contemplate Jesus’ love and character, copy His example, and depend on Him. John’s naturally resentful and ambitious temper was changed as he followed his Master and yielded to His influence. The Holy Spirit works real transformation as our attention and affections are fixed on Christ.","reflect":"Which trait in Jesus’ character would you like to study and imitate more closely?","flashQuestion":"How was John’s character changed as he followed Jesus?","flashAnswer":"He beheld Christ’s character, yielded to Him, and was renewed by the Holy Spirit.","question":"What does John’s experience in Steps to Christ illustrate?","options":[{"text":"Christ’s love and the Holy Spirit can transform a yielded person’s character.","feedback":"Steps to Christ directs us to contemplate Jesus’ love and character, copy His example, and depend on Him. John’s naturally resentful and ambitious temper was changed as he followed his Master and yielded to His influence. The Holy Spirit works real transformation as our attention and affections are fixed on Christ.","correct":true},{"text":"Admiring Jesus from a distance made surrender unnecessary.","feedback":"John yielded his temper to the molding power of Christ.","correct":false},{"text":"Remembering personal defects alone supplies the power to change.","feedback":"The chapter directs attention to Christ as the source of strength and transformation.","correct":false},{"text":"John naturally possessed every Christlike trait without needing change.","feedback":"The chapter describes his former ambition and resentment and his need of renewal.","correct":false}],"hint":"Review “Learning Christ’s character” and 2 Corinthians 3:18.","bibleLinks":[{"label":"2 Corinthians 3:18 · KJV","url":"https://www.biblegateway.com/passage/?search=2%20Corinthians%203%3A18&version=KJV"},{"label":"Hebrews 12:2 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%2012%3A2&version=KJV"},{"label":"1 John 4:19 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%204%3A19&version=KJV"}]}]},{"id":"law-of-god","title":"The Law of God","group":"Worship & daily living","icon":"notebook-pen","description":"God’s character, the knowledge of sin, and loving obedience.","verse":"Romans 7:12","verseText":"Wherefore the law is holy, and the commandment holy, and just, and good.","items":[{"id":"law-of-god-01","title":"A revelation of God’s character","bible":["Romans 7:12","Psalm 111:7–8"],"egw":[{"book":"GC","chapter":25,"pages":"434.1","label":"The Great Controversy, 434.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"SC","chapter":7,"pages":"60","label":"Steps to Christ, 60","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"God’s law is holy, just, and good. Ellen White describes it as a revelation of His will and character, embodying the principle of love. Its authority rests in who God is, rather than in changing human custom or preference.","reflect":"How does seeing the law as an expression of God’s character change your response?","flashQuestion":"How does Romans 7:12 describe the law?","flashAnswer":"Holy, just, and good.","question":"Which description agrees with Romans 7:12?","options":[{"text":"The law is merely an unreliable human tradition.","feedback":"The passage treats it as God’s holy commandment.","correct":false},{"text":"The law becomes good only when a majority approves it.","feedback":"Its goodness rests in God, not popular approval.","correct":false},{"text":"The law is the cause of God’s moral imperfection.","feedback":"Paul affirms the law’s goodness, not moral defect in God.","correct":false},{"text":"The law is holy, just, and good.","feedback":"God’s law is holy, just, and good. Ellen White describes it as a revelation of His will and character, embodying the principle of love. Its authority rests in who God is, rather than in changing human custom or preference.","correct":true}],"hint":"Review “A revelation of God’s character” and Romans 7:12.","bibleLinks":[{"label":"Romans 7:12 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%207%3A12&version=KJV"},{"label":"Psalm 111:7–8 · KJV","url":"https://www.biblegateway.com/passage/?search=Psalm%20111%3A7-8&version=KJV"}]},{"id":"law-of-god-02","title":"The knowledge of sin","bible":["Romans 3:20","1 John 3:4","James 1:23–25"],"egw":[{"book":"GC","chapter":27,"pages":"467–468","label":"The Great Controversy, 467–468","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-27.htm"}],"reading":"The law makes sin known. Like a mirror, it reveals the condition that needs correction, but it cannot supply forgiveness or change the heart by itself. Conviction should lead the sinner to Christ for pardon and renewal.","reflect":"What should you do when Scripture makes a fault clear?","flashQuestion":"What does the law make known according to Romans 3:20?","flashAnswer":"The knowledge of sin.","question":"If the law reveals a person’s guilt, what further need remains?","options":[{"text":"Christ’s forgiveness and renewing grace.","feedback":"The law makes sin known. Like a mirror, it reveals the condition that needs correction, but it cannot supply forgiveness or change the heart by itself. Conviction should lead the sinner to Christ for pardon and renewal.","correct":true},{"text":"Enough comparison with others to feel superior.","feedback":"Comparison cannot cleanse guilt or renew the heart.","correct":false},{"text":"No further need; recognizing guilt itself removes it.","feedback":"A mirror reveals a problem but does not remove it; conviction is not pardon.","correct":false},{"text":"A new standard that declares the same sin acceptable.","feedback":"Changing the standard does not reconcile the sinner to God.","correct":false}],"hint":"Review “The knowledge of sin” and Romans 3:20.","bibleLinks":[{"label":"Romans 3:20 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%203%3A20&version=KJV"},{"label":"1 John 3:4 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20John%203%3A4&version=KJV"},{"label":"James 1:23–25 · KJV","url":"https://www.biblegateway.com/passage/?search=James%201%3A23-25&version=KJV"}]},{"id":"law-of-god-03","title":"Love is the governing principle","bible":["Matthew 22:37–40","Romans 13:8–10"],"egw":[{"book":"SC","chapter":7,"pages":"59–60","label":"Steps to Christ, 59–60","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"Jesus gathers the law’s claims into love to God and love to our neighbor. Love does not authorize harm or disobedience; it expresses the purpose of the commandments. When God renews the heart, love becomes the motive for a life in harmony with His will.","reflect":"Which commandment can you connect with a concrete act of love?","flashQuestion":"What two loves summarize the law and the prophets?","flashAnswer":"Love to God with the whole heart, and love to our neighbor as ourselves.","question":"How does love relate to God’s commandments?","options":[{"text":"Love means outward compliance without concern for people.","feedback":"The commandments are fulfilled from a heart governed by love.","correct":false},{"text":"Love permits harm whenever intentions feel sincere.","feedback":"Biblical love does no ill to the neighbor.","correct":false},{"text":"Love fulfills their purpose through faithfulness to God and care for others.","feedback":"Jesus gathers the law’s claims into love to God and love to our neighbor. Love does not authorize harm or disobedience; it expresses the purpose of the commandments. When God renews the heart, love becomes the motive for a life in harmony with His will.","correct":true},{"text":"Love removes any need for an obedient life.","feedback":"Love fulfills the law rather than making disobedience harmless.","correct":false}],"hint":"Review “Love is the governing principle” and Matthew 22:37–40.","bibleLinks":[{"label":"Matthew 22:37–40 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2022%3A37-40&version=KJV"},{"label":"Romans 13:8–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%2013%3A8-10&version=KJV"}]},{"id":"law-of-god-04","title":"Christ upheld God’s law","bible":["Matthew 5:17–19","John 15:10"],"egw":[{"book":"GC","chapter":25,"pages":"434.1","label":"The Great Controversy, 434.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"GC","chapter":27,"pages":"466–467","label":"The Great Controversy, 466–467","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-27.htm"}],"reading":"Jesus said He came to fulfill, not destroy, the law and the prophets. He lived in obedience to His Father. The ceremonial sacrifices met their fulfillment in His death; this does not mean the Ten Commandments ceased to reveal God’s moral will.","reflect":"How does Christ’s example help you understand obedience?","flashQuestion":"Did Christ’s fulfillment make God’s moral law void?","flashAnswer":"No. He upheld it and lived in obedience; the sacrificial types found their fulfillment in His death.","question":"Which distinction helps explain Christ’s fulfillment?","options":[{"text":"Sacrificial types met their fulfillment in His death; God’s moral law remains.","feedback":"Jesus said He came to fulfill, not destroy, the law and the prophets. He lived in obedience to His Father. The ceremonial sacrifices met their fulfillment in His death; this does not mean the Ten Commandments ceased to reveal God’s moral will.","correct":true},{"text":"Every moral command ended with the animal sacrifices.","feedback":"The end of sacrificial types is not the abolition of the moral law.","correct":false},{"text":"Christ fulfilled the law by violating its principles.","feedback":"Jesus testified that He kept His Father’s commandments.","correct":false},{"text":"The cross means sin can no longer be identified.","feedback":"God’s law continues to reveal sin and His holy character.","correct":false}],"hint":"Review “Christ upheld God’s law” and Matthew 5:17–19.","bibleLinks":[{"label":"Matthew 5:17–19 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%205%3A17-19&version=KJV"},{"label":"John 15:10 · KJV","url":"https://www.biblegateway.com/passage/?search=John%2015%3A10&version=KJV"}]},{"id":"law-of-god-05","title":"Written in the heart","bible":["Hebrews 10:16","Ezekiel 36:26–27"],"egw":[{"book":"SC","chapter":7,"pages":"60–63","label":"Steps to Christ, 60–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"The new covenant promises God’s law within the heart. God gives a new heart and His Spirit, enabling obedience from within. The change reaches motives, affections, and conduct, producing more than outward agreement with religious expectations.","reflect":"What motive would you like God to renew within you?","flashQuestion":"Where does God promise to write His law under the new covenant?","flashAnswer":"In the hearts and minds of His people.","question":"What change does the new-covenant promise describe?","options":[{"text":"The erasure of all moral responsibility.","feedback":"God writes His law within; He does not erase its principles.","correct":false},{"text":"Only a change of religious label.","feedback":"The promise concerns the inner life, not a label alone.","correct":false},{"text":"God writes His law within and renews the heart for obedience.","feedback":"The new covenant promises God’s law within the heart. God gives a new heart and His Spirit, enabling obedience from within. The change reaches motives, affections, and conduct, producing more than outward agreement with religious expectations.","correct":true},{"text":"External pressure without any change in desire.","feedback":"The promise includes a new heart and the Spirit’s work.","correct":false}],"hint":"Review “Written in the heart” and Hebrews 10:16.","bibleLinks":[{"label":"Hebrews 10:16 · KJV","url":"https://www.biblegateway.com/passage/?search=Hebrews%2010%3A16&version=KJV"},{"label":"Ezekiel 36:26–27 · KJV","url":"https://www.biblegateway.com/passage/?search=Ezekiel%2036%3A26-27&version=KJV"}]},{"id":"law-of-god-06","title":"Obedience as the fruit of faith","bible":["Ephesians 2:8–10","Romans 3:31","James 2:17"],"egw":[{"book":"SC","chapter":7,"pages":"60–63","label":"Steps to Christ, 60–63","url":"https://www.ellenwhite.info/books/bk-sc-07.htm"}],"reading":"We are saved by grace through faith, not by earning God’s favor through works. Yet faith in Christ brings a changed life. Ellen White warns against both trusting works to save and claiming that belief makes obedience unnecessary. Christ gives pardon and power for a life of good works.","reflect":"How can you pursue obedience while resting in Christ’s acceptance?","flashQuestion":"What is the relationship between salvation, faith, and obedience?","flashAnswer":"Salvation is God’s gift received by faith; obedience is the fruit of that living faith.","question":"Which statement avoids the two errors identified in Steps to Christ?","options":[{"text":"Faith frees a believer to disregard God’s law.","feedback":"Living faith receives grace that enables obedience.","correct":false},{"text":"Outward conformity is enough without a renewed heart.","feedback":"God seeks the obedience of love from a renewed heart.","correct":false},{"text":"Trust Christ for salvation and let living faith bear the fruit of obedience.","feedback":"We are saved by grace through faith, not by earning God’s favor through works. Yet faith in Christ brings a changed life. Ellen White warns against both trusting works to save and claiming that belief makes obedience unnecessary. Christ gives pardon and power for a life of good works.","correct":true},{"text":"Good conduct can purchase God’s acceptance.","feedback":"Salvation is the gift of grace, not a wage earned by conduct.","correct":false}],"hint":"Review “Obedience as the fruit of faith” and Ephesians 2:8–10.","bibleLinks":[{"label":"Ephesians 2:8–10 · KJV","url":"https://www.biblegateway.com/passage/?search=Ephesians%202%3A8-10&version=KJV"},{"label":"Romans 3:31 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%203%3A31&version=KJV"},{"label":"James 2:17 · KJV","url":"https://www.biblegateway.com/passage/?search=James%202%3A17&version=KJV"}]},{"id":"law-of-god-07","title":"The perfect law of liberty","bible":["James 1:25","Psalm 119:45","John 8:34–36"],"egw":[{"book":"GC","chapter":27,"pages":"466.2","label":"The Great Controversy, 466.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-27.htm"}],"reading":"James calls God’s law the perfect law of liberty, and the psalmist connects liberty with seeking God’s precepts. Sin is bondage; Christ makes us free to live in harmony with God. Christian freedom is therefore not permission to injure others or disregard His will. It is a life of willing allegiance to our Redeemer.","reflect":"How has obedience to a good principle protected freedom in your life?","flashQuestion":"What does James call the law in James 1:25?","flashAnswer":"The perfect law of liberty.","question":"Which understanding of freedom agrees with these passages?","options":[{"text":"Freedom is the unrestricted right to harm a neighbor.","feedback":"Such conduct is bondage to sin, not the liberty described here.","correct":false},{"text":"Christ frees us from sin’s bondage for willing obedience to God.","feedback":"James calls God’s law the perfect law of liberty, and the psalmist connects liberty with seeking God’s precepts. Sin is bondage; Christ makes us free to live in harmony with God. Christian freedom is therefore not permission to injure others or disregard His will. It is a life of willing allegiance to our Redeemer.","correct":true},{"text":"Freedom means God’s moral will no longer matters.","feedback":"James calls the law a law of liberty, and Christ frees people from sin.","correct":false},{"text":"Freedom is achieved by replacing Christ with personal merit.","feedback":"John 8 identifies the Son as the One who makes us free.","correct":false}],"hint":"Review “The perfect law of liberty” and James 1:25.","bibleLinks":[{"label":"James 1:25 · KJV","url":"https://www.biblegateway.com/passage/?search=James%201%3A25&version=KJV"},{"label":"Psalm 119:45 · KJV","url":"https://www.biblegateway.com/passage/?search=Psalm%20119%3A45&version=KJV"},{"label":"John 8:34–36 · KJV","url":"https://www.biblegateway.com/passage/?search=John%208%3A34-36&version=KJV"}]}]},{"id":"sabbath","title":"The Sabbath","group":"Worship & daily living","icon":"sun","description":"Creation, the seventh day, joyful worship, and the works of mercy.","verse":"Exodus 20:8","verseText":"Remember the sabbath day, to keep it holy.","items":[{"id":"sabbath-01","title":"A gift from Creation","bible":["Genesis 2:1–3","Mark 2:27"],"egw":[{"book":"DA","chapter":29,"pages":"281.1–282.1","label":"The Desire of Ages, 281.1–282.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-desire-of-ages-da-29.htm"}],"reading":"God rested on the seventh day, blessed it, and sanctified it at Creation. The Sabbath was given for humanity’s good before Israel existed as a nation. It is a memorial of the Creator’s power and love, calling us to remember the One who made us.","reflect":"What does the Sabbath teach you about your value as God’s creation?","flashQuestion":"When did God bless and sanctify the seventh day?","flashAnswer":"At Creation, when He rested after His work of making the world.","question":"Where does Scripture first locate the blessing and sanctifying of the seventh day?","options":[{"text":"At the resurrection of Jesus.","feedback":"The seventh day was sanctified in Genesis, long before the resurrection.","correct":false},{"text":"At the giving of the manna in the wilderness.","feedback":"The manna instruction came later; Genesis already records the blessing.","correct":false},{"text":"At Solomon’s dedication of the temple.","feedback":"The Sabbath precedes the temple and Israel’s monarchy.","correct":false},{"text":"At the completion of Creation.","feedback":"God rested on the seventh day, blessed it, and sanctified it at Creation. The Sabbath was given for humanity’s good before Israel existed as a nation. It is a memorial of the Creator’s power and love, calling us to remember the One who made us.","correct":true}],"hint":"Review “A gift from Creation” and Genesis 2:1–3.","bibleLinks":[{"label":"Genesis 2:1–3 · KJV","url":"https://www.biblegateway.com/passage/?search=Genesis%202%3A1-3&version=KJV"},{"label":"Mark 2:27 · KJV","url":"https://www.biblegateway.com/passage/?search=Mark%202%3A27&version=KJV"}]},{"id":"sabbath-02","title":"The day named in the commandment","bible":["Exodus 20:8–11"],"egw":[{"book":"GC","chapter":25,"pages":"434–435","label":"The Great Controversy, 434–435","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"}],"reading":"The fourth commandment identifies the seventh day as the Sabbath of the Lord. It sets six days for ordinary work and calls for the seventh to be kept holy. Its rest extends to the household and others within one’s responsibility, not merely to the person with the most freedom.","reflect":"How can your Sabbath preparation consider the rest of others?","flashQuestion":"Which day does the fourth commandment identify as the Sabbath?","flashAnswer":"The seventh day, the Sabbath of the Lord thy God.","question":"What distinguishes the fourth commandment from a general suggestion to rest occasionally?","options":[{"text":"It leaves the holy day entirely to personal preference.","feedback":"The commandment specifies the seventh day.","correct":false},{"text":"It identifies the seventh day and calls it holy.","feedback":"The fourth commandment identifies the seventh day as the Sabbath of the Lord. It sets six days for ordinary work and calls for the seventh to be kept holy. Its rest extends to the household and others within one’s responsibility, not merely to the person with the most freedom.","correct":true},{"text":"It requires only an inward feeling of rest.","feedback":"It includes a named day and the cessation of ordinary work.","correct":false},{"text":"It grants rest to household heads alone.","feedback":"The commandment extends rest to those within their responsibility.","correct":false}],"hint":"Review “The day named in the commandment” and Exodus 20:8–11.","bibleLinks":[{"label":"Exodus 20:8–11 · KJV","url":"https://www.biblegateway.com/passage/?search=Exodus%2020%3A8-11&version=KJV"}]},{"id":"sabbath-03","title":"A sign of God’s work","bible":["Ezekiel 20:12,20","Exodus 31:13"],"egw":[{"book":"GC","chapter":25,"pages":"437.1","label":"The Great Controversy, 437.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"DA","chapter":29,"pages":"288.2","label":"The Desire of Ages, 288.2","url":"https://www.ellenwhite.info/books/ellen-g-white-book-desire-of-ages-da-29.htm"}],"reading":"The Sabbath points to God as Creator and as the One who sanctifies His people. Keeping it expresses allegiance and trust in Him. Holiness comes through His power; observing the day is not a claim that we can create righteousness for ourselves.","reflect":"How might Sabbath rest deepen your dependence on God’s power?","flashQuestion":"What does the Sabbath signify in Ezekiel 20?","flashAnswer":"That the Lord is our God and the One who sanctifies His people.","question":"A person treats Sabbath keeping as proof of self-produced holiness. What does Ezekiel emphasize instead?","options":[{"text":"The sign concerns national prosperity alone.","feedback":"The passages explicitly identify God and His work of sanctification.","correct":false},{"text":"Holiness is achieved by rest without trust in God.","feedback":"The sign points to the Lord’s sanctifying work.","correct":false},{"text":"The Lord is the One who sanctifies His people.","feedback":"The Sabbath points to God as Creator and as the One who sanctifies His people. Keeping it expresses allegiance and trust in Him. Holiness comes through His power; observing the day is not a claim that we can create righteousness for ourselves.","correct":true},{"text":"The day is unrelated to knowing the Lord.","feedback":"Ezekiel says the sign helps His people know that He is the Lord.","correct":false}],"hint":"Review “A sign of God’s work” and Ezekiel 20:12,20.","bibleLinks":[{"label":"Ezekiel 20:12,20 · KJV","url":"https://www.biblegateway.com/passage/?search=Ezekiel%2020%3A12%2C20&version=KJV"},{"label":"Exodus 31:13 · KJV","url":"https://www.biblegateway.com/passage/?search=Exodus%2031%3A13&version=KJV"}]},{"id":"sabbath-04","title":"Calling the Sabbath a delight","bible":["Isaiah 58:13–14"],"egw":[{"book":"GC","chapter":26,"pages":"451–453","label":"The Great Controversy, 451–453","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-26.htm"},{"book":"DA","chapter":29,"pages":"289.1","label":"The Desire of Ages, 289.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-desire-of-ages-da-29.htm"}],"reading":"Isaiah calls us to honor God’s holy day and find our delight in the Lord. The invitation directs our attention away from ordinary self-seeking business and toward communion with Him. The Sabbath is meant to be a blessing, a time for worship, gratitude, and the enjoyment of God’s goodness.","reflect":"What could help your household experience Sabbath as a delight?","flashQuestion":"What attitude toward the Sabbath does Isaiah 58 encourage?","flashAnswer":"Honor it as God’s holy day and call it a delight.","question":"Which Sabbath plan best reflects Isaiah’s invitation?","options":[{"text":"Continue ordinary business while calling the day holy.","feedback":"Isaiah connects honoring the day with turning from ordinary self-seeking pursuits.","correct":false},{"text":"Measure holiness by how burdensome the day feels.","feedback":"Isaiah describes the Sabbath as a delight.","correct":false},{"text":"Treat rest as an excuse to forget the Lord.","feedback":"The promised delight is specifically in the Lord.","correct":false},{"text":"Prepare for worship and make room to delight in the Lord.","feedback":"Isaiah calls us to honor God’s holy day and find our delight in the Lord. The invitation directs our attention away from ordinary self-seeking business and toward communion with Him. The Sabbath is meant to be a blessing, a time for worship, gratitude, and the enjoyment of God’s goodness.","correct":true}],"hint":"Review “Calling the Sabbath a delight” and Isaiah 58:13–14.","bibleLinks":[{"label":"Isaiah 58:13–14 · KJV","url":"https://www.biblegateway.com/passage/?search=Isaiah%2058%3A13-14&version=KJV"}]},{"id":"sabbath-05","title":"It is lawful to do good","bible":["Matthew 12:9–13","Mark 3:1–5"],"egw":[{"book":"DA","chapter":29,"pages":"286.3–287.3","label":"The Desire of Ages, 286.3–287.3","url":"https://www.ellenwhite.info/books/ellen-g-white-book-desire-of-ages-da-29.htm"}],"reading":"Jesus healed on the Sabbath and taught that it is lawful to do good on that day. He upheld God’s commandment while correcting traditions that neglected human need. Works of mercy and care for the suffering agree with the Sabbath’s purpose.","reflect":"Who could receive kindness and practical care from you this Sabbath?","flashQuestion":"How did Jesus relate works of mercy to the Sabbath?","flashAnswer":"He taught that doing good and relieving suffering are consistent with the Sabbath.","question":"Someone needs compassionate help on the Sabbath. Which principle did Jesus teach?","options":[{"text":"Mercy should always wait until the next day.","feedback":"Jesus relieved suffering on the Sabbath.","correct":false},{"text":"Helping a person cancels the Sabbath commandment.","feedback":"Jesus upheld the commandment while demonstrating its merciful purpose.","correct":false},{"text":"Human traditions determine whether mercy is permitted.","feedback":"Jesus corrected traditions that placed burdens above human need.","correct":false},{"text":"It is lawful to do good on the Sabbath.","feedback":"Jesus healed on the Sabbath and taught that it is lawful to do good on that day. He upheld God’s commandment while correcting traditions that neglected human need. Works of mercy and care for the suffering agree with the Sabbath’s purpose.","correct":true}],"hint":"Review “It is lawful to do good” and Matthew 12:9–13.","bibleLinks":[{"label":"Matthew 12:9–13 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2012%3A9-13&version=KJV"},{"label":"Mark 3:1–5 · KJV","url":"https://www.biblegateway.com/passage/?search=Mark%203%3A1-5&version=KJV"}]},{"id":"sabbath-06","title":"Conscience and the final test","bible":["Revelation 14:9–12","Acts 5:29"],"egw":[{"book":"GC","chapter":25,"pages":"449.1","label":"The Great Controversy, 449.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm"},{"book":"GC","chapter":38,"pages":"604–605","label":"The Great Controversy, 604–605","url":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-38.htm"}],"reading":"The Great Controversy describes a final conflict involving enforced worship and an informed choice between God’s commandment and human authority. It also recognizes sincere Christians who presently believe Sunday is the Sabbath. Its description of the mark of the beast must preserve the distinction between present misunderstanding and the final test after the issue is made plain.","reflect":"How can you speak clearly about the Sabbath while respecting another person’s conscience?","flashQuestion":"What distinction is essential when teaching the final Sabbath test?","flashAnswer":"Present sincere misunderstanding differs from an informed choice in the final conflict over enforced worship.","question":"Which statement preserves the distinction in GC 449.1?","options":[{"text":"Sincerity makes God’s commandments permanently irrelevant.","feedback":"The passage calls for obedience as the issue becomes clear.","correct":false},{"text":"The final test involves light received and a choice between divine and human authority.","feedback":"The Great Controversy describes a final conflict involving enforced worship and an informed choice between God’s commandment and human authority. It also recognizes sincere Christians who presently believe Sunday is the Sabbath. Its description of the mark of the beast must preserve the distinction between present misunderstanding and the final test after the issue is made plain.","correct":true},{"text":"Everyone worshipping on Sunday has already received the mark.","feedback":"GC 449.1 expressly recognizes sincere Christians and describes a future informed choice.","correct":false},{"text":"The final issue is merely which day is more convenient.","feedback":"The conflict concerns worship and allegiance, not convenience.","correct":false}],"hint":"Review “Conscience and the final test” and Revelation 14:9–12.","bibleLinks":[{"label":"Revelation 14:9–12 · KJV","url":"https://www.biblegateway.com/passage/?search=Revelation%2014%3A9-12&version=KJV"},{"label":"Acts 5:29 · KJV","url":"https://www.biblegateway.com/passage/?search=Acts%205%3A29&version=KJV"}]},{"id":"sabbath-07","title":"Jesus is Lord of the Sabbath","bible":["Mark 2:27–28","John 1:1–3"],"egw":[{"book":"DA","chapter":29,"pages":"288.2–289.1","label":"The Desire of Ages, 288.2–289.1","url":"https://www.ellenwhite.info/books/ellen-g-white-book-desire-of-ages-da-29.htm"}],"reading":"Jesus declared Himself Lord of the Sabbath. The Desire of Ages connects this authority with His work as Creator: the One through whom all things were made also made the Sabbath. The day belongs to Him and points to His creative and sanctifying power. Sabbath fellowship should therefore draw us closer to Christ.","reflect":"How can you make your Sabbath observance more consciously centered on Jesus?","flashQuestion":"Who is Lord of the Sabbath?","flashAnswer":"Jesus Christ, the Son of man, through whom all things were made.","question":"How does The Desire of Ages connect Jesus with the Sabbath?","options":[{"text":"His lordship gives religious leaders authority to redefine His commandment.","feedback":"The passage identifies Christ’s authority, not authority for people to replace His commandment.","correct":false},{"text":"He made the Sabbath a memorial of human achievement.","feedback":"The Sabbath points to His creative and sanctifying power.","correct":false},{"text":"He had no part in Creation and therefore no authority over the day.","feedback":"John 1 and DA 288 connect His authority with His work as Creator.","correct":false},{"text":"As Creator, He made the Sabbath; it belongs to Him.","feedback":"Jesus declared Himself Lord of the Sabbath. The Desire of Ages connects this authority with His work as Creator: the One through whom all things were made also made the Sabbath. The day belongs to Him and points to His creative and sanctifying power. Sabbath fellowship should therefore draw us closer to Christ.","correct":true}],"hint":"Review “Jesus is Lord of the Sabbath” and Mark 2:27–28.","bibleLinks":[{"label":"Mark 2:27–28 · KJV","url":"https://www.biblegateway.com/passage/?search=Mark%202%3A27-28&version=KJV"},{"label":"John 1:1–3 · KJV","url":"https://www.biblegateway.com/passage/?search=John%201%3A1-3&version=KJV"}]}]},{"id":"health-message","title":"The Health Message","group":"Worship & daily living","icon":"sprout","description":"Care of body and mind, temperance, thoughtful reform, and service.","verse":"1 Corinthians 10:31","verseText":"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.","items":[{"id":"health-message-01","title":"The body belongs to God","bible":["1 Corinthians 6:19–20","Romans 12:1"],"egw":[{"book":"Ed","chapter":21,"pages":"195.1,200.3–201.1","label":"Education, 195.1,200.3–201.1","url":"https://m.egwwritings.org/en/book/29.1026#1032"}],"reading":"Our bodies belong to God and are to be used for His glory. Education connects care of physical health with our ability to think clearly, develop character, and serve. Healthful living is stewardship of God’s gift, carried out with gratitude and reverence.","reflect":"What ordinary habit could better express gratitude for the body God has given you?","flashQuestion":"What biblical reason underlies the care of the body?","flashAnswer":"Our bodies belong to God and are temples of the Holy Ghost.","question":"What is the central reason for caring for the body in 1 Corinthians 6?","options":[{"text":"Bodily habits have no relation to Christian living.","feedback":"Paul explicitly connects the body with glorifying God.","correct":false},{"text":"Physical appearance determines our worth before God.","feedback":"The passage bases stewardship on belonging to God, not appearance.","correct":false},{"text":"Strong health is a payment that earns forgiveness.","feedback":"Forgiveness is received through Christ; bodily care is stewardship.","correct":false},{"text":"We belong to God and are to glorify Him in our bodies.","feedback":"Our bodies belong to God and are to be used for His glory. Education connects care of physical health with our ability to think clearly, develop character, and serve. Healthful living is stewardship of God’s gift, carried out with gratitude and reverence.","correct":true}],"hint":"Review “The body belongs to God” and 1 Corinthians 6:19–20.","bibleLinks":[{"label":"1 Corinthians 6:19–20 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%206%3A19-20&version=KJV"},{"label":"Romans 12:1 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%2012%3A1&version=KJV"}]},{"id":"health-message-02","title":"A broad pattern of healthful living","bible":["1 Corinthians 10:31","3 John 2"],"egw":[{"book":"MH","chapter":8,"pages":"127.2","label":"The Ministry of Healing, 127.2","url":"https://www.ellenwhite.info/books/bk-mh-08.htm"}],"reading":"The Ministry of Healing names pure air, sunlight, temperance, rest, exercise, proper diet, water, and trust in divine power. Her word “abstemiousness” concerns self-restraint. The counsel considers several parts of life together, rather than reducing the health message to a single food rule.","reflect":"Which part of this broad pattern receives the least attention in your routine?","flashQuestion":"Which eight helps are named in MH 127.2?","flashAnswer":"Pure air, sunlight, temperance, rest, exercise, proper diet, water, and trust in divine power.","question":"Which group is included in the counsel of MH 127.2?","options":[{"text":"Diet alone, with the other habits treated as irrelevant.","feedback":"The counsel includes several physical and spiritual aspects of life.","correct":false},{"text":"Rest, exercise, proper diet, and trust in divine power.","feedback":"The Ministry of Healing names pure air, sunlight, temperance, rest, exercise, proper diet, water, and trust in divine power. Her word “abstemiousness” concerns self-restraint. The counsel considers several parts of life together, rather than reducing the health message to a single food rule.","correct":true},{"text":"Constant work, little sleep, excitement, and worry.","feedback":"The passage names rest and trust rather than exhaustion and worry.","correct":false},{"text":"Intoxicants, stimulants, excess, and inactivity.","feedback":"Those practices do not match the temperance, rest, and exercise named in the passage.","correct":false}],"hint":"Review “A broad pattern of healthful living” and 1 Corinthians 10:31.","bibleLinks":[{"label":"1 Corinthians 10:31 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2010%3A31&version=KJV"},{"label":"3 John 2 · KJV","url":"https://www.biblegateway.com/passage/?search=3%20John%202&version=KJV"}]},{"id":"health-message-03","title":"Simple, nourishing food","bible":["Genesis 1:29","Genesis 3:18","1 Corinthians 10:31"],"egw":[{"book":"MH","chapter":23,"pages":"295–297","label":"The Ministry of Healing, 295–297","url":"https://www.ellenwhite.info/books/bk-mh-23.htm"}],"reading":"Ellen White directs attention to the Creator’s provision of grains, fruits, nuts, and vegetables, prepared simply. She also says food choices should account for circumstances and individual needs. The purpose is nourishment and fitness for service, with sound judgment in selecting from available foods.","reflect":"What simple, nourishing meal could your household prepare together?","flashQuestion":"What broad food pattern does MH 295–297 commend?","flashAnswer":"Simply prepared grains, fruits, nuts, and vegetables, chosen with regard to individual needs.","question":"Which approach combines the food counsel and the qualification in MH 296?","options":[{"text":"Choose simple, nourishing foods suited to one’s needs and circumstances.","feedback":"Ellen White directs attention to the Creator’s provision of grains, fruits, nuts, and vegetables, prepared simply. She also says food choices should account for circumstances and individual needs. The purpose is nourishment and fitness for service, with sound judgment in selecting from available foods.","correct":true},{"text":"Insist that every person tolerate an identical menu.","feedback":"MH 296.2 recognizes differing needs and circumstances.","correct":false},{"text":"Let stimulation of appetite be the sole aim.","feedback":"The stated purpose is nourishment, not merely stimulation.","correct":false},{"text":"Assume preparation and variety do not matter.","feedback":"The passage discusses simple preparation and a range of wholesome foods.","correct":false}],"hint":"Review “Simple, nourishing food” and Genesis 1:29.","bibleLinks":[{"label":"Genesis 1:29 · KJV","url":"https://www.biblegateway.com/passage/?search=Genesis%201%3A29&version=KJV"},{"label":"Genesis 3:18 · KJV","url":"https://www.biblegateway.com/passage/?search=Genesis%203%3A18&version=KJV"},{"label":"1 Corinthians 10:31 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2010%3A31&version=KJV"}]},{"id":"health-message-04","title":"Temperance and a clear mind","bible":["1 Corinthians 9:25–27","Proverbs 20:1","Galatians 5:22–23"],"egw":[{"book":"MH","chapter":26,"pages":"325–328,334–335","label":"The Ministry of Healing, 325–328,334–335","url":"https://www.ellenwhite.info/books/bk-mh-26.htm"}],"reading":"Temperance brings appetite under principle and self-control. The Ministry of Healing counsels against intoxicating drink, tobacco, and the habitual stimulation sought through tea and coffee. It connects habits affecting the body with mental and moral strength. The aim is a clear mind and a life available for God’s service.","reflect":"What helps you choose principle when appetite or habit presses strongly?","flashQuestion":"What is the spiritual aim of temperance?","flashAnswer":"Self-control, a clear mind, and the preservation of our powers for God’s service.","question":"Which aim best expresses temperance in this lesson?","options":[{"text":"Prove spiritual superiority through outward restrictions.","feedback":"The purpose is faithful stewardship, not superiority.","correct":false},{"text":"Let appetite alone decide what is beneficial.","feedback":"Temperance places appetite under principle and self-control.","correct":false},{"text":"Bring appetite under principle and preserve the powers of body and mind.","feedback":"Temperance brings appetite under principle and self-control. The Ministry of Healing counsels against intoxicating drink, tobacco, and the habitual stimulation sought through tea and coffee. It connects habits affecting the body with mental and moral strength. The aim is a clear mind and a life available for God’s service.","correct":true},{"text":"Use stronger stimulation whenever tiredness appears.","feedback":"The cited chapter warns against habitual reliance on stimulants.","correct":false}],"hint":"Review “Temperance and a clear mind” and 1 Corinthians 9:25–27.","bibleLinks":[{"label":"1 Corinthians 9:25–27 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%209%3A25-27&version=KJV"},{"label":"Proverbs 20:1 · KJV","url":"https://www.biblegateway.com/passage/?search=Proverbs%2020%3A1&version=KJV"},{"label":"Galatians 5:22–23 · KJV","url":"https://www.biblegateway.com/passage/?search=Galatians%205%3A22-23&version=KJV"}]},{"id":"health-message-05","title":"Reform with good judgment","bible":["Romans 12:1–2","1 Corinthians 10:31"],"egw":[{"book":"MH","chapter":25,"pages":"318.2–320.1","label":"The Ministry of Healing, 318.2–320.1","url":"https://www.ellenwhite.info/books/bk-mh-25.htm"}],"reading":"Health reform calls for careful thought. Ellen White warns against both indulgence and excessive restriction, including a diet that fails to nourish. She recognizes that people cannot all eat the same things and counsels against making oneself the rule for everyone else. Practice sound principles without harshness.","reflect":"How can you encourage better habits while respecting another person’s needs?","flashQuestion":"What two extremes does MH 319 warn against?","flashAnswer":"Indulgence and excessive restriction; both can undermine the purpose of health reform.","question":"A restricted diet leaves someone poorly nourished. Which response agrees with MH 318–320?","options":[{"text":"Restore adequate nourishment and adapt the diet with sound judgment.","feedback":"Health reform calls for careful thought. Ellen White warns against both indulgence and excessive restriction, including a diet that fails to nourish. She recognizes that people cannot all eat the same things and counsels against making oneself the rule for everyone else. Practice sound principles without harshness.","correct":true},{"text":"Continue the restriction because more restriction is always better.","feedback":"The passage warns that an impoverished diet can impair health and usefulness.","correct":false},{"text":"Abandon every health principle because one practice failed.","feedback":"The counsel calls for intelligent reform, avoiding both extremes.","correct":false},{"text":"Require everyone else to adopt the same restricted menu.","feedback":"MH 319 rejects making one person an unvarying rule for all.","correct":false}],"hint":"Review “Reform with good judgment” and Romans 12:1–2.","bibleLinks":[{"label":"Romans 12:1–2 · KJV","url":"https://www.biblegateway.com/passage/?search=Romans%2012%3A1-2&version=KJV"},{"label":"1 Corinthians 10:31 · KJV","url":"https://www.biblegateway.com/passage/?search=1%20Corinthians%2010%3A31&version=KJV"}]},{"id":"health-message-06","title":"Health ministry includes compassionate service","bible":["Matthew 25:35–40","Luke 10:33–37"],"egw":[{"book":"MH","chapter":9,"pages":"143.3–144.1","label":"The Ministry of Healing, 143.3–144.1","url":"https://www.ellenwhite.info/books/bk-mh-09.htm"}],"reading":"Christ approached people with genuine concern for their good. He showed sympathy, met needs, and won confidence, then invited them to follow Him. Health ministry should include practical compassion for people who suffer, alongside instruction and spiritual encouragement.","reflect":"What practical need could you help meet without waiting for recognition?","flashQuestion":"What pattern of service does MH 143 describe in Christ’s method?","flashAnswer":"Mingle with concern for people’s good, show sympathy, meet needs, win confidence, and invite them to follow Christ.","question":"Which ministry approach follows the pattern in MH 143?","options":[{"text":"Require agreement before expressing kindness.","feedback":"Christ’s sympathy and service demonstrated His concern for people’s good.","correct":false},{"text":"Offer instruction while ignoring visible suffering.","feedback":"Christ’s method included ministering to people’s needs.","correct":false},{"text":"Listen, show sympathy, meet practical needs, and invite people to follow Christ.","feedback":"Christ approached people with genuine concern for their good. He showed sympathy, met needs, and won confidence, then invited them to follow Him. Health ministry should include practical compassion for people who suffer, alongside instruction and spiritual encouragement.","correct":true},{"text":"Make personal recognition the goal of assistance.","feedback":"The pattern centers on people’s good and the invitation to Christ.","correct":false}],"hint":"Review “Health ministry includes compassionate service” and Matthew 25:35–40.","bibleLinks":[{"label":"Matthew 25:35–40 · KJV","url":"https://www.biblegateway.com/passage/?search=Matthew%2025%3A35-40&version=KJV"},{"label":"Luke 10:33–37 · KJV","url":"https://www.biblegateway.com/passage/?search=Luke%2010%3A33-37&version=KJV"}]},{"id":"health-message-07","title":"Put understanding into practice","bible":["James 1:22","1 Corinthians 10:31"],"egw":[{"book":"Ed","chapter":21,"pages":"200.2–201.1","label":"Education, 200.2–201.1","url":"https://m.egwwritings.org/en/book/29.1026#1032"}],"reading":"Knowing health principles is not the same as living by them. Education explains that knowledge and available resources accomplish little unless they are put to use. The learner is to recognize the value of the body as God’s handiwork and practice what has been understood. Begin with a thoughtful, practical change that honors Him.","reflect":"What one health principle can you put into practice this week?","flashQuestion":"What must follow the study of health principles?","flashAnswer":"Conscientious practice of what we have learned.","question":"A person can explain health principles but never acts on them. What does Education emphasize?","options":[{"text":"Collecting more facts is sufficient even if habits never change.","feedback":"Education says that knowledge alone brings little benefit without application.","correct":false},{"text":"Put the understood principles into conscientious daily practice.","feedback":"Knowing health principles is not the same as living by them. Education explains that knowledge and available resources accomplish little unless they are put to use. The learner is to recognize the value of the body as God’s handiwork and practice what has been understood. Begin with a thoughtful, practical change that honors Him.","correct":true},{"text":"Wait for ideal surroundings before practicing any principle.","feedback":"The emphasis is on using the knowledge and means available, not postponing every useful action.","correct":false},{"text":"Use knowledge mainly to criticize other people’s habits.","feedback":"The purpose is faithful care of God’s handiwork
