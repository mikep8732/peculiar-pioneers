  function handleStudyAction(button){
    if(button.dataset.studyId){openStudy(button.dataset.studyId);return true;}
    if(button.hasAttribute('data-card-step')){const p=progress();p.card=Math.max(0,Math.min(activeStudy().items.length-1,p.card+Number(button.dataset.cardStep)));flipped=false;updateLesson();content.querySelector('[data-flip]')?.focus();return true;}
    if(button.hasAttribute('data-answer-index')){const p=progress();if(p.answers[p.question]!==null)return true;p.answers[p.question]=Number(button.dataset.answerIndex);updateLesson();content.querySelector('[data-question-step="1"]')?.focus();return true;}
    if(button.hasAttribute('data-question-step')){const p=progress();if(Number(button.dataset.questionStep)===1&&p.answers[p.question]===null)return true;const next=p.question+Number(button.dataset.questionStep);if(next>=activeStudy().items.length)p.summary=true;else p.question=Math.max(0,next);updateLesson();content.querySelector('[data-answer-index], [data-retake]')?.focus();return true;}
    if(button.hasAttribute('data-question-jump')){progress().question=Number(button.dataset.questionJump);updateLesson();return true;}
    if(button.hasAttribute('data-read-item')){readFocus=Number(button.dataset.readItem);currentLessonTab='read';updateLesson();content.querySelector('#ppx-reading-'+readFocus)?.scrollIntoView({behavior:'auto',block:'nearest'});return true;}
    if(button.hasAttribute('data-retake')){const p=progress();p.question=0;p.answers=Array(activeStudy().items.length).fill(null);p.summary=false;updateLesson();return true;}
    return false;
  }

  });
  root.addEventListener('click',event=>{
    if(!event.target.closest('.ppx-study-nav'))closeStudyMenus();
    const button=event.target.closest('button'); if(!button||!root.contains(button))return;
    if(handleStudyAction(button))return;
    if(button.dataset.studyMenu){
      const menu=root.querySelector('#'+button.dataset.studyMenu);
      const opening=menu.hidden;
      closeStudyMenus();menu.hidden=!opening;
      button.setAttribute('aria-expanded',String(opening));return;
    }
    if(button.dataset.device){root.dataset.device=button.dataset.device;root.querySelectorAll('.ppx-devices button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));return;}
    if(button.classList.contains('ppx-menu')){const menu=root.querySelector('#ppx-mobile-nav');menu.hidden=!menu.hidden;button.setAttribute('aria-expanded',String(!menu.hidden));button.querySelector('span').textContent=menu.hidden?'Menu':'Close';return;}
    if(button.dataset.pageLink){if(button.dataset.pageLink==='watch'){selectedTopic='All studies';searchTerm='';}show(button.dataset.pageLink);top();return;}
    if(button.dataset.episode){show('episode',button.dataset.episode);top();return;}
    if(button.dataset.topicLink){selectedTopic=button.dataset.topicLink;searchTerm='';show('watch');top();return;}
    if(button.dataset.era){evidenceEra=Number(button.dataset.era);evidenceSearch='';content.querySelector('#ppx-evidence-search').value='';updateEvidence();return;}
    if(button.dataset.evidenceToggle){const type=button.dataset.evidenceToggle;if(selectedEventTypes.has(type))selectedEventTypes.delete(type);else selectedEventTypes.add(type);updateEvidence();return;}
    if(button.hasAttribute('data-evidence-all')){selectedEventTypes=button.dataset.evidenceAll==='true'?new Set(Object.keys(eventTypes)):new Set();updateEvidence();return;}
    if(button.dataset.filter){selectedTopic=button.dataset.filter;updateResults();return;}
    if(button.dataset.lessonTab){currentLessonTab=button.dataset.lessonTab;updateLesson();return;}
    if(button.hasAttribute('data-flip')){flipped=!flipped;updateLesson();content.querySelector('[data-flip]')?.focus();return;}
  });
  root.addEventListener('input',event=>{if(event.target.id==='ppx-search'){searchTerm=event.target.value;updateResults();}if(event.target.id==='ppx-evidence-search'){evidenceSearch=event.target.value;updateEvidence();}});
  root.addEventListener('submit',event=>{if(event.target.classList.contains('ppx-contact-form')){event.preventDefault();event.target.querySelector('.ppx-form-feedback').hidden=false;}});
  root.addEventListener('change',event=>{if(event.target.id==='ppx-study-picker')openStudy(event.target.value);});
  show('study');
})();
</script>
