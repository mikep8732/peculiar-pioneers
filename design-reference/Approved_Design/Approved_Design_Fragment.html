/* Compact, content-sized columns with two closely aligned rows. */

  display:grid;
  grid-template-columns:repeat(2,max-content);
  grid-auto-flow:row;
  justify-content:center;
  align-items:stretch;
  gap:0 18px;
  padding:10px 20px;
}
#ppx-studies-preview .ppx-topic-strip button{
  justify-content:flex-start;
  min-width:0;
  min-height:32px;
  font-size:11px;
  text-align:left;
}
#ppx-studies-preview .ppx-topic-strip svg{flex-shrink:0}

  #ppx-studies-preview .ppx-topic-strip button{min-height:44px}
}

y the closing events of Bible prophecy.","date":"Jun 13, 2026","category":"Sermons","duration":"52:15","publishedDate":"2026-06-13","topic":"Sermons"},{"id":"1Diq7ME6ut8","slug":"revisiting-charlie-kirk-shooting-sda-church","title":"Revisiting the Charlie Kirk Shooting: How This Divided the SDA Church","description":"This episode discusses reactions to the Charlie Kirk shooting and questions of Christian unity, conduct, and preparation for Christ’s return. As we consider current events, we test applications by Scripture and seek a response marked by repentance, faith, and compassion. A modern event should not be presented as a specifically named EGW prediction without a source that establishes that connection.","date":"Apr 9, 2026","category":"Current Events","duration":"1:37:13","publishedDate":"2026-04-09","topic":"Current Events","egwRefs":[["GC",37,"595.1; 598.2"],["SC",9,"77–83"]]},{"id":"onRTGYSJKXw","slug":"three-angels-message-sanctuary-truth","title":"The Three Angels’ Message & The Sanctuary Truth: (Day of Atonement Study)","description":"Connect the Day of Atonement with Christ’s ministry in the heavenly sanctuary and the three angels’ messages. Revelation 14 announces the judgment hour, calls us to worship the Creator, declares Babylon’s fall, and warns against false worship. Revelation 18 adds the call for God’s people to come out of Babylon. Our response is repentance, faith in Jesus, and obedience through His grace.","date":"Mar 3, 2026","category":"Sanctuary","duration":"1:20:39","publishedDate":"2026-03-03","topic":"Sanctuary","egwRefs":[["GC",25,"435.2–437.2"],["GC",38,"603.1–605.2"],["SC",7,"59–63"]]},{"id":"6hYDUX1Yfjc","slug":"day-of-atonement-cleansing-of-the-sanctuary","title":"The Day of Atonement & the Cleansing of the Sanctuary (Bible Study)","description":"Study the Day of Atonement, the cleansing of the sanctuary, and the judgment. Christ ministers on the merits of His sacrifice and is our Advocate. The investigative judgment began in 184 pisode, we continue our 2300-day prophecy series by examining Daniel 7 and revealing the identifying marks of the little horn power.","date":"Jul 17, 2025","category":"2300 Day Prophecy","duration":"1:20:51","publishedDate":"2025-07-17","topic":"2300 Day Prophecy"},{"id":"AgPrJeiZGGU","slug":"the-stone-is-coming-daniel-2","title":"The Stone is Coming: An Overview of Daniel 2 & The 2300 Day Prophecy","description":"In this foundational study, we explore why God gave prophecy and break down Daniel 2's timeline, introducing the foundation for understanding the 2300-day prophecy.","date":"Jul 1, 2025","category":"2300 Day Prophecy","duration":"1:11:20","publishedDate":"2025-07-01","topic":"2300 Day Prophecy"},{"id":"zOtE6xNjftg","slug":"beginning-2300-day-prophecy-part-2","title":"The Beginning of the 2300-Day Prophecy Explained Pt. 2","description":"Part 2 of our study on the beginning of the 2300-day prophecy, continuing to unlock the prophetic timeline of Daniel.","date":"May 21, 2025","category":"2300 Day Prophecy","duration":"1:04:59","series":{"name":"Beginning of the 2300-Day Prophecy","part":2,"total":2},"publishedDate":"2025-05-21","topic":"2300 Day Prophecy"},{"id":"5iZwQVCEIPU","slug":"beginning-2300-day-prophecy-part-1","title":"The Beginning of the 2300-Day Prophecy Explained","description":"Study the first sixty-nine of the seventy weeks in Daniel 9: 483 years pointing to the baptism and anointing of Jesus. The seventy weeks form the first 490 years of the longer 2,300-year period, beginning with the decree to restore Jerusalem.","date":"May 6, 2025","category":"2300 Day Prophecy","duration":"45:38","series":{"name":"Beginning of the 2300-Day Prophecy","part":1,"total":2},"publishedDate":"2025-05-06","topic":"2300 Day Prophecy","egwRefs":[["GC",18,"325.2–328.2"]]},{"id":"GEJKAzY7HQk","slug":"70-week-prophecy","title":"The 70-Week Prophecy: What You Must Know First","description":"The 70 weeks of Daniel 9 explained. A crucial foundation for understanding the 2300-day prophecy.","date":"Apr 28, 2025","category":"2300 Day Prophecy","duration":"22:55","publishedDate":"2025-04-28","topic":"2300 Day Prophecy"},{"id":"F361r8T5ijc","slug":"why-is-bible-prophecy-important","title":"Special In-Person Episode: Why is Bible Prophecy Important?","description":"A special in-person episode exploring the importance of Bible prophecy and why understanding it matters for believers today.","date":"Mar 27, 2025","category":"2300 Day Prophecy","duration":"48:20","publishedDate":"2025-03-27","topic":"2300 Day Prophecy"},{"id":"lUHKRBlzukI","slug":"seventh-day-adventists-great-disappointment-1844","thumbnail":"https://img.youtube.com/vi/lUHKRBlzukI/hqdefault.jpg","title":"Were Seventh-Day Adventists Responsible for the Great Disappointment in 1844?","description":"This clip from our Sanctuary series examines a common misconception about William Miller and the Great Disappointment of 1844. We discuss the Christian denominations involved in the Millerite movement and the later organization of the Seventh-day Adventist Church.","date":"Mar 12, 2025","category":"2300 Day Prophecy","duration":"3:38","publishedDate":"2025-03-12","topic":"2300 Day Prophecy"},{"id":"e1yKdYJ_Bcs","slug":"time-is-at-hand-preparing-souls-jesus-return","title":"The Time is at Hand: Preparing Souls for Jesus' Return - Sermon by Michael Porter","description":"Michael Porter explores repentance, conversion, and the call to become fishers of men. Drawing from Matthew 4:17, this sermon considers how personal transformation, compassion, and sharing present truth prepare souls for Jesus' return.","date":"Mar 8, 2025","category":"Sermons","duration":"43:44","publishedDate":"2025-03-08","topic":"Sermons"},{"id":"SXM0oZZY__k","slug":"the-call-to-holiness","title":"The Call to Holiness: Put on Jesus Christ","description":"In this episode of ID'ing Christ, we explore the nature of God as the Holy One and the role of holiness in the life of the believer.","date":"Mar 7, 2025","category":"ID'ing Christ","duration":"1:36:17","publishedDate":"2025-03-07","topic":"ID'ing Christ"},{"id":"L_VoCfmPGSs","slug":"mark-of-the-lamb-sabbath-vs-sunday-part-2","title":"The Sabbath vs. Sunday debate: The Mark of the Lamb (Part 2) - Sermon by Rueben Swain","description":"In Part 2, Rueben Swain continues the study of the Sabbath as a sign of God’s authority and the call to keep His commandments. The Great Controversy distinguishes sincere Christians who have not understood the Sabbath from the informed choice in the final conflict over enforced worship.","date":"Feb 22, 2025","category":"Sermons","duration":"45:35","series":{"name":"The Mark of the Lamb","part":2,"total":2},"publishedDate":"2025-02-22","topic":"Sermons","egwRefs":[["GC",25,"449.1"],["GC",38,"604.1–605.2"]]},{"id":"2aJJCmoCuVE","slug":"why-is-jesus-called-i-am","title":"Why is Jesus Called I AM?","description":"In the continuation of our series, 'ID'ing Christ', we explore the connection between Jesus Christ and the I AM of the Old Testament.","date":"Feb 21, 2025","category":"ID'ing Christ","duration":"59:42","publishedDate":"2025-02-21","topic":"ID'ing Christ"},{"id":"u8DwbBhi3fg","slug":"mark-of-the-lamb-sabbath-vs-sunday-part-1","title":"The Mark of the Lamb: Sabbath vs. Sunday, A Biblical Perspective (Part 1) - Sermon by Rueben Swain","description":"Rueben Swain examines the Sabbath, God’s seal, and the mark of the beast in a study of worship and allegiance. The final test concerns an informed choice under enforced worship, after the issue has been made plain. Present Sunday observance alone is not a basis for saying that a person has received the mark of the beast.","date":"Feb 15, 2025","category":"Sermons","duration":"34:14","series":{"name":"The Mark of the Lamb","part":1,"total":2},"publishedDate":"2025-02-15","topic":"Sermons","egwRefs":[["GC",25,"449.1–450.1"],["GC",38,"604.3–605.2"]]},{"id":"dSbxFXsfWOQ","slug":"is-jesus-christ-our-high-priest","title":"Is Jesus Christ our high Priest? - Sermon by Dr. Joseph Thomas","description":"Dr. Joseph Thomas explores Christ's role as our High Priest and the sanctuary as a witness to God's work of redemption. This sermon considers biblical testimony, the altar of witness, and how believers can reflect Christ through their character.","date":"Jan 30, 2025","category":"Sermons","duration":"53:13","publishedDate":"2025-01-30","topic":"Sermons"},{"id":"EA9tqH19Z5Y","slug":"what-is-jesus-doing-right-now-part-3","title":"What is Jesus Doing Right Now? (Part 3)","description":"In Part 3 of our Sanctuary series, we explore the Plan of Redemption, the Spring and Fall feasts, and their prophetic significance.","date":"Jan 18, 2025","category":"Sanctuary","duration":"57:09","series":{"name":"What is Jesus Doing Right Now?","part":3,"total":3},"publishedDate":"2025-01-18","topic":"Sanctuary"},{"id":"XgMm8u3rans","slug":"plan-of-redemption-the-play-part-2","title":"The Plan of Redemption (The Play) Part 2 - Sermon by Rueben Swain","description":"Rueben Swain continues The Plan of Redemption with a discussion of Project 2025, economic uncertainty, civil unrest, and religious liberty. Study contemporary applications alongside the biblical prophecy of enforced worship. The existence of a political proposal does not by itself establish that the final Sunday-law test has arrived.","date":"Jan 11, 2025","category":"Sermons","duration":"57:52","series":{"name":"The Plan of Redemption (The Play)","part":2,"total":2},"publishedDate":"2025-01-11","topic":"Sermons","egwRefs":[["GC",25,"445.1; 449.1"],["GC",38,"604.3–605.2"]]},{"id":"6tzisBsI0Zw","slug":"plan-of-redemption-the-play-part-1","title":"The Plan of Redemption (The Play) - Sermon by Rueben Swain","description":"Rueben Swain explores how the sanctuary reveals God's plan of redemption. Drawing from the creation account, Psalm 77, and 2 Peter 3, this sermon considers God's timing and the importance of unity in understanding His plan.","date":"Jan 4, 2025","category":"Sermons","duration":"1:03:51","series":{"name":"The Plan of Redemption (The Play)","part":1,"total":2},"publishedDate":"2025-01-04","topic":"Sermons"},{"id":"_yLLWBwlIIg","slug":"what-is-jesus-doing-right-now-part-2","title":"What is Jesus Doing Right Now? (Part 2)","description":"In Part 2 of our Sanctuary series, we explore the vital importance of the Sanctuary message and what Christ is doing right now in the heavenly sanctuary on our behalf.","date":"Jan 3, 2025","category":"Sanctuary","duration":"37:18","series":{"name":"What is Jesus Doing Right Now?","part":2,"total":3},"publishedDate":"2025-01-03","topic":"Sanctuary"},{"id":"lIvTWvsjqqk","slug":"what-is-jesus-doing-right-now-part-1","title":"What is Jesus Doing Right Now? (Part 1)","description":"Welcome to our Sanctuary series! In this first episode, we explore what Jesus is doing right now in the heavenly sanctuary and why this message is so important for us today.","date":"Dec 21, 2024","category":"Sanctuary","duration":"50:23","series":{"name":"What is Jesus Doing Right Now?","part":1,"total":3},"publishedDate":"2024-12-21","topic":"Sanctuary"},{"id":"YvsHjN23IYU","slug":"is-jesus-in-the-old-testament-part-2","title":"Is Jesus in the Old Testament? (Part 2)","description":"Join us as we continue to explore the question, 'Is Jesus Christ in the Old Testament?' Discover more evidence of Christ throughout the Hebrew Scriptures.","date":"Sep 27, 2024","category":"ID'ing Christ","duration":"39:08","series":{"name":"Is Jesus in the Old Testament?","part":2,"total":2},"publishedDate":"2024-09-27","topic":"ID'ing Christ"},{"id":"qq3zrAboDJs","slug":"is-jesus-in-the-old-testament-part-1","title":"Is Jesus in the Old Testament? (Part 1)","description":"Welcome to our first episode, where we explore the presence of Jesus in the Old Testament. Discover how Christ is revealed throughout the Hebrew Scriptures.","date":"Sep 20, 2024","category":"ID'ing Christ","duration":"42:49","series":{"name":"Is Jesus in the Old Testament?","part":1,"total":2},"publishedDate":"2024-09-20","topic":"ID'ing Christ"}];

  const originalCopy = {"about":{"title":"About Peculiar Pioneers","subtitle":"Who we are and why we do what we do","paragraphs":["Peculiar Pioneers is a Seventh-day Adventist ministry sharing the everlasting gospel and the three angels’ messages of Revelation 14. We invite people to know Jesus Christ, study His Word, and prepare for His return through repentance and faith in Him.","The everlasting gospel reveals God’s love in giving His Son to save us from sin. Jesus died for us, rose again, and ministers as our High Priest in the heavenly sanctuary. We depend on His righteousness for acceptance with God and on His Spirit to renew our hearts and enable us to obey His commandments.","The word ‘peculiar’ in our name comes from 1 Peter 2:9, where God’s people are called ‘a peculiar people’ and are to show forth His praises. The pioneers of the Advent movement remind us to search the Scriptures prayerfully, comparing passage with passage. We seek to study, live, and share the truths of God’s Word with humility and love.","Through sermons, Bible studies, and podcasts, we explain the sanctuary, the Sabbath, the three angels’ messages, and the hope of Christ’s return. We also encourage confession and the forsaking of sin, daily prayer, healthful living, and practical care for others. While Christ intercedes for us, His invitation to repent and receive His grace remains open; our purpose is to help people respond to Him now."],"mission":"To proclaim the everlasting gospel and the three angels’ messages: calling people to repentance and faith in Jesus, announcing the hour of God’s judgment, honoring the Creator and His commandments, and sharing His call to leave Babylon and be ready for Christ’s return.","values":[{"title":"Scripture First","body":"The Bible is our rule of faith and practice. We study it prayerfully and test every teaching by its testimony."},{"title":"Present Truth","body":"We share the everlasting gospel with the sanctuary, the Sabbath, the judgment, and the three angels’ messages as we look for Christ’s return."},{"title":"Christ-Centered","body":"Jesus is our Saviour, righteousness, and High Priest. We depend on His grace for forgiveness and for a life of loving obedience."},{"title":"Practical Godliness","body":"Faith in Christ bears fruit in honesty, kindness, modesty, temperance, and service. We seek to honor God in our thoughts, words, dress, health, and conduct."}]},"beliefs":[{"title":"The Word of God","body":"The Holy Scriptures, Old and New Testaments, are the written Word of God. The Bible is the only rule of faith and practice, sufficient for all doctrine and instruction.","refs":["2 Timothy 3:16-17","2 Peter 1:20-21","Isaiah 8:20"],"egwRefs":[["GC",37,"595.1; 598.1–599.3"],["SC",10,"89–91"]]},{"title":"The Godhead","body":"There is one God: Father, Son, and Holy Spirit, a unity of three co-eternal Persons. God is immortal, all-powerful, all-knowing, above all, and ever present.","refs":["Deuteronomy 6:4","Matthew 28:19","1 John 5:7"]},{"title":"Salvation in Jesus Christ","body":"God gave His Son to save us from sin. Christ draws us to repentance, offers forgiveness, and renews the heart. When we surrender to Him and receive Him by faith, His righteousness is our acceptance before God. We cannot earn salvation by our works; living faith bears fruit in loving obedience. We grow by daily dependence on Christ and the power of His Spirit.","refs":["John 3:16","Acts 5:31","1 John 1:9","Ephesians 2:8–10","John 15:4–5"],"egwRefs":[["SC",3,"23–26"],["SC",6,"49–55"],["SC",7,"59–63"],["SC",8,"68–72"]]},{"title":"The Sabbath","body":"The seventh day is the Sabbath of the Lord, a memorial of Creation and a sign of His sanctifying power. We observe it from Friday sunset to Saturday sunset, laying aside secular work for rest, worship, and fellowship with God. We honor the Sabbath as an expression of love and obedience to our Creator.","refs":["Genesis 2:1-3","Exodus 20:8-11","Isaiah 58:13-14","Mark 2:27-28","Leviticus 23:32","Ezekiel 20:12"],"egwRefs":[["GC",25,"433.2–437.2"],["GC",26,"451.1–453.3"]]},{"title":"The Second Coming","body":"Jesus Christ will return personally, visibly, and in glory. The righteous dead will be raised, and the living righteous will be changed and gathered with them to meet the Lord. We look for His coming with hope, watchfulness, and faithful service, without setting a date for His return.","refs":["John 14:1-3","Acts 1:9-11","Revelation 1:7","Matthew 24:30-31","1 Thessalonians 4:16–17","1 Corinthians 15:51–54"],"egwRefs":[["GC",26,"456.1–457.1"],["GC",40,"640.3–645.1"]]},{"title":"The Sanctuary","body":"Jesus ministers for us in the heavenly sanctuary on the merits of His sacrifice. His priestly ministry began after His ascension. In 1844 He entered the most holy place to begin the closing work of atonement, including the investigative judgment and the blotting out of sins. He is the Advocate of those who come to God through Him in repentance and faith.","refs":["Hebrews 8:1-5","Hebrews 9:23-24","Daniel 8:14","Revelation 14:6-7"],"egwRefs":[["GC",23,"420.2–422.1"],["GC",28,"482.4–485.2"]]},{"title":"The Three Angels' Messages","body":"Revelation 14:6–12 presents the everlasting gospel, announces that the hour of God’s judgment has come, calls us to worship the Creator, declares Babylon’s fall, and warns against worshiping the beast and his image or receiving his mark. These messages call for the commandments of God and the faith of Jesus. Revelation 18 adds the call for God’s people to come out of Babylon. In the final test, the issue is an informed choice between God’s commandment and enforced false worship.","refs":["Revelation 14:6-12","Revelation 18:1-4"],"egwRefs":[["GC",20,"355.1–355.3"],["GC",25,"435.2–450.1"],["GC",38,"603.1–605.2"]]},{"title":"The State of the Dead","body":"Death is an unconscious sleep until the resurrection. At Christ’s return, the righteous dead will be raised to immortality. The general resurrection of the wicked takes place after the thousand years. Our hope rests in Jesus, who has conquered death.","refs":["Ecclesiastes 9:5-6","Psalm 146:4","John 11:11-14","1 Thessalonians 4:16-17","Revelation 20:4–6"],"egwRefs":[["GC",33,"545.2–550"],["GC",41,"660.4–661.2"]]},{"title":"Health Reform","body":"Our bodies belong to God. We seek to preserve our physical and mental powers through healthful habits and temperance, avoiding practices that harm them. Caring for health is part of our service to God and others; it does not earn salvation. We depend on Christ’s grace for a renewed heart and a life of obedience.","refs":["1 Corinthians 6:19-20","1 Corinthians 10:31","Romans 12:1-2"],"egwRefs":[["GC",27,"473.2–475.1"],["SC",7,"59–63"]]},{"title":"The Spirit of Prophecy","body":"We receive the writings of Ellen G. White as prophetic counsel that directs us to Jesus Christ and the Scriptures. The Bible remains the standard by which every teaching and religious experience must be tested. We encourage readers to examine each quotation in its original context.","refs":["Revelation 12:17","Revelation 19:10","Amos 3:7","Joel 2:28-29"],"egwRefs":[["GC",37,"593.1; 595.1"]]}],"home":{"intro":"We share the everlasting gospel and the three angels’ messages with a world in need of hope. Through Bible study, preaching, and fellowship, we invite people to know Jesus, receive His grace, and prepare for His return.","mission":"Peculiar Pioneers shares the everlasting gospel and the three angels’ messages of Revelation 14. We invite people to repentance and faith in Jesus, to understand His ministry in the heavenly sanctuary, and to honor God’s commandments, including the seventh-day Sabbath. Our desire is a life transformed by His grace and ready for His return.","quote":"The Bible should never be studied without prayer.","quoteSource":"Ellen G. White · The Great Controversy, 599.3"},"evidenceText":{"intro":"This selected chronology brings together world events from 1844 onward for historical and Bible study. The sanctuary study explains why 1844 is significant: Christ then entered the most holy place to begin the closing work of atonement. The event list is not a complete record of disasters or a statistical measure of their increase.","introQuote":"The Great Controversy describes calamities and a coming conflict over worship and God’s law. Its warning also directs us to Scripture, repentance, and Christ’s protection. Read the surrounding chapters to understand the sequence and purpose of the warning.","conclusion":["The Great Controversy warns that calamities will become more frequent and disastrous and describes the final conflict over worship. That prophetic teaching must be read in its context. A selected historical list does not, by itself, demonstrate the trend or establish that every event was individually predicted.","The final plagues follow the close of Christ’s intercession; they should not be confused with every present-day disaster. While He ministers for us, we are called to repent, trust His righteousness, obey His Word, and care for those who suffer.","The message ends in hope. Christ will deliver His people, sin and death will be destroyed, and God will make all things new. Our purpose in studying prophecy is to follow Jesus faithfully and share His saving message."],"closingQuote":"The great controversy is ended. Sin and sinners are no more. The entire universe is clean."}};
  const evidenceEras = [{"id":1,"name":"The Beginning of the End","years":"1844-1869","description":"These entries cover 1844–1869. The significance of 1844 rests on the sanctuary prophecy: Christ entered the most holy place to begin the closing work of atonement and the investigative judgment. The disasters listed here do not supply the calculation of that date.","introQuote":{"text":"The enemy has worked, and he is working still. He is come down in great power, and the Spirit of God is being withdrawn from the earth.","source":"Ellen G. White, Sermons and Talks 1:109 (1889)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."},"events":[{"year":1844,"events":[{"type":"prophecy","text":"PROPHETIC MILESTONE: End of the 2,300-day prophecy (Daniel 8:14); Christ enters the Most Holy Place to begin the investigative judgment"},{"type":"prophecy","text":"October 22: The Great Disappointment—Millerites expected Christ's return"},{"type":"flood","text":"GREAT FLOOD OF 1844: Largest flood in recorded history of the Missouri and Upper Mississippi Rivers; widespread destruction"},{"type":"flood","text":"June: Mississippi River floods St. Louis and surrounding areas"},{"type":"disease","text":"Wyandot Indians suffer 100+ deaths from diseases following the flood"}]},{"year":1845,"events":[{"type":"fire","text":"July 14: Massive fire in New York City; saltpeter explosion kills unknown number; 1,000 buildings destroyed"},{"type":"famine","text":"Irish Potato Famine begins (1845-1852)—will kill approximately 1 million"},{"type":"storm","text":"September: Hurricane strikes Florida, causes significant damage"}]},{"year":1846,"events":[{"type":"famine","text":"Irish Famine intensifies; mass emigration begins"},{"type":"war","text":"Mexican-American War begins (1846-1848)"},{"type":"earthquake","text":"June: Major earthquake strikes Mexico"}],"quote":{"text":"In the days of Noah the overwhelming majority was opposed to the truth, and enamored with a tissue of falsehoods. The land was filled with violence. War, crime, murder, was the order of the day. Just so will it be before Christ's second coming.","source":"Ellen G. White, The S.D.A. Bible Commentary 1:1090 (1891)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1847,"events":[{"type":"famine","text":"Irish Famine reaches peak mortality; \"Black '47\" claims hundreds of thousands"},{"type":"crime","text":"Donner Party tragedy in Sierra Nevada—starvation and cannibalism"},{"type":"disease","text":"Typhus epidemic sweeps through Ireland and emigrant ships"}]},{"year":1848,"events":[{"type":"war","text":"Revolutions sweep across Europe—France, Germany, Italy, Austria-Hungary"},{"type":"crime","text":"California Gold Rush begins—lawlessness and violence in mining camps"},{"type":"earthquake","text":"Major earthquake in Turkey"},{"type":"disease","text":"Cholera epidemic begins spreading worldwide (1848-1849)"}]},{"year":1849,"events":[{"type":"disease","text":"Cholera pandemic reaches North America; kills tens of thousands"},{"type":"crime","text":"Gold Rush violence intensifies in California"},{"type":"fire","text":"Major fire destroys much of St. Louis"}]},{"year":1850,"events":[{"type":"disaster","text":"June 17: Steamer Griffith fire on Lake Erie; all 300 aboard perish"},{"type":"disease","text":"Cholera epidemic continues; reaches epidemic proportions in many U.S. cities"},{"type":"fire","text":"Great Fire of San Francisco (first of many)"}],"quote":{"text":"The terrible reports we hear of murders and robberies, of railway accidents and deeds of violence, tell the story that the end of all things is at hand.","source":"Ellen G. White, Letter 308, 1907","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1851,"events":[{"type":"fire","text":"Multiple fires devastate San Francisco"},{"type":"fire","text":"Fires destroy portions of Marysville, California"},{"type":"disease","text":"Cholera continues to claim lives across America"},{"type":"storm","text":"Major hurricane strikes Jamaica"}]},{"year":1852,"events":[{"type":"fire","text":"Great Fire in Sonora, California"},{"type":"fire","text":"Sacramento's Great Fire devastates the city"},{"type":"disaster","text":"Steamboat explosions continue to claim hundreds of lives"},{"type":"famine","text":"Irish Famine officially ends—death toll estimated at 1 million+"}]},{"year":1853,"events":[{"type":"disaster","text":"Explosion of the Jenny Lind steamboat"},{"type":"flood","text":"Major floods in California valleys"},{"type":"disaster","text":"Sinking of the Winfield Scott"},{"type":"disaster","text":"December 24: Steamer San Francisco founders; 240 of 700 passengers drown"},{"type":"disease","text":"Yellow fever epidemic in New Orleans kills thousands"}]},{"year":1854,"events":[{"type":"disaster","text":"Wreck of the Yankee Blade"},{"type":"disaster","text":"November 13: Immigrant ship New Era wrecks off New Jersey coast; 300+ dead"},{"type":"disease","text":"Cholera epidemic in London; Dr. John Snow traces source"},{"type":"war","text":"Crimean War intensifies; massive casualties"}],"quote":{"text":"God has not restrained the powers of darkness from carrying forward their deadly work of vitiating the air, one of the sources of life and nutrition, with a deadly miasma.","source":"Ellen G. White, Selected Messages 3:391 (1891)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1855,"events":[{"type":"disaster","text":"Explosion of the Pearl steamboat"},{"type":"disease","text":"Yellow fever epidemic spreads through U.S. South"},{"type":"crime","text":"\"Bleeding Kansas\" violence begins—prelude to Civil War"},{"type":"earthquake","text":"Major earthquake in Japan"}]},{"year":1856,"events":[{"type":"disaster","text":"Explosion of the Belle steamboat"},{"type":"fire","text":"Great Nevada City Fire in California"},{"type":"storm","text":"Hurricane strikes Last Island, Louisiana—over 200 dead"},{"type":"crime","text":"Continued violence in Kansas Territory"}]},{"year":1857,"events":[{"type":"earthquake","text":"January 9: Fort Tejon earthquake (M7.9)—largest in Southern California history"},{"type":"disaster","text":"September 12: SS Central America sinks in hurricane; 425+ dead; $2 million in gold lost"},{"type":"economic","text":"Financial Panic of 1857 causes widespread economic distress"},{"type":"crime","text":"Mountain Meadows Massacre—120 emigrants killed"}]},{"year":1858,"events":[{"type":"fire","text":"Disastrous fires in Downieville, California"},{"type":"disaster","text":"Shipwreck of the Lucas"},{"type":"disease","text":"Major epidemic in Central America"}],"quote":{"text":"Satan is working in the atmosphere; he is poisoning the atmosphere, and here we are dependent upon God for our lives—our present and eternal lives.","source":"Ellen G. White, Selected Messages 2:52 (1890)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1859,"events":[{"type":"disaster","text":"September 1-2: Carrington Event—massive solar storm; telegraph systems fail worldwide"},{"type":"war","text":"John Brown's raid on Harpers Ferry—prelude to Civil War"}]},{"year":1860,"events":[{"type":"disaster","text":"Lady Elgin disaster on Lake Michigan; 300+ dead"},{"type":"war","text":"Abraham Lincoln elected President—Southern secession begins"},{"type":"earthquake","text":"Major earthquake in Mendoza, Argentina; thousands killed"},{"type":"war","text":"First New Zealand Wars begin"}]},{"year":1861,"events":[{"type":"war","text":"AMERICAN CIVIL WAR BEGINS—will claim 620,000+ lives"},{"type":"flood","text":"Major flood in California (1861-1862)"},{"type":"war","text":"July: First Battle of Bull Run—590 dead"}],"quote":{"text":"War, crime, murder, was the order of the day. Just so will it be before Christ's second coming.","source":"Ellen G. White, The S.D.A. Bible Commentary 1:1090 (1891)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1862,"events":[{"type":"flood","text":"California Great Flood transforms Central Valley into inland sea"},{"type":"war","text":"Battle of Antietam—bloodiest single day in American history; 22,717 casualties"},{"type":"war","text":"Sioux Uprising in Minnesota; 500+ settlers killed"}]},{"year":1863,"events":[{"type":"war","text":"Battle of Gettysburg—51,000 casualties"},{"type":"crime","text":"New York City Draft Riots—120+ dead"},{"type":"prophecy","text":"May 21: Seventh-day Adventist Church officially organized"}]},{"year":1864,"events":[{"type":"disaster","text":"Explosion of the Washoe steamboat"},{"type":"crime","text":"Sand Creek Massacre—150+ Cheyenne and Arapaho killed"},{"type":"storm","text":"September: Hurricane devastates Calcutta, India; 70,000 dead"},{"type":"war","text":"Civil War continues with massive casualties"}]},{"year":1865,"events":[{"type":"crime","text":"April 14: President Abraham Lincoln assassinated"},{"type":"disaster","text":"April 27: Steamboat Sultana explodes; 1,800 dead—worst maritime disaster in U.S. history"},{"type":"war","text":"Civil War ends—total dead: 620,000+"}],"quote":{"text":"Famines will increase. Pestilences will sweep away thousands. Dangers are all around us from the powers without and satanic workings within, but the restraining power of God is now being exercised.","source":"Ellen G. White, Manuscript Releases 19:382 (1897)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1866,"events":[{"type":"disaster","text":"Deadly explosion in San Francisco"},{"type":"earthquake","text":"May 12: Major earthquake in Turkey (Bingöl region)"},{"type":"disease","text":"Cholera epidemic spreads through Europe and America"},{"type":"famine","text":"Famine in Algeria (1866-1868)—820,000 deaths"}]},{"year":1867,"events":[{"type":"earthquake","text":"December 18: Taiwan earthquake and tsunami"},{"type":"famine","text":"Swedish Famine begins (1867-1869)"},{"type":"storm","text":"Hurricane strikes St. Thomas; 600 dead"},{"type":"disease","text":"Yellow fever epidemic in multiple U.S. cities"}]},{"year":1868,"events":[{"type":"earthquake","text":"October 21: Hayward earthquake devastates San Francisco Bay area"},{"type":"earthquake","text":"August: Peru-Chile earthquake and tsunami; 25,000+ dead"}]},{"year":1869,"events":[{"type":"storm","text":"October 4-5: Saxby Gale strikes Bay of Fundy region"},{"type":"economic","text":"Black Friday financial panic"}],"quote":{"text":"The Lord will arise to shake terribly the earth. We shall see troubles on all sides. Thousands of ships will be hurled into the depths of the sea. Navies will go down, and human lives will be sacrificed by millions.","source":"Ellen G. White, Messages to Young People, 89, 90 (1890)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}}],"egwRefs":[["GC",23,"422.1"]]},{"id":2,"name":"The Gathering Storm","years":"1870-1899","description":"These entries cover 1870–1899. Historical events and religious-liberty disputes require their own documentary sources. An individual Sunday-closing measure should not automatically be identified with the final test described in The Great Controversy.","introQuote":{"text":"The Lord gives warnings to the inhabitants of the earth, as in the Chicago fire and the fires in Melbourne, London, and the city of New York.","source":"Ellen G. White, Manuscript 127, 1897","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."},"events":[{"year":1870,"events":[{"type":"war","text":"Franco-Prussian War begins; hundreds of thousands will die"},{"type":"famine","text":"Paris Commune siege and starvation"},{"type":"economic","text":"Long Depression begins (1870-1890)—economic suffering worldwide"},{"type":"disaster","text":"Multiple railroad disasters as train travel expands"}]},{"year":1871,"events":[{"type":"fire","text":"October 8-10: GREAT CHICAGO FIRE—300 dead, 100,000 homeless, $200 million damage"},{"type":"fire","text":"October 8: PESHTIGO FIRE—deadliest wildfire in U.S. history; 1,500-2,500 dead"},{"type":"fire","text":"Same night: Multiple fires across Wisconsin, Michigan, Illinois"},{"type":"famine","text":"Persian Famine (1871-1872)—2 million dead"},{"type":"flood","text":"Vietnam floods kill estimated 100,000 in Red River delta"}],"quote":{"text":"I have seen the most costly structures in buildings erected and supposed to be fireproof, and just as Sodom perished in the flames of God's vengeance so will these proud structures become ashes.","source":"Ellen G. White, Selected Messages 3:418 (1901)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1872,"events":[{"type":"fire","text":"Great Boston Fire—776 buildings destroyed"},{"type":"crime","text":"Credit Mobilier scandal exposed—government corruption"},{"type":"disaster","text":"Numerous mining disasters as industry expands"}]},{"year":1873,"events":[{"type":"economic","text":"Financial Panic of 1873—triggers global economic depression"},{"type":"disease","text":"Yellow fever epidemic in multiple cities"}]},{"year":1874,"events":[{"type":"disaster","text":"Grasshopper plague devastates Great Plains; millions of acres destroyed"},{"type":"storm","text":"Typhoon in Hong Kong; thousands dead"},{"type":"flood","text":"Mill River Dam failure—Massachusetts; 139 dead"}],"quote":{"text":"The perversity and cruelty of men will reach such a height that God will reveal Himself in His majesty. Very soon the wickedness of the world will have reached its limit.","source":"Ellen G. White, The Upward Look, 334 (1903)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1875,"events":[{"type":"disaster","text":"Grasshopper plague continues"},{"type":"storm","text":"Major hurricane season"},{"type":"economic","text":"Continued economic depression"},{"type":"disaster","text":"Coal mining disasters claim hundreds"}]},{"year":1876,"events":[{"type":"war","text":"June 25: Battle of Little Bighorn—Custer and 268 soldiers killed"},{"type":"fire","text":"Brooklyn Theater fire—278 dead"}]},{"year":1877,"events":[{"type":"crime","text":"Great Railroad Strike—nationwide violence; 100+ killed"},{"type":"war","text":"Nez Perce War"},{"type":"disaster","text":"Major drought affects multiple regions"},{"type":"disease","text":"Yellow fever epidemic in South"}]},{"year":1878,"events":[{"type":"disease","text":"Yellow fever epidemic in Memphis—5,000+ dead"},{"type":"disaster","text":"Princess Alice steamship disaster—650 dead (England)"}],"quote":{"text":"The earth's crust will be rent by the outbursts of the elements concealed in the bowels of the earth.","source":"Ellen G. White, Manuscript Releases 3:208 (1891)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1879,"events":[{"type":"disaster","text":"Tay Bridge disaster—75+ dead as train plunges into water (Scotland)"},{"type":"flood","text":"Major floods in Hungary"},{"type":"economic","text":"Continued economic hardship from depression"},{"type":"war","text":"Indian Wars continue in American West"}]},{"year":1880,"events":[{"type":"disaster","text":"Seabright excursion train wreck—23 dead"},{"type":"crime","text":"Mussel Sloug cane season"}]},{"year":1892,"events":[{"type":"prophecy","text":"CRITICAL PROPHETIC MILESTONE: Sunday law legislation passes Congress (Columbian Exposition)"},{"type":"prophecy","text":"Protestant churches unite with Catholics to petition for Sunday enforcement"},{"type":"prophecy","text":"A.T. Jones testifies before Congress against Sunday laws"},{"type":"crime","text":"Homestead Steel Strike—violence between workers and Pinkertons"},{"type":"disease","text":"Cholera epidemic in Hamburg, Germany—8,600+ dead"}],"quote":{"text":"The time is now come when one moment we may be on solid earth, the next the earth may be heaving beneath our feet. Earthquakes will take place when least expected.","source":"Ellen G. White, Testimonies to Ministers, 421 (1896)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1893,"events":[{"type":"prophecy","text":"Sunday law enforcement continues"},{"type":"economic","text":"Financial Panic of 1893—major depression begins"},{"type":"storm","text":"Hurricane destroys Sea Islands, South Carolina—1,000-2,000 dead"},{"type":"storm","text":"Cheniere Caminada hurricane—2,000 dead (Louisiana)"}]},{"year":1894,"events":[{"type":"fire","text":"Great Hinckley Fire—418 dead (Minnesota)"},{"type":"crime","text":"Pullman Strike—nationwide railroad stoppage; Federal troops deployed"}]},{"year":1895,"events":[{"type":"war","text":"Cuban War of Independence begins"},{"type":"fire","text":"Great fire in Cripple Creek, Colorado"},{"type":"storm","text":"Major hurricane season"},{"type":"disaster","text":"Heat wave kills hundreds"}]},{"year":1896,"events":[{"type":"earthquake","text":"June 15: SANRIKU EARTHQUAKE AND TSUNAMI (Japan)—27,000 dead"},{"type":"storm","text":"St. Louis tornado—255 dead"}],"quote":{"text":"There will be mighty earthquakes and great destruction of human life.","source":"Ellen G. White, The S.D.A. Bible Commentary 7:946 (1907)","reviewSta ina)—100,000+ dead"}]},{"year":1912,"events":[{"type":"disaster","text":"April 15: RMS TITANIC sinks—1,517 dead"},{"type":"war","text":"Balkan Wars begin—over 300,000 will die"}]},{"year":1913,"events":[{"type":"flood","text":"March 21-26: GREAT FLOOD OF 1913—428 dead (Ohio/Indiana)"},{"type":"disaster","text":"October 22: Dawson, New Mexico mine explosion—263 dead"},{"type":"storm","text":"Omaha tornado—103 dead"}],"quote":{"text":"Fires will break out unexpectedly and no human effort will be able to quench them. The palaces of earth will be swept away in the fury of the flames.","source":"Ellen G. White, Messages to Young People, 89, 90 (1890)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1914,"events":[{"type":"war","text":"WORLD WAR I BEGINS—will kill 17 million"},{"type":"crime","text":"April 20: Ludlow Massacre—21 dead including 11 children"},{"type":"disaster","text":"May 29: Empress of Ireland sinks—1,012 dead"}]},{"year":1915,"events":[{"type":"war","text":"May 7: RMS Lusitania torpedoed—1,198 dead"},{"type":"storm","text":"August: Galveston Hurricane—275-400 dead"},{"type":"crime","text":"Armenian Genocide begins—1.5 million will be killed"},{"type":"disaster","text":"July 24: Eastland disaster (Chicago)—844 dead"}]},{"year":1916,"events":[{"type":"war","text":"July 1: Battle of the Somme begins—1 million casualties"},{"type":"disease","text":"Polio epidemic—27,000 cases in U.S."}]},{"year":1917,"events":[{"type":"disaster","text":"December 6: HALIFAX EXPLOSION—2,000 dead; largest man-made explosion before nuclear age"},{"type":"war","text":"April 6: United States enters World War I"},{"type":"war","text":"Russian Revolution—millions will die in subsequent chaos"}],"quote":{"text":"Human lives will be sacrificed by millions.","source":"Ellen G. White, Messages to Young People, 89, 90 (1890)","reviewStatus":"Attribution retained from the original chronology;  to compassion and practical service. The final plagues described in The Great Controversy follow the close of Christ’s intercession; ordinary historical disasters should not all be labeled as those plagues.","introQuote":{"text":"In the last scenes of this earth's history war will rage. There will be pestilence, plague and famine. The waters of the deep will overflow their boundaries. Property and life will be destroyed by fire and flood.","source":"Ellen G. White, Maranatha, 174 (1897)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."},"events":[{"year":1930,"events":[{"type":"disaster","text":"Drought conditions intensify across Great Plains"},{"type":"fire","text":"Ohio Penitentiary fire—322 dead"},{"type":"disaster","text":"R101 airship disaster—48 dead"},{"type":"economic","text":"Bank failures accelerate—744 banks close"}]},{"year":1931,"events":[{"type":"flood","text":"July-November: CHINA FLOODS—1-4 MILLION DEAD; deadliest natural disaster of 20th century"},{"type":"earthquake","text":"Napier, New Zealand earthquake—256 dead"},{"type":"storm","text":"Dust storms begin in Great Plains"}]},{"year":1932,"events":[{"type":"storm","text":"March 21: Tri-state tornado outbreak—330 dead"},{"type":"crime","text":"Bonus Army marchers attacked in Washington"},{"type":"disaster","text":"Great Plains drought intensifies"},{"type":"economic","text":"25% unemployment in U.S."}]},{"year":1933,"events":[{"type":"earthquake","text":"March 10: Long Beach earthquake—115 dead"},{"type":"war","text":"Adolf Hitler becomes Chancellor of Germany"},{"type":"crime","text":"Reichstag Fire"},{"type":"economic","text":"Bank holiday declared in U.S."}]},{"year":1934,"events":[{"type":"disaster","text":"SS Morro Castle fire—137 dead"}],"quote":{"text":"The end is near and every city is to be turned upside down every way. There will be confusion in every city. Everything that can be shaken is to be shaken  conflagrations, in fierce tornadoes and terrific hailstorms, in tempests, floods, cyclones, tidal waves, and earthquakes, in every place and in a thousand forms, Satan is exercising his power... These visitations are to become more and more frequent and disastrous.","source":"Ellen G. White · The Great Controversy, 589.3 · excerpt with omission","reviewStatus":"Text checked in context; placement does not identify a particular predicted event.","sourceUrl":"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-36.htm"},"events":[{"year":1960,"events":[{"type":"earthquake","text":"May 22: GREAT CHILEAN EARTHQUAKE—M9.5; LARGEST EARTHQUAKE EVER RECORDED; 1,655 dead"},{"type":"earthquake","text":"February 29: Agadir earthquake (Morocco)—12,000-15,000 dead"}]},{"year":1961,"events":[{"type":"storm","text":"Hurricane Carla—46 dead"},{"type":"war","text":"Berlin Wall constructed"},{"type":"war","text":"Bay of Pigs invasion"},{"type":"crime","text":"Freedom Riders attacked"}]},{"year":1962,"events":[{"type":"disaster","text":"September: Yamanashi landslide (Japan)—262 dead"},{"type":"war","text":"Cuban Missile Crisis—world on brink of nuclear war"},{"type":"storm","text":"October: Columbus Day Storm—46 dead"},{"type":"fire","text":"Centralia mine fire begins (still burning)"}]},{"year":1963,"events":[{"type":"crime","text":"November 22: PRESIDENT JOHN F. KENNEDY ASSASSINATED"},{"type":"flood","text":"October 9: Vajont Dam disaster (Italy)—2,000 dead"},{"type":"crime","text":"Birmingham church bombing—4 children killed"}]},{"year":1964,"events":[{"type":"earthquake","text":"March 27: GREAT ALASKA EARTHQUAKE—M9.2; 131 dead; second largest quake ever recorded"},{"type":"war","text":"Gulf of Tonkin incident—Vietnam War escalates"}],"quote":{"text":"Disasters by rail will become more and more frequent. Confusion, collision, and death without a moment's warning will occur on the great lines of travel.","source":"Ellen G. White, Messages to Young People, 89, 90 (1890)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1965,"events":[{"type":"storm","text":"Palm Sunday Tornado Outbreak—271 dead"},{"type":"storm","text":"Hurricane Betsy—81 dead"},{"type":"crime","text":"Watts Riots—34 dead"},{"type":"crime","text":"Indonesia mass killings begin—500,000-1 million dead"}]},{"year":1966,"events":[{"type":"disaster","text":"October 21: Aberfan disaster (Wales)—144 dead; coal slag engulfs school"},{"type":"crime","text":"August: Texas Tower mass shooting—17 dead"}]},{"year":1967,"events":[{"type":"crime","text":"July: Newark race riot—26 dead"},{"type":"crime","text":"July: Detroit race riot—43 dead"},{"type":"earthquake","text":"Caracas earthquake—266 dead"},{"type":"war","text":"Six-Day War (Middle East)"}]},{"year":1968,"events":[{"type":"crime","text":"April 4: MARTIN LUTHER KING JR. ASSASSINATED"},{"type":"crime","text":"June 5: ROBERT F. KENNEDY ASSASSINATED"},{"type":"war","text":"My Lai Massacre (Vietnam)—504 killed"},{"type":"disease","text":"Hong Kong flu pandemic begins—1 million will die"}]},{"year":1969,"events":[{"type":"storm","text":"Hurricane Camille—259 dead (Category 5)"},{"type":"crime","text":"Manson Family murders"}],"quote":{"text":"The reports of fraudulent transactions, murders, and crimes of every kind are coming to us daily. Iniquity is becoming so common a thing that it no longer shocks the senses as it once did.","source":"Ellen G. White, Letter 258, 1907","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1970,"events":[{"type":"storm","text":"November 12: BHOLA CYCLONE—300,000-500,000 dead; deadliest tropical cyclone in history"},{"type":"earthquake","text":"May 31: Ancash earthquake (Peru)—70,000 dead"},{"type":"crime","text":"Kent State shootings—4 students killed"}]},{"year":1971,"events":[{"type":"earthquake","text":"February 9: San Fernando earthquake (California)—65 dead"},{"type":"flood","text":"Vietnam floods—100,000 dead"},{"type":"war","text":"Bangladesh Liberation War—3 million dead"}]},{"year":1972,"events":[{"type":"flood","text":"February 26: Buffalo Creek flood—125 dead"},{"type":"flood","text":"June 9: Rapid City flood—238 dead"},{"type":"storm","text":"Hurricane Agnes—122 dead"},{"type":"crime","text":"Munich Olympics massacre—11 Israeli athletes killed"}]},{"year":1973,"events":[{"type":"storm","text":"May 26-27: Tornado super outbreak—10+ tornadoes"},{"type":"war","text":"Yom Kippur War—over 20,000 dead"},{"type":"economic","text":"Oil embargo begins"},{"type":"crime","text":"Chilean coup—thousands killed"}]},{"year":1974,"events":[{"type":"storm","text":"April 3-4: 1974 SUPER OUTBREAK—148 tornadoes; 335 dead"},{"type":"storm","text":"December 25: Cyclone Tracy—71 dead (Australia)"},{"type":"famine","text":"Ethiopia drought/famine begins—400,000+ will die"}],"quote":{"text":"The time is near when large cities will be swept away, and all should be warned of these coming judgments.","source":"Ellen G. White, Evangelism, 29 (1910)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1975,"events":[{"type":"flood","text":"August: Typhoon Nina causes Banqiao Dam failure (China)—85,600-240,000 dead"},{"type":"war","text":"Fall of Saigon—Vietnam War ends; 3 million total dead"},{"type":"crime","text":"Cambodian genocide begins—2 million will die"}]},{"year":1976,"events":[{"type":"earthquake","text":"July 28 (Beijing local time): Tangshan earthquake, China—severe destruction and loss of life.","sources":[{"label":"USGS: The 1976 Tangshan earthquake","url":"https://www.usgs.gov/publications/1976-tangshan-earthquake"}]},{"type":"earthquake","text":"February 4: Guatemala earthquake—23,000 dead"},{"type":"flood","text":"Big Thompson Canyon flood—143 dead"}]},{"year":1977,"events":[{"type":"crime","text":"July 13-14: New York City blackout—looting, arson; 3,776 arrested"},{"type":"earthquake","text":"March 4: Romania earthquake—1,578 dead"},{"type":"disaster","text":"Tenerife airport disaster—583 dead; deadliest aviation accident"},{"type":"fire","text":"Beverly Hills Supper Club fire—165 dead"}]},{"year":1978,"events":[{"type":"earthquake","text":"September 16: Tabas earthquake (Iran)—25,000 dead"},{"type":"crime","text":"November 18: Jonestown mass suicide—918 dead"}]},{"year":1979,"events":[{"type":"disaster","text":"March 28: Three Mile Island nuclear accident"},{"type":"storm","text":"Hurricane David—2,068 dead (Caribbean)"}],"quote":{"text":"God is withdrawing His Spirit from the wicked cities, which have become as the cities of the antediluvian world and as Sodom and Gomorrah.","source":"Ellen G. White, This Day With God, 152 (1902)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1980,"events":[{"type":"volcano","text":"May 18: MOUNT ST. HELENS ERUPTION—57 dead"},{"type":"earthquake","text":"October 10: El Asnam earthquake (Algeria)—2,633 dead"},{"type":"fire","text":"MGM Grand fire—85 dead"}]},{"year":1981,"events":[{"type":"disaster","text":"July 17: Hyatt Regency walkway collapse—114 dead"},{"type":"crime","text":"March 30: President Reagan assassination attempt"},{"type":"disease","text":"AIDS pandemic identified"}]},{"year":1982,"events":[{"type":"volcano","text":"March-April: El Chichón eruption—1,900 dead (Mexico)"},{"type":"war","text":"Lebanon War begins—20,000 will die"},{"type":"crime","text":"Sabra and Shatila massacre—800-3,500 dead"},{"type":"crime","text":"Tylenol murders—7 dead"}]},{"year":1983,"events":[{"type":"crime","text":"October 23: Beirut barracks bombing—307 dead"},{"type":"earthquake","text":"May 2: Coalinga earthquake (California)"},{"type":"disaster","text":"Korean Air Lines Flight 007 shot down—269 dead"},{"type":"storm","text":"Hurricane Alicia—21 dead"}]},{"year":1984,"events":[{"type":"disaster","text":"December 3: BHOPAL DISASTER—3,787-16,000 dead; worst industrial disaster"},{"type":"crime","text":"July 18: San Ysidro McDonald's massacre—22 dead"},{"type":"famine","text":"Ethiopian Famine—1 million dead"}],"quote":{"text":"Costly mansions, marvels of architectural skill, will be destroyed without a moment's notice when the Lord sees that the owners have passed the boundaries of forgiveness.","source":"Ellen G. White, This Day With God, 152 (1902)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":1985,"events":[{"type":"earthquake","text":"September 19: MEXICO CITY EARTHQUAKE—10,000+ dead"},{"type":"volcano","text":"November 13: Nevado del Ruiz eruption—23,000 dead (Colombia)"}]},{"year":1986,"events":[{"type":"disaster","text":"April 26: CHERNOBYL NUCLEAR DISASTER—31 immediate dead; thousands eventual"},{"type":"disaster","text":"January 28: Space Shuttle Challenger disaster—7 dead"},{"type":"disaster","text":"August 21: Lake Nyos gas disaster—1,700 dead (Cameroon)"}]},{"year":1987,"events":[{"type":"economic","text":"October 19: \"Black Monday\" stock market crash"},{"type":"disaster","text":"March 6: Herald of Free Enterprise sinking—193 dead"},{"type":"storm","text":"Edmond, Oklahoma tornado—35 dead"},{"type":"disaster","text":"Northwest Airlines Flight 255 crash—156 dead"}]},{"year":1988,"events":[{"type":"earthquake","text":"December 7: SPITAK EARTHQUAKE (Armenia)—25,000-50,000 dead"},{"type":"crime","text":"December 21: Pan Am Flight 103 bombing—270 dead"},{"type":"storm","text":"Hurricane Gilbert—318 dead"}]},{"year":1989,"events":[{"type":"earthquake","text":"October 17: Loma Prieta earthquake—63 dead (San Francisco Bay)"},{"type":"crime","text":"June 4: Tiananmen Square massacre—hundreds to thousands dead"},{"type":"storm","text":"Hurricane Hugo—82 dead"}],"quote":{"text":"As we near the close of this earth's history, we shall have the scenes of the San Francisco calamity repeated in other places. These things make me feel very solemn because I know that the judgment day is right upon us.","source":"Ellen G. White, Letter 154, 1906","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}}],"egwRefs":[["GC",36,"589.3–590.1"]]},{"id":6,"name":"Recent World Events","years":"1990-2026","description":"These entries cover 1990 onward. Recent-event reports and casualty estimates require dated sources and may be revised. Our study should encourage watchfulness, trust in Christ, and care for suffering people, without setting a date for His return.","introQuote":{"text":"The present is a time of overwhelming interest to all living. Rulers and statesmen, men who occupy positions of trust and authority, thinking men and women of all classes, have their attention fixed upon the events taking place about us. They observe the intensity that is taking possession of every earthly element and they recognize that something great and decisive is about to take place—that the world is on the verge of a stupendous crisis.","source":"Ellen G. White, Prophets and Kings, 537 (c. 1914)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."},"events":[{"year":1990,"events":[{"type":"earthquake","text":"June 21: Manjil-Rudbar earthquake (Iran)—50,000 dead"},{"type":"war","text":"August 2: Iraq invades Kuwait"}]},{"year":1991,"events":[{"type":"storm","text":"April 29: Bangladesh cyclone—138,000 dead"},{"type":"volcano","text":"June 15: Mount Pinatubo eruption—847 dead"},{"type":"war","text":"Gulf War—25,000-50,000 Iraqi dead"}]},{"year":1992,"events":[{"type":"storm","text":"August 24: Hurricane Andrew—65 dead; $27 billion damage"},{"type":"crime","text":"April 29-May 4: Los Angeles riots— "text":"February 24: RUSSIA INVADES UKRAINE—hundreds of thousands will die"},{"type":"earthquake","text":"June 22: Afghanistan earthquake—1,163 dead"},{"type":"storm","text":"September: Hurricane Ian—161 dead"}]},{"year":2023,"events":[{"type":"earthquake","text":"February 6: TURKEY-SYRIA EARTHQUAKES—59,259 dead; M7.8"},{"type":"earthquake","text":"September 8: Morocco earthquake—2,960 dead"},{"type":"flood","text":"September 10: Libya floods—11,300+ dead"},{"type":"war","text":"October 7: Hamas-Israel conflict begins—thousands dead"}]},{"year":2024,"events":[{"type":"earthquake","text":"January 1: Noto Peninsula earthquake (Japan)—470+ dead"},{"type":"storm","text":"September: Hurricane Helene—230+ dead"},{"type":"war","text":"Continued conflicts in Ukraine, Middle East—thousands dead"}]},{"year":2025,"events":[{"type":"fire","text":"January 7: Palisades and Eaton fires begin in Los Angeles County. CAL FIRE lists 12 civilian fatalities for Palisades and 19 for Eaton; records checked September 14, 2026.","sources":[{"label":"CAL FIRE: Palisades Fire","url":"https://www.fire.ca.gov/incidents/2025/1/7/palisades-fire"},{"label":"CAL FIRE: Eaton Fire","url":"https://www.fire.ca.gov/incidents/2025/1/7/eaton-fire"}]},{"type":"economic","text":"First half 2025: Global natural disasters cause $162 billion in economic losses"},{"type":"flood","text":"July 4: Texas Hill Country flash floods—135 dead"}],"quote":{"text":"Just before I awoke, a very impressive scene was presented before me. I seemed to awake from sleep but was not in my home. From the windows I could behold a terrible conflagration. Great balls of fire were falling upon houses, and from these balls fiery arrows were flying in every direction.","source":"Ellen G. White, Evangelism, 29 (1906)","reviewStatus":"Attribution retained from the original chronology; source is outside this review’s two books and awaits verification."}},{"year":2026,"events":[]}],"egwRefs":[["GC",26,"456.1–457.1"],["SC",13,"119–126"]]}];
  const calendarSections = [{"title":"01 · Begin with Daniel 8 and 9","html":"<h3>The prophecy and its explanation</h3>\n  <div class=\"ppx-quote\"><p>“Unto two thousand and three hundred days; then shall the sanctuary be cleansed.”</p><cite>Daniel 8:14 · KJV</cite></div>\n  <p>Daniel 8 gives the prophetic period. In Daniel 9, Gabriel returns to explain the vision and introduces the seventy weeks appointed to Daniel’s people and Jerusalem. The Great Controversy explains these seventy weeks as “cut off” from the 2,300 days: they form the first part of that longer period, with both periods beginning together.</p>\n  <p>In this symbolic prophecy, a day represents a year. Numbers 14:34 and Ezekiel 4:6 provide the day-for-a-year principle used in this explanation: <strong>2,300 prophetic days represent 2,300 years.</strong></p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Daniel+8&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 8:14–27</a>; <a href=\"https://www.biblegateway.com/passage/?search=Daniel+9&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 9:21–27</a>; <a href=\"https://www.biblegateway.com/passage/?search=Numbers+14&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Numbers 14:34</a>; <a href=\"https://www.biblegateway.com/passage/?search=Ezekiel+4&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Ezekiel 4:6</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 324.3; 325.1–326.2</a>.</p>"},{"title":"02 · Why the autumn of 457 B.C.?","html":"<h3>The commandment to restore Jerusalem</h3>\n  <p>Daniel 9:25 begins the period with the commandment to restore and build Jerusalem. Ezra 6:14 names <strong>Cyrus, Darius, and Artaxerxes</strong>. The Great Controversy explains that their successive actions brought the decree to completion, with its fullest form issued by Artaxerxes in 457 B.C.</p>\n  <p>Ezra 7:12–26 records this decree, including provision for worship and authority to appoint magistrates and judges. <strong>The decree took effect in the autumn of 457 B.C.</strong> That is the starting point used in the prophetic reckoning.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Daniel+9&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 9:25</a>; <a href=\"https://www.biblegateway.com/passage/?search=Ezra+6&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Ezra 6:14</a>; <a href=\"https://www.biblegateway.com/passage/?search=Ezra+7&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Ezra 7:12–26</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-18.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 326.3–327.1</a>.</p>\n<p class=\"ppx-calendar-source\">For the autumn starting season, see <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-22.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 398.4</a>.</p>"},{"title":"03 · The seventy weeks point to Christ","html":"<h3>His baptism, sacrifice, and the gospel invitation</h3>\n  <p>Seventy weeks represent 490 years; the first sixty-nine weeks represent 483 years. The fulfillment centers on Jesus Christ. The chronology below follows the explanation in The Great Controversy.</p>\n  <table><thead><tr><th scope=\"col\">Prophetic milestone</th><th scope=\"col\">Fulfillment</th></tr></thead><tbody>\n    <tr><td data-label=\"Prophetic milestone\">Autumn A.D. 27 · End of 69 weeks</td><td data-label=\"Fulfillment\">Jesus is baptized and anointed by the Holy Spirit, 483 years after autumn 457 B.C.</td></tr>\n    <tr><td data-label=\"Prophetic milestone\">Spring A.D. 31 · Middle of the final week</td><td data-label=\"Fulfillment\">Jesus is crucified, three and a half years after His baptism. His sacrifice fulfills the offerings that pointed forward to Him.</td></tr>\n    <tr><td data-label=\"Prophetic milestone\">A.D. 34 · End of 70 weeks</td><td data-label=\"Fulfillment\">The 490 years end. Stephen’s martyrdom and the ensuing persecution mark the widening proclamation of the gospel beyond the Jewish nation.</td></tr>\n  </tbody></table>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Daniel+9&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 9:24–27</a>; Luke 3:21–22; Acts 10:38; Mark 1:14–15; Matthew 27:50–51; Acts 7:54–8:5.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 410.1</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-19.htm\" target=\"_blank\" rel=\"noopener noreferrer\">345.1–347.2</a>.</p>"},{"title":"04 · From the seventy weeks to 1844","html":"<h3>One connected prophetic period</h3>\n  <p>The 490 years are part of the 2,300 years. When the seventy weeks end in A.D. 34, <strong>1,810 years remain</strong>. Adding those remaining years reaches A.D. 1844.</p>\n  <table><thead><tr><th scope=\"col\">Step</th><th scope=\"col\">Reckoning</th></tr></thead><tbody>\n    <tr><td data-label=\"Step\">The full period</td><td data-label=\"Reckoning\">2,300 years</td></tr>\n    <tr><td data-label=\"Step\">The seventy weeks</td><td data-label=\"Reckoning\">70 × 7 = 490 years</td></tr>\n    <tr><td data-label=\"Step\">The remainder</td><td data-label=\"Reckoning\">2,300 − 490 = 1,810 years</td></tr>\n    <tr><td data-label=\"Step\">The ending year</td><td data-label=\"Reckoning\">A.D. 34 + 1,810 years = A.D. 1844</td></tr>\n  </tbody></table>\n  <p>The starting season matters: reckoning from <strong>autumn 457 B.C.</strong> brings the period to <strong>autumn 1844</strong>. The calendar passes directly from 1 B.C. to A.D. 1, with no year zero.</p>\n  <p class=\"ppx-calendar-source\">EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 410.1–410.2</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-22.htm\" target=\"_blank\" rel=\"noopener noreferrer\">398.4</a>.</p>"},{"title":"05 · Why October 22?","html":"<h3>The tenth day of the seventh month</h3>\n  <p>The sanctuary service supplies the connection between the prophetic period and the appointed day. Leviticus places the annual Day of Atonement on <strong>the tenth day of the seventh month</strong>. The Great Controversy identifies that day in 1844 as <strong>October 22</strong>.</p>\n  <p>Chapter 22 explains how the Passover sacrifice and the wave sheaf pointed to Christ’s death and resurrection. The Day of Atonement likewise directs attention to the appointed time and work of cleansing the sanctuary.</p>\n  <table><thead><tr><th scope=\"col\">Biblical observance</th><th scope=\"col\">Appointed time</th><th scope=\"col\">KJV reference</th></tr></thead><tbody>\n    <tr><td data-label=\"Biblical observance\">Passover</td><td data-label=\"Appointed time\">Fourteenth day of the first month, at even.</td><td data-label=\"KJV reference\">Leviticus 23:5</td></tr>\n    <tr><td data-label=\"Biblical observance\">Feast of weeks / Pentecost</td><td data-label=\"Appointed time\">Fifty days counted from the wave-sheaf offering.</td><td data-label=\"KJV reference\">Leviticus 23:15–16</td></tr>\n    <tr><td data-label=\"Biblical observance\">Day of Atonement</td><td data-label=\"Appointed time\">Tenth day of the seventh month.</td><td data-label=\"KJV reference\">Leviticus 16:29–34; 23:27</td></tr>\n  </tbody></table>\n  <p><strong>The Bible gives the sanctuary observance and its day; The Great Controversy, 399.4, supplies the stated correspondence to October 22, 1844.</strong> These chapters do not provide a month-by-month reconstruction of the Karaite calendar.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Leviticus+23&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Leviticus 23:5, 15–16, 27, 32</a>; <a href=\"https://www.biblegateway.com/passage/?search=Leviticus+16&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Leviticus 16:29–34</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-22.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 399.1–399.4</a>.</p>"},{"title":"06 · What sanctuary was to be cleansed?","html":"<h3>Christ’s ministry in heaven</h3>\n  <p>Hebrews describes both the earthly sanctuary and the heavenly sanctuary where Jesus ministers for us. The earthly tabernacle was patterned after the heavenly. Its priests served daily, and the high priest performed the annual cleansing service in the most holy place.</p>\n  <p><strong>At the close of the 2,300 years in 1844, Christ entered the most holy place of the heavenly sanctuary to begin the closing work of atonement.</strong> This was a change in His heavenly ministration. His priestly ministry had already begun after His ascension.</p>\n  <p>The cleansing concerns the removal of sin and the examination of the heavenly records. It includes the <strong>investigative judgment</strong>, which precedes Christ’s return. His once-for-all sacrifice is the basis of this ministry; He is not sacrificed again.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Hebrews+8&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Hebrews 8:1–5</a>; <a href=\"https://www.biblegateway.com/passage/?search=Hebrews+9&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Hebrews 9:6–7, 22–28</a>; <a href=\"https://www.biblegateway.com/passage/?search=Daniel+7&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 7:9–10, 13–14</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-23.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 417.1–422.1</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-19.htm\" target=\"_blank\" rel=\"noopener noreferrer\">352.2</a>.</p>\n<p>Christ is our Advocate in this judgment. He presents His merits on behalf of those who repent and trust in Him. The judgment begins with the dead and proceeds to the living; the time when the living are considered has not been revealed to us.</p><p class=\"ppx-calendar-source\">EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-28.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 482.4–484.2; 490.1</a>.</p>"},{"title":"07 · Understanding the disappointment","html":"<h3>The time and the event</h3>\n  <p>The believers expected Jesus to return to earth in 1844. Their disappointment arose from identifying the cleansing of the sanctuary with the purification of the earth by fire. Further study of the sanctuary made the event clear.</p>\n  <div class=\"ppx-quote\"><p>“The mistake had not been in the reckoning of the prophetic periods, but in the event”</p><cite>Ellen G. White · The Great Controversy, 424.1 · excerpt</cite></div>\n  <p>Daniel 7:13 describes the Son of man coming to the Ancient of days. Chapter 24 connects this with Christ’s entrance into the most holy place, His coming to His temple in Malachi 3, and the Bridegroom’s coming to the marriage in Matthew 25.</p>\n  <p><strong>Christ’s work in the most holy place began in 1844. His visible second coming remains future.</strong> Chapter 19 compares this disappointment with the disciples’ misunderstanding before the cross: the prophetic word was fulfilled while the expected event was misunderstood.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Daniel+7&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Daniel 7:13–14</a>; Malachi 3:1–3; Matthew 25:1–13.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 423.1–426.1</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-19.htm\" target=\"_blank\" rel=\"noopener noreferrer\">351.1–352.3</a>.</p>"},{"title":"08 · The time of the end and the angels’ messages","html":"<h3>The wider prophetic setting</h3>\n  <p>The 1,260-year period provides the setting for the renewed study of prophecy. The Great Controversy identifies it as <strong>A.D. 538–1798</strong>, with the pope’s captivity by the French army marking its close. Since 1798, Daniel’s prophecies concerning the last days have been opened to increasing understanding.</p>\n  <p>This period establishes the setting; the 2,300 years and the sanctuary service supply the explanation of 1844. The first angel of Revelation 14 announces the judgment within the everlasting gospel. The second angel warns of Babylon’s fall. Chapter 21 explains that this warning began to be proclaimed in 1844, with its full fulfillment still ahead.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: Daniel 7:25; 12:4; Revelation 13:5, 10; <a href=\"https://www.biblegateway.com/passage/?search=Revelation+14&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Revelation 14:6–8</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-20.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 355.1–356.2</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-21.htm\" target=\"_blank\" rel=\"noopener noreferrer\">389.2–390.2</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm\" target=\"_blank\" rel=\"noopener noreferrer\">439.2</a>.</p>"},{"title":"09 · The sanctuary reveals our present duty","html":"<h3>Faith in Jesus, obedience, and preparation</h3>\n  <p>Revelation 11:19 shows the ark of God’s testament in His heavenly temple. Chapter 25 connects this with the ministry in the most holy place and the enduring authority of God’s law, including the seventh-day Sabbath.</p>\n  <p>The three angels’ messages call us to worship our Creator, keep His commandments, and hold the faith of Jesus. While Christ ministers for us, we are called to repentance, the putting away of sin, and a life transformed by His grace. Chapter 26 presents Sabbath reform as part of this work.</p>\n  <p><strong>This study gives no new date for Christ’s return.</strong> The Great Controversy maintains the autumn 1844 conclusion of the 2,300 days and warns against setting further dates for the second advent. Our calling is to follow Christ by faith and share His message.</p>\n  <p class=\"ppx-calendar-source\">Read the KJV: <a href=\"https://www.biblegateway.com/passage/?search=Revelation+11&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Revelation 11:19</a>; <a href=\"https://www.biblegateway.com/passage/?search=Revelation+14&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Revelation 14:6–12</a>; Exodus 20:8–11; <a href=\"https://www.biblegateway.com/passage/?search=Isaiah+58&version=KJV\" target=\"_blank\" rel=\"noopener noreferrer\">Isaiah 58:12–14</a>.<br>EGW: <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-24.htm\" target=\"_blank\" rel=\"noopener noreferrer\">The Great Controversy, 425.1</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-25.htm\" target=\"_blank\" rel=\"noopener noreferrer\">433.1–435.2</a>; <a href=\"https://www.ellenwhite.info/books/ellen-g-white-book-great-controversy-gc-26.htm\" target=\"_blank\" rel=\"noopener noreferrer\">451.1–452.2; 456.1–457.1</a>.</p>\n<p>We do not earn acceptance with God by our works. We receive Christ by faith, and His righteousness stands in place of our failure. As we abide in Him, His Spirit renews the heart and brings forth obedience. Preparation for His return is a daily life of dependence on our Saviour.</p><p class=\"ppx-calendar-source\">EGW: <a href=\"https://www.ellenwhite.info/books/bk-sc-07.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Steps to Christ, 59–63</a>; <a href=\"https://www.ellenwhite.info/books/bk-sc-08.htm\" target=\"_blank\" rel=\"noopener noreferrer\">68–72</a>.</p>"}];

alth Reform</button><button type="button" data-page-link="study">${icon('notebook-pen')}Study Together</button></div><section class="ppx-section"><div class="ppx-section-head"><div><div class="ppx-kicker">Latest releases</div><h2>Make room for a deeper study.</h2></div><button type="button" class="ppx-text-link" data-page-link="watch">Explore all 30 studies ${icon('arrow-up-right')}</button></div><div class="ppx-episode-grid">${episodes.slice(0,3).map(episodeCard).join('')}</div></section><section class="ppx-start-band"><div><div class="ppx-kicker">New here?</div><h2>A good place<br>to begin.</h2><p>You don’t need to have every answer. Bring your Bible, your questions, and a willingness to learn.</p></div><div class="ppx-start-steps"><button type="button" class="ppx-start-step" data-page-link="about"><span>01</span><span><strong>Get to know the ministry</strong><small>Our purpose and what brings us together</small></span>${icon('arrow-up-right')}</button><button type="button" class="ppx-start-step" data-episode="lIvTWvsjqqk"><span>02</span><span><strong>Watch your first study</strong><small>Start with the sanctuary</small></span>${icon('arrow-up-right')}</button><button type="button" class="ppx-start-step" data-page-link="study"><span>03</span><span><strong>Open a Bible lesson</strong><small>Read, reflect, and check your understanding</small></span>${icon('arrow-up-right')}</button></div></section><section class="ppx-section ppx-ministry"><div class="ppx-scripture-panel">${icon('book-open')}<blockquote>“Sanctify them through thy truth: thy word is truth.”</blockquote><cite>John 17:17 · KJV</cite></div><div class="ppx-ministry-copy"><div class="ppx-kicker">Our Mission</div><h2>Rooted in the Word.<br>Growing together.</h2><p>${safe(originalCopy.home.mission)}</p><button type="button" class="ppx-text-link" data-page-link="about">More about us ${icon('arrow-up-right')}</button></div></section>${appBand()}<section class="ppx-section"><div class="ppx-section-head"><div><div class="ppx-kicker">Study the message</div><h2>Explore the evidence.</h2></div></div><div class="ppx-topic-grid"><button type="button" class="ppx-topic-tile" data-page-link="evidence">${icon('history')}<span><strong>Chronological Evidence</strong><small>Explore the ministry’s record of world events from 1844 to 2026.</small></span>${icon('arrow-up-right')}</button><button type="button" class="ppx-topic-tile" data-page-link="calendar">${icon('calendar-days')}<span><strong>October 22, 1844</strong><small>Study the prophecy and Christ’s ministry in the heavenly sanctuary.</small></span>${icon('arrow-up-right')}</button></div><div class="ppx-quote"><p>“${safe(originalCopy.home.quote)}”</p><cite>${safe(originalCopy.home.quoteSource)}</cite>${egwLinks([['GC',37,'599.3']])}</div></section><section class="ppx-sabbath"><div><div class="ppx-kicker">A time to rest and worship</div><h2>Remember the Sabbath.</h2><p>From sunset Friday to sunset Saturday.</p><button type="button" class="ppx-text-link" data-page-link="beliefs">Explore the biblical foundation ${icon('arrow-up-right')}</button></div><div><blockquote>“Remember the sabbath day, to keep it holy.”</blockquote><cite>Exodus 20:8 · KJV</cite></div></section><section class="ppx-connect"><div><h2>Bring your questions.<br>Let’s open the Bible.</h2><p>Have a study question or a prayer request? We’d love to hear from you.</p></div>${action('Get in touch','contact','dark')}</section>`;

','dark')}</section>`;

  function contact(){
    return intro('Connect with the ministry','Contact Us','Have a question or want to connect? Send us a message below, or submit a prayer request.')+`<section class="ppx-section ppx-contact-layout"><div><div class="ppx-kicker">Get in touch</div><h2>What’s on your heart?</h2><p>Have a question about a study, a prayer request, or something you’d like to share? We’d love to hear from you.</p><a class="ppx-email" href="mailto:peculiarpioneers@gmail.com">peculiarpioneers@gmail.com</a><div class="ppx-scripture-panel" style="margin-top:26px">${icon('heart-handshake')}<blockquote>“Pray one for another…”</blockquote><cite>James 5:16 · KJV excerpt</cite></div></div><form class="ppx-contact-form"><div class="ppx-form-row"><label>Your name<input name="name" type="text" autocomplete="name" placeholder="First and last name" required></label><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label></div><label>I’m reaching out about<select name="subject"><option>A Bible question</option><option>The ministry</option><option>The coming Bible app</option><option>Supporting the ministry</option><option>Something else</option></select></label><label class="ppx-prayer-choice"><input type="checkbox" name="prayer">This is a prayer request</label><label>Your message<textarea name="message" placeholder="Share what’s on your heart…" required></textarea></label><button type="submit" class="ppx-action ppx-action-dark">Send message ${icon('arrow-up-right')}</button><div class="ppx-form-feedback" role="status" hidden>This is a design preview. Your message has not been sent or saved.</div></form></section>`;
  }
  function beliefs(){
